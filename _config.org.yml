# m2slide 설정
#      _doc_work/z_done/_config.org.yml 에 추가 설명

# 프로젝트 경로: Projects/{current_project}

# current_project: MarkdownGraph
theme: default                   # theme/{name}/slide.css + layouts/ (default 외에는 .gitignore 처리)
theme_default_layout: contents   # 슬라이드 기본 layout (모든 본문 슬라이드를 layout-_contents로 wrap → §2 노랑 가로선 적용)
cover_enabled: true              # true 시 첫 파일 첫 슬라이드 위치에 cover 자동 주입
toc_placeholder: true            # true 시 모든 파일에 #/0 TOC 슬라이드 강제 삽입(Chapter모드에서 Only)
cards_placeholder: true          # true 시 hasTocItems 챕터에 Cards Page(autoToc cards) 자동 삽입
top_align: false                 # true 시 reveal.js 중앙정렬 덮어쓰고 'top-align-mode' 클래스 적용 (주의)
markmap_depth: 2                 # Markmap 초기 펼침 깊이 (1=루트+1단계, 2=2단계까지)
chapter_markmap_depth: 3         # 챕터별 페이지 Markmap 펼침 깊이 (markmap_depth+1 권장)
head_left: d1                    # Issue141: _contents head-bar 좌측: d1~d99 절대 depth | now (breadcrumb) | none (비표시)
head_right: now                  # Issue141: _contents head-bar 우측: 동일 옵션. now는 다른 head 옵션 d{m}이면 d{m+1}부터 현재까지 ' > ' 연결
title_contents_gap: 30           # title↔contents 갭 (title 높이의 %)
auto_layout_detect: true         # false: 자동 감지 비활성화 (모든 슬라이드는 default layout 사용)

# `![alt](path.mp4)` 형태로 작성하면 <video> 태그로 자동 변환됨
# controls, autoplay-muted, autoplay-loop, loop, muted, background, minimal, autoplay-nocontrols
video_default: controls       # 컨트롤만, 자동재생 없음 (기본 권장)
guide_line: false             # 레이아웃 디버깅용 가이드 라인 표시
use_open_props: false         # Open Props CDN 로드 (false=기본값 사용)
slide_ratio: "3:2"            # 16:9 (default) | 3:2 | fill (비율 무제약). Issue63: --slide-ratio 변수로 노출됨. Issue65: 화이트리스트 외 입력은 빌드 실패
slide_outer_padding: 0        # outer padding (슬라이드↔뷰포트 대칭). CSS length (예: 0, 20px, 2vh) — body padding에 적용 (Issue85: 4면 균등)
slide_inner_padding: 0        # inner padding (콘텐츠↔슬라이드 경계 대칭). CSS length — section padding에 적용

page_number_mode: global      # global (default) = 전역 누적 + breadcrumb / local = 챕터별 c/t (Reveal 기본)
breadcrumb: true              # true (default) = 챕터번호 prefix 표시 (page_number_mode: global일 때만 의미)
                              # 출력 예: '3 › 9 / 19' (chapter 3, 전역 9번째 / 총 19) — breadcrumb=false 시 '9 / 19'

nav_indicator: both           # both (default) = 마름모(↑/↓) + ←/→ + 페이지번호 모두 표시
                              # diamond = 마름모 + ←/→만 (페이지번호 숨김)
                              # page = 페이지번호만 (마름모 + ←/→ 모두 숨김)

# 슬라이드 전환·배경 트랜지션 전역 기본값 (reveal.js Reveal.initialize에 그대로 전달)
#   - default_transition            : 일반 페이지
#   - default_background_transition : 첫페이지나 마지막 페이지
#       none / fade / slide / convex / concave / zoom
#   - default_transition_speed: default / fast / slow
animation:
  default_transition: convex
  default_transition_speed: default
  default_background_transition: zoom


# 스타일 설정 (Issue64 1.b 정책)
# - 기본값은 lib/css/base.css :root에 정의됨. lib/config.js styleConfig가 동일값으로 동기화됨.
# - 본 섹션은 기본값에서 벗어나는 override만 명시.
# - 자주 바꾸는 키(font_size, font_family)는 주석으로 가이드만 표시 (필요 시 주석 해제 후 값 변경).
# - font_import[]는 base.css @import에 추가 로드되는 legacy 호환 (필요 시 추가).
style:
  theContents:
    # font_family: 'Nanum Gothic Coding'   # 기본값 (override 시 주석 해제)
    # font_size: 1em                       # 기본값 (override 시 주석 해제)
    font_size_auto: true              # true=자동 조절, false=원래 크기 유지
    font_size_min: 20px               # 자동 조절 시 최소 폰트 크기
    font_size_max_ratio: 0.66         # 본문 최대 = 제목 × 비율 (과확대 방지)
    media_container_enlarge: fit      # 이미지/SVG 크기 조절 (original/width/height/fit)
