# m2slide 설정 — Projects/ComponentTest (Issue180 시각화 라이브러리 검증 샘플)

theme: default                       # theme/{name}/slide.css + layouts/
theme_default_layout: contents       # 슬라이드 기본 layout
cover_enabled: true                  # 첫 슬라이드 위치에 cover 자동 주입
toc_placeholder: true                # 모든 파일에 #/0 TOC 슬라이드 삽입
top_align: false
markmap_depth: 2
chapter_markmap_depth: 3
title_contents_gap: 30
auto_layout_detect: true
guide_line: false                    # 레이아웃 디버그 라인 비표시
slide_ratio: "3:2"

# 스타일 설정
style:
  theContents:
    font_size_auto: true
    font_size_min: 20px
    font_size_max_ratio: 0.66
    media_container_enlarge: fit
