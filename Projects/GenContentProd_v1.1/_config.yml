# Projects/GenContentProd_v1.1/_config.yml
# Generated by ppt2m2slide agent (md_first mode, 2026-05-27)
# Source: Projects/_ppt/GenContentsProd_v1.0/GenContetntsProd_v1.0.pptx (104 slides)
# Re-conversion: PDF copy-mode 산출물 → md_first 정책 적용 (텍스트·이미지 의미 단위 재구성)

theme: default_lec
palette: default

slide_ratio: "3:2"

markmap_depth: 2
chapter_markmap_depth: 3

cover_enabled: true

# chapter mode: agenda + toc-placeholder 비활성화 (사용자 요청 2026-05-27)
toc_placeholder: false              # chapter 진입 toc-placeholder 미주입
cards_placeholder: false            # cards-placeholder 자동 주입 미사용 (사용자 요청 2026-05-27)
toc_card_mode: true                 # (toc_placeholder=false 라서 무영향, 기록만 유지)
agenda_enabled: false               # agenda.html 미생성 — cover → 첫 챕터 직행

# layout 자동 감지 활성 — image-only 슬라이드는 _blank, 본문 슬라이드는 _contents
auto_layout_detect: true

theme_default_layout: contents

# Style — column 내 multi-image 안정성
style:
  theContents:
    media_container_enlarge: fit

# Operational meta
mode_hint: chapter
