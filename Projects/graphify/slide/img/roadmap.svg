<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <style>
      text { font-family: 'Apple SD Gothic Neo', 'Pretendard', 'Noto Sans KR', sans-serif; }
    </style>
    <!-- 그라디언트 배경 -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
    <!-- 화살표 마커 -->
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b"/>
    </marker>
    <marker id="arr-gold" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="800" height="500" fill="url(#bg)" rx="12"/>

  <!-- 제목 -->
  <text x="400" y="44" font-size="18" fill="#1e293b" text-anchor="middle" font-weight="bold">graphify 시작 로드맵</text>
  <line x1="100" y1="56" x2="700" y2="56" stroke="#cbd5e1" stroke-width="1"/>

  <!-- 레이블 구분선 -->
  <rect x="30" y="68" width="560" height="24" fill="#dcfce7" rx="4"/>
  <text x="310" y="84" font-size="11" fill="#15803d" text-anchor="middle" font-weight="bold">지금 바로 시작</text>
  <rect x="612" y="68" width="158" height="24" fill="#f3e8ff" rx="4"/>
  <text x="691" y="84" font-size="11" fill="#7e22ce" text-anchor="middle" font-weight="bold">고급 (선택)</text>

  <!-- 중앙 연결선 (스텝 1~3) -->
  <line x1="174" y1="200" x2="310" y2="200" stroke="#22c55e" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="446" y1="200" x2="582" y2="200" stroke="#22c55e" stroke-width="2" marker-end="url(#arr)"/>
  <!-- 스텝 3→4 점선 (고급) -->
  <line x1="650" y1="200" x2="666" y2="200" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arr-gold)"/>

  <!-- ── 스텝 1: /graphify . ── -->
  <rect x="30" y="110" width="280" height="270" fill="#f0fdf4" rx="12" stroke="#22c55e" stroke-width="2"/>
  <rect x="30" y="110" width="280" height="8" fill="#22c55e" rx="12"/>
  <rect x="30" y="118" width="280" height="4" fill="#22c55e"/>

  <circle cx="170" cy="160" r="24" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="170" y="153" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="bold">STEP</text>
  <text x="170" y="172" font-size="18" fill="#15803d" text-anchor="middle" font-weight="bold">1</text>

  <text x="170" y="210" font-size="14" fill="#15803d" text-anchor="middle" font-weight="bold">첫 빌드</text>
  <rect x="50" y="220" width="240" height="28" fill="#1e293b" rx="5"/>
  <text x="170" y="239" font-size="13" fill="#86efac" text-anchor="middle" font-family="monospace">/graphify .</text>

  <text x="170" y="272" font-size="11" fill="#475569" text-anchor="middle">현재 폴더 전체 분석</text>
  <text x="170" y="290" font-size="11" fill="#475569" text-anchor="middle">graphify-out/ 생성</text>

  <rect x="50" y="306" width="240" height="50" fill="#dcfce7" rx="6"/>
  <text x="170" y="325" font-size="10" fill="#64748b" text-anchor="middle">산출물</text>
  <text x="170" y="343" font-size="10" fill="#166534" text-anchor="middle">graph.html · graph.json</text>
  <text x="170" y="358" font-size="10" fill="#166534" text-anchor="middle">GRAPH_REPORT.md</text>

  <!-- ── 스텝 2: /gq 질의 ── -->
  <rect x="316" y="110" width="280" height="270" fill="#eff6ff" rx="12" stroke="#3b82f6" stroke-width="2"/>
  <rect x="316" y="110" width="280" height="8" fill="#3b82f6" rx="12"/>
  <rect x="316" y="118" width="280" height="4" fill="#3b82f6"/>

  <circle cx="456" cy="160" r="24" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="456" y="153" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="bold">STEP</text>
  <text x="456" y="172" font-size="18" fill="#1d4ed8" text-anchor="middle" font-weight="bold">2</text>

  <text x="456" y="210" font-size="14" fill="#1d4ed8" text-anchor="middle" font-weight="bold">질의 탐색</text>
  <rect x="336" y="220" width="240" height="28" fill="#1e293b" rx="5"/>
  <text x="456" y="239" font-size="13" fill="#93c5fd" text-anchor="middle" font-family="monospace">/gq "질문"</text>

  <text x="456" y="272" font-size="11" fill="#475569" text-anchor="middle">graphify query 래퍼</text>
  <text x="456" y="290" font-size="11" fill="#475569" text-anchor="middle">필요 노드만 반환</text>

  <rect x="336" y="306" width="240" height="50" fill="#dbeafe" rx="6"/>
  <text x="456" y="325" font-size="10" fill="#64748b" text-anchor="middle">tip</text>
  <text x="456" y="343" font-size="10" fill="#1d4ed8" text-anchor="middle">query / path / explain</text>
  <text x="456" y="358" font-size="10" fill="#1d4ed8" text-anchor="middle">3종 CLI 자유롭게 활용</text>

  <!-- ── 스텝 3: /graphify-brief ── -->
  <rect x="602" y="110" width="166" height="270" fill="#ecfeff" rx="12" stroke="#06b6d4" stroke-width="2"/>
  <rect x="602" y="110" width="166" height="8" fill="#06b6d4" rx="12"/>
  <rect x="602" y="118" width="166" height="4" fill="#06b6d4"/>

  <circle cx="685" cy="160" r="24" fill="#cffafe" stroke="#06b6d4" stroke-width="2"/>
  <text x="685" y="153" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="bold">STEP</text>
  <text x="685" y="172" font-size="18" fill="#0e7490" text-anchor="middle" font-weight="bold">3</text>

  <text x="685" y="210" font-size="12" fill="#0e7490" text-anchor="middle" font-weight="bold">요약 리포트</text>
  <rect x="616" y="220" width="138" height="36" fill="#1e293b" rx="5"/>
  <text x="685" y="235" font-size="10" fill="#67e8f9" text-anchor="middle" font-family="monospace">/graphify-brief</text>
  <text x="685" y="250" font-size="10" fill="#67e8f9" text-anchor="middle" font-family="monospace">"&lt;주제&gt;"</text>

  <text x="685" y="282" font-size="10" fill="#475569" text-anchor="middle">50줄 이내</text>
  <text x="685" y="298" font-size="10" fill="#475569" text-anchor="middle">종합 요약</text>

  <rect x="616" y="306" width="138" height="50" fill="#cffafe" rx="6"/>
  <text x="685" y="325" font-size="10" fill="#64748b" text-anchor="middle">산출물</text>
  <text x="685" y="343" font-size="10" fill="#0e7490" text-anchor="middle">brief.md 생성</text>
  <text x="685" y="358" font-size="10" fill="#0e7490" text-anchor="middle">토큰 최소 소비</text>

  <!-- ── 하단 고급 배너 ── -->
  <rect x="30" y="406" width="740" height="68" fill="#faf5ff" rx="10" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="400" y="428" font-size="13" fill="#7e22ce" text-anchor="middle" font-weight="bold">고급: Cross-repo merge</text>
  <text x="400" y="450" font-size="11" fill="#475569" text-anchor="middle">여러 레포를 단일 그래프로 통합 —</text>
  <text x="400" y="466" font-size="11" fill="#475569" text-anchor="middle">마이크로서비스 의존성, 모노레포 분석에 활용</text>
</svg>
