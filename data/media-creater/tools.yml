# media-creater v2 SSOT — 시각화 도구·패턴 매핑·생성 명세·검증·체크포인트.
# 사용자가 본 파일을 수정하면 SCAR 본문 변경 없이 즉시 반영됨 (agent가 호출 시점에 매번 Read).
# Issue172 (Issue169 info-filler 패턴 적용).
---
version: 2

# ============================================================================
# 1. 미디어 생성 도구 카탈로그
# ============================================================================
tools:
  - id: mermaid_inline
    type: diagram
    handler: inline_codeblock
    triggers:
      - "flowchart"
      - "sequenceDiagram"
      - "classDiagram"
      - "stateDiagram"
      - "erDiagram"
      - "gantt"
      - "pie"
      - "mindmap"
    output: inline             # ```mermaid 블록 그대로
    fallback: img/{name}.svg   # 인라인 실패 시 mmdc로 SVG 생성
    delegate_skill: make-mermaid

  - id: mermaid_svg
    type: diagram
    handler: mmdc              # mermaid-cli
    triggers: ["complex_diagram"]
    output_path: img/
    output_format: svg
    delegate_skill: make-mermaid

  - id: excalidraw
    type: hand_drawn
    handler: excalidraw-for-code
    triggers:
      - "architecture"
      - "system_overview"
      - "freeform_diagram"
    output_path: img/
    output_format: [svg, png, excalidraw]
    delegate_skill: excalidraw-diagram

  - id: design_html
    type: infographic
    handler: design-html
    triggers:
      - "infographic"
      - "complex_layout"
    output_path: img/
    output_format: [html, png]

  # Issue287 — 이미지 생성 백엔드 (설계 SSOT: _doc_arch/media-creater-image-backend.md)
  - id: svg_direct
    type: vector_illustration
    handler: claude_svg_authoring    # agent(Claude)가 SVG 마크업 직접 저작 → img/ 저장
    triggers:
      - "일러스트"
      - "아이콘"
      - "개념 그림"
      - "배경 장식"
      - "벡터"
      - "illustration"
      - "icon"
    output_path: img/
    output_format: svg
    style_source: info_field_map     # image_style → design_mood → default 재사용 (§4)
    constraints:
      - "viewBox 필수 (반응형 스케일)"
      - "외부 참조(href·image·@import) 금지 — file:// 단일 파일 배포 규약 (file-deployment-rules)"
      - "텍스트는 시스템 폰트 계열 지정 (웹폰트 참조 금지)"
    note: "사진 리얼리즘 불필요한 벡터 표현 전담. 사진류는 free_image가 1차."

  - id: free_image
    type: photo
    handler: free-image              # .claude/skills/free-image (Openverse CC 검색·다운로드)
    triggers:
      - "사진"
      - "실사"
      - "인물"
      - "풍경"
      - "실물"
      - "photo"
    invocation: 'python3 .claude/skills/free-image/fetch.py --query "<영어 검색어>" --out Projects/<Name>/img --license cc0,by --prefix <slide_id>'
    output_path: img/
    output_format: jpg
    credits: "CREDITS.md 자동 기록 — CC-BY 포함 시 덱 마지막 credits 슬라이드 의무 (SKILL.md 절차)"
    retry: "rc 3 시 검색어 변경 1회 재시도 → 재실패 시 image_fallback_chain 강등"

  - id: image_placeholder
    type: photo
    handler: placeholder_png
    triggers:
      - "photo"
      - "ui_screenshot"
      - "real_image"
    output_path: img/
    output_format: png
    delegate_skill: gemini-image-describer
    spec_dir: _doc_work/media/      # 외부 생성 위임 명세 위치
    note: "Issue287 이후 최종 fallback으로 강등 — 사진류 1차는 free_image (image_fallback_chain 참조)"

  - id: gemini_describe
    type: image_caption
    handler: gemini-image-describer
    triggers: ["existing_image_needs_caption"]

  - id: chart_inline
    type: chart
    handler: inline_codeblock
    library: chartjs                 # ⇐ component-libraries.yml id 참조 (Issue181)
    triggers:
      - "bar_chart"
      - "line_chart"
      - "pie_chart"
      - "비교 수치"
      - "추세"
    output: fenced                   # ```chart 블록 그대로 유지 — 코어 디스패처가 Chart.js 렌더
    fenced_lang: chart

  - id: map_inline
    type: map
    handler: inline_codeblock
    library: leaflet                 # ⇐ component-libraries.yml id 참조 (Issue182)
    triggers:
      - "지도"
      - "위치"
      - "지리"
      - "경로"
    output: fenced                   # ```map 블록 — 코어 디스패처가 Leaflet 렌더
    fenced_lang: map

  - id: d3_inline
    type: infographic
    handler: inline_codeblock
    library: d3                      # ⇐ component-libraries.yml id 참조 (Issue182)
    triggers:
      - "인포그래픽"
      - "커스텀 시각화"
      - "관계도"
      - "그래프"
      - "네트워크"
    output: fenced                   # ```d3 블록 — 코어 디스패처가 d3 렌더
    fenced_lang: d3

  # Issue184 — 시각화 4도구 통합 (사용자 지정 선택 기준)
  - id: react_artifact
    type: interactive
    handler: inline_codeblock
    library: react                   # ⇐ component-libraries.yml id 참조 (Issue184)
    triggers:
      - "인터랙티브"
      - "동적 UI"
      - "상태 변화"
      - "기본"
    output: fenced                   # ```react 블록 — 코어 디스패처가 Babel+React 렌더
    fenced_lang: react
    note: "기본(fallback) 도구 — 다른 content_pattern_rules 미매칭 시 선택"

  - id: html_artifact
    type: decorative
    handler: inline_codeblock        # ```wordart 블록 — raw HTML passthrough (CDN·hook 없음)
    triggers:
      - "장식 텍스트"
      - "타이틀 강조"
      - "WordArt"
      - "Cards 초과"
    output: fenced
    fenced_lang: wordart
    note: "WordArt 장식 텍스트 — Cards 로 표현하기 복잡한 경우. 순수 CSS(theme .wordart-*)"

# ============================================================================
# 2. 본문 패턴 → 도구 매핑 (Selection Rules)
# ============================================================================
# Issue184 4도구 선택 기준 (사용자 지정):
#   - react_artifact : 기본(fallback) — selection_policy.default_tool
#   - html_artifact  : Cards 로 구현하기 복잡한 경우
#   - excalidraw     : mermaid diagram 으로 구현하기 너무 복잡한 경우
#   - d3_inline      : 그래프·시각화에 가까운 경우
# mermaid·chart·map 은 명시적 다이어그램/데이터 신호에 한해 기존 룰 유지.
content_pattern_rules:
  - id: sequential_steps
    label: 순차 단계·프로세스
    body_patterns: ["단계", "절차", "프로세스", "step", "process", "flow", "흐름"]
    recommended_tool: mermaid_inline
    mermaid_type: "flowchart LR"

  - id: time_sequence
    label: 시간 순서·이벤트
    body_patterns: ["시간", "이벤트", "통신", "interaction", "sequence"]
    recommended_tool: mermaid_inline
    mermaid_type: "sequenceDiagram"

  - id: hierarchy_tree
    label: 계층·트리
    body_patterns: ["계층", "트리", "구조", "hierarchy", "tree", "분류"]
    recommended_tool: mermaid_inline
    mermaid_type: "graph TD"

  - id: class_relation
    label: 클래스·관계
    body_patterns: ["클래스", "관계", "class", "relation", "schema"]
    recommended_tool: mermaid_inline
    mermaid_type: "classDiagram"

  - id: state_transition
    label: 상태 전이
    body_patterns: ["상태", "전이", "state", "transition"]
    recommended_tool: mermaid_inline
    mermaid_type: "stateDiagram-v2"

  - id: ratio_distribution
    label: 비율·분포 (수치 있음)
    body_patterns: ["비율", "분포", "percent", "ratio", "%"]
    recommended_tool: mermaid_inline
    mermaid_type: "pie"

  - id: freeform_architecture
    label: 자유형 다이어그램·복잡 구조 (mermaid 초과)
    body_patterns: ["아키텍처", "architecture", "system", "전체 구조", "손그림", "스케치"]
    recommended_tool: excalidraw
    note: "mermaid diagram 으로 구현하기 너무 복잡한 경우 (Issue184 기준)"

  - id: photo_screenshot
    label: 사진·실사·UI 스크린샷
    body_patterns: ["사진", "스크린샷", "이미지", "photo", "screenshot"]
    recommended_tool: free_image
    note: "Issue287 — 1차 free_image (CC 스톡 검색, 생성보다 검색 우선). 실패 시 image_fallback_chain 강등, image_placeholder는 최종 fallback"

  - id: vector_illustration
    label: 벡터 일러스트·아이콘·개념 그림 (사진 리얼리즘 불필요)
    body_patterns: ["일러스트", "아이콘", "개념 그림", "배경 장식", "벡터", "illustration", "icon"]
    recommended_tool: svg_direct
    note: "Issue287 — photo 신호가 먼저 흡수한 뒤 평가. 미매칭 시 react_artifact fallback 유지"

  - id: decorative_text
    label: 장식 텍스트·타이틀 강조 (Cards 초과)
    body_patterns: ["장식 텍스트", "타이틀 강조", "WordArt", "강조 문구", "꾸민 제목"]
    recommended_tool: html_artifact
    note: "Cards 로 구현하기 복잡한 장식 HTML — WordArt 효과 (Issue184 기준)"

  - id: infographic_layout
    label: 인포그래픽 (HTML 기반)
    body_patterns: ["infographic", "complex_layout"]
    recommended_tool: design_html

  - id: numeric_chart
    label: 수치 데이터 차트 (막대·꺾은선·원형)
    body_patterns: ["막대 그래프", "꺾은선", "차트", "chart", "데이터 비교", "추세 그래프"]
    recommended_tool: chart_inline

  - id: geo_map
    label: 지리·위치 지도
    body_patterns: ["지도", "위치", "지리", "경로", "map"]
    recommended_tool: map_inline

  - id: custom_infographic
    label: 커스텀 데이터 시각화·그래프 (d3)
    body_patterns: ["커스텀 시각화", "관계도", "네트워크 그래프", "그래프", "d3"]
    recommended_tool: d3_inline
    note: "그래프·시각화에 가까운 경우 (Issue184 기준)"

# ============================================================================
# 2.5. 선택 정책 (Selection Policy) — Issue184
# ============================================================================
# media-creater agent 는 content_pattern_rules 를 순서대로 평가하여 첫 매칭 룰의
# recommended_tool 을 채택한다. 어느 룰도 매칭되지 않으면 default_tool 을 사용한다.
selection_policy:
  evaluation: first_match            # content_pattern_rules 위→아래 첫 매칭 채택
  default_tool: react_artifact       # 미매칭 시 기본 — 인터랙티브 React artifact
  priority_note: |
    mermaid·chart·map 룰이 명시적 다이어그램/데이터 신호를 먼저 흡수하고,
    excalidraw(mermaid 초과)·html_artifact(Cards 초과)·d3(그래프) 가 그다음,
    어느 것도 아니면 react_artifact 가 기본값으로 적용된다.

# 이미지 계열 실패 강등 체인 (Issue287 — fail-loud. 설계 SSOT: _doc_arch/media-creater-image-backend.md)
image_fallback_chain:
  order: [free_image, local_image_gen, svg_direct, image_placeholder]
  note: |
    free_image 실패(재시도 1회 포함) → local_image_gen (🚧 미설치 시 skip — prj55 설치·테스트
    완료 후 tools 등재 예정) → svg_direct (개념 도해로 대체) → image_placeholder (명세만).
    각 강등은 checkpoint 보고에 사유 1줄 명시 — 조용한 placeholder 방치 금지.

# ============================================================================
# 3. 처리 정책
# ============================================================================
processing_policy:
  body_preservation: true     # 본문 텍스트 변경 금지. mermaid 코드블록·이미지 placeholder만 추가
  mermaid_placement: "after_last_bullet"  # 본문 마지막 또는 의미상 적절한 위치
  image_reference_format: "![{alt_text}](./img/{slide_id}.{ext})"
  syntax_validation:
    mermaid:
      check_start_keyword: true
      check_closing_backticks: true
      external_validation_command: "mmdc --version"  # mmdc 가용 시
      auto_fix_attempts: 1
  placeholder_generation:
    method: "1x1 transparent PNG"
    command: "convert -size 1x1 xc:transparent {path}"
    fallback: "cp lib/m2slide/data/placeholder.png {path}"

# ============================================================================
# 4. 생성 명세 frontmatter 양식 (외부 도구 위임용)
# ============================================================================
# Issue175: body_format placeholder는 아래 info_field_map 규칙으로 Info.md에서 치환.
# image_style 빈 값이면 design_mood로 fallback (전반 톤을 image 세부 톤 baseline으로 사용).
info_field_map:
  style:
    primary: image_style       # Info.md "미디어 계획" → image_style (AI 이미지 세부 톤)
    fallback: design_mood      # image_style 빈 값 시 design_mood (전반 시각 톤)
    default: "minimal flat illustration"
  color_tone:
    primary: design_mood       # Info.md "미디어 계획" → design_mood (전반 시각 톤)
    default: "neutral"

spec_template:
  frontmatter:
    name: "{slide_id}"
    description: "이미지 생성 명세"
    date: "{today}"
    target: "img/{slide_id}.png"
  body_format: |
    # 슬라이드

    {slide_title}

    {body_excerpt}

    # 이미지 명세

    * 스타일: {style}        # info_field_map.style 규칙으로 치환 (image_style → design_mood → default)
    * 색상 톤: {color_tone}  # info_field_map.color_tone 규칙으로 치환 (design_mood → default)
    * 핵심 요소: {key_elements}
    * 크기: 1920×1080

    # 생성 도구 위임

    * {delegate_skill} 또는 사용자 수동 작업

# ============================================================================
# 5. 검증 규칙
# ============================================================================
validation_rules:
  - id: mermaid_syntax
    desc: "mermaid 코드블록 시작 키워드 + 종결 백틱 매칭"
    on_failure:
      retry_count: 1
      escalate_to_user_after: 2
  - id: image_placeholder_exists
    desc: "img/{slide_id}.png 파일 실존"
  - id: spec_frontmatter_complete
    desc: "_doc_work/media/{slide_id}.md frontmatter 4개 필드 모두 존재"
    fields: [name, description, date, target]
  - id: alt_text_required
    desc: "모든 이미지 참조에 alt 텍스트 존재"

# ============================================================================
# 6. 외부 이미지 출처 (수동 다운로드 시 참고)
# ============================================================================
stock_sources:
  - id: unsplash
    url: https://unsplash.com
    license: Unsplash License
  - id: openverse
    url: https://openverse.org
    license: CC
    skill: .claude/skills/free-image   # Issue287 — 수동 참고에서 자동 라우팅 승격 (free_image 도구)

# ============================================================================
# 7. 사용자 검토 체크포인트
# ============================================================================
checkpoint:
  template: |
    media-creater 산출 검토:
    - mermaid 인라인 삽입: {mermaid_count}건
    - excalidraw 생성 대기: {excalidraw_count}건
    - SVG 직접 저작: {svg_count}건
    - free-image 사진: {photo_count}건 (CREDITS.md 갱신 {credits_status})
    - 이미지 강등 발생: {fallback_count}건 — 사유: {fallback_reasons}
    - 이미지 생성 명세: {image_spec_count}건 (생성 도구 위임 대기)
    - 산출 위치: {paths}

    다음 단계 진행 가능? 또는 mermaid 코드 수정 필요?
  skip_flag: "--no-checkpoint"
  on_reject:
    action: ask_user_modifications
    max_iterations: 3

# ============================================================================
# 8. 종료 보고 양식
# ============================================================================
report_template: |
  ## media-creater 완료
  * 처리 슬라이드: {total_slides}
  * 시각화 후보 식별: {candidate_count}
      - mermaid 인라인: {mermaid_count}
      - excalidraw: {excalidraw_count}
      - svg 직접 저작: {svg_count}
      - free-image 사진: {photo_count}
      - 이미지 placeholder(최종 fallback): {image_count}
      - design-html: {html_count}
  * 외부 위임 명세 생성: {spec_count}건 ({spec_dir})
  * 검증: mermaid syntax {mermaid_status} / placeholder {placeholder_status}
  * 다음 단계: 단계 6 layout-selector

# ============================================================================
# 9. 비디오 정책
# ============================================================================
video_policy:
  v1: manual_recording        # 사용자 수동 녹화
  v2_candidate: screencast-cli

# ============================================================================
# 9.5. PPT 변환 미디어 보존 정책 (Issue233 — ppt2m2slide 학습)
# ============================================================================
# ppt2m2slide 변환 시 PPT 원본 이미지 자산을 그대로 보존하기 위한 규칙.
# media-creater 가 생성하는 새 미디어가 아니라 *추출된* 자산을 다루므로
# 일반 tools 카탈로그와 별도 섹션으로 정리.
ppt_extracted_media:
  # PPT 슬라이드별 이미지 추출 정책
  image_extraction:
    handler: pptx2md                # ~/.claude/skills/pptx2md
    output_dir: Projects/<Name>/markdown/img/
    naming: "<project_slug>_<index>.png"      # pptx2md 기본
    preserve_aspect_ratio: true
    deduplicate: true                          # 동일 이미지 중복 추출 방지
    forbidden_extensions: [.wmf, .emf]         # Windows Metafile — Chrome 미지원
  # PPT 텍스트박스가 이미지 위에 오버레이된 경우 (callout)
  image_overlay_callouts:
    detection_signal: "텍스트박스의 z-order > 이미지 z-order + 좌표 겹침 ≥ 50%"
    current_fallback: "콜아웃 텍스트를 슬라이드 본문 bullet 으로 분리"
    v2_options:
      - composite_capture: "PPT 슬라이드 전체를 PNG로 캡처 + 본문 텍스트 제거 (visual-first)"
      - svg_overlay: "추출 이미지에 SVG 텍스트 오버레이 합성 (semantic-preserving)"
      - manual_review: "_proposals/에 슬라이드 번호 + 콜아웃 텍스트 목록 기록 + 사용자 수동 배치"
  # PPT 슬라이드 background 이미지·도형
  background_shapes:
    rectangle_fill: ignored          # 단색 사각형 배경은 무시 (CSS 색상으로 대체)
    image_background: extract        # 배경 이미지는 별도 추출 → #background-image-* 디렉티브 사용 후보
    gradient: ignored                # 그라데이션 미지원 (v2)

  # ── 두 이미지 side-by-side 비교 레이아웃 ──────────────────────────
  # "source → arrow → rendered" 학습 패턴 또는 "before / after" 비교 슬라이드.
  # `::: columns` 는 width 강제로 빈 공간 발생 가능 → flex container 권장.
  pair_comparison_layout:
    trigger: |
      한 슬라이드에 두 이미지 (source/before + rendered/after) + 동일 height 비교 필요.
      ppt2m2slide heuristics composite_shape_images 도 이 패턴을 emit.
    emit_pattern: |
      <div style="display:flex; align-items:center; justify-content:center; gap:30px; margin:30px 0;">
        <img src="./img/{left}.png" alt="..." style="height:520px;">
        <img src="./img/{right}.png" alt="..." style="height:520px;">
      </div>
    rationale: |
      `::: columns` width 60/40 등 비율 강제 시 우측 column 폭 > 이미지 폭으로
      빈 공간 발생. flex + 동일 height 통일 시 자연스러운 시각 균형 + 화살표 연결.
      학습 사례: BasicKnowledgeForAI_small 표 슬라이드 — columns 60/40 → 빈 공간
      → flex + height:520px 로 전환.
    height_recommendation:
      default: 520px                  # 1080p 슬라이드 viewport 의 약 48%
      compact: 380px                  # 캡션·추가 텍스트 많을 때
      max: 600px                      # cf) 캡션 + bullet 있는 경우 상한
    when_not_to_use:
      - text_heavy_pair: "양쪽 모두 텍스트 위주면 ::: columns + .column width 권장"
      - asymmetric_size: "두 요소 size 차이 4배 이상이면 columns 명시 width 권장"

# ============================================================================
# 10. htmlArt 구조 도해 카탈로그 (active — core parser 구현 완료, Issue188)
# ============================================================================
# 들여쓰기 아웃라인 → 구조 도해(process/cycle/hierarchy/pyramid). PowerPoint SmartArt 대응 개념.
# ⚠ 산출물에 "SmartArt" 표기 금지 — htmlArt 사용.
#
# core 구현 완료 (markdown.js preprocessPandocDiv + theme/default·default_lec slide.css).
# 구조 도해 신호는 htmlArt 가 mermaid_inline 보다 우선 — content_pattern_rules 의
# sequential_steps·hierarchy_tree 보다 먼저 평가할 것.
htmlart:
  status: active
  handler: inline_fenced_div                 # `::: htmlart <type>` — markdown.js 가 처리
  design_doc: _doc_arch/htmlArt.md
  types_ref: data/htmlart/types.yml          # 에이전트 fast-path — 타입 + 결정표
  smartart_ref: data/htmlart/smartart-catalog.yml  # SmartArt 전체 참조 카탈로그
  fenced_div: "::: htmlart <type>"
  v1_types: [process, cycle, hierarchy, pyramid]
  triggers:
    - "순차 단계"
    - "프로세스"
    - "순환"
    - "라이프사이클"
    - "계층"
    - "트리"
    - "조직도"
    - "피라미드"
    - "비례 층"
  selection_hint: |
    구조 도해 신호(단계/순환/계층/비례)는 htmlArt 1차 후보.
    types.yml decision_table 을 위→아래 first-match 로 평가하여 타입 결정.

    ── vs 인포그래픽(d3_inline) 경계 ──────────────────────────────────
    · 텍스트 아웃라인 → 19개 타입 중 하나로 표현 가능  →  htmlArt
    · 커스텀 SVG·자유 시각화·데이터 주도·타입 미매칭   →  d3_inline
    · 핵심 차이: htmlArt = m2slide가 SVG 생성, d3 = 작성자 코드가 SVG 생성
    ────────────────────────────────────────────────────────────────────

    어느 신호도 미매칭 시 mermaid_inline 등 기존 룰로 위임.
