# media-creater v2 SSOT — 시각화 도구·패턴 매핑·생성 명세·검증·체크포인트.
# 사용자가 본 파일을 수정하면 SCAR 본문 변경 없이 즉시 반영됨 (agent가 호출 시점에 매번 Read).
# Issue172 (Issue169 info-filler 패턴 적용).
---
version: 2

# ============================================================================
# 1. 미디어 생성 도구 카탈로그
# ============================================================================
tools:
  - id: mermaid_inline
    type: diagram
    handler: inline_codeblock
    triggers:
      - "flowchart"
      - "sequenceDiagram"
      - "classDiagram"
      - "stateDiagram"
      - "erDiagram"
      - "gantt"
      - "pie"
      - "mindmap"
    output: inline             # ```mermaid 블록 그대로
    fallback: img/{name}.svg   # 인라인 실패 시 mmdc로 SVG 생성
    delegate_skill: make-mermaid

  - id: mermaid_svg
    type: diagram
    handler: mmdc              # mermaid-cli
    triggers: ["complex_diagram"]
    output_path: img/
    output_format: svg
    delegate_skill: make-mermaid

  - id: excalidraw
    type: hand_drawn
    handler: excalidraw-for-code
    triggers:
      - "architecture"
      - "system_overview"
      - "freeform_diagram"
    output_path: img/
    output_format: [svg, png, excalidraw]
    delegate_skill: excalidraw-diagram

  # Issue312 — 구 `design_html` 대체. `handler: design-html` 은 글로벌·로컬 어디에도 실재하지
  # 않는 orphan 이었고(2026-08-11 실측), 그 결과 인포그래픽 요구가 mermaid·htmlart 로 흘러가
  # 품질이 떨어졌다. 실동작하는 전용 생성기(ig-maker)로 교체한다.
  - id: ig_maker
    type: infographic
    handler: ig-maker                # 글로벌 subagent (~/.claude/agents/ig-maker.md)
    triggers:
      - "infographic"
      - "complex_layout"
      - "인포그래픽"
      - "구조적 텍스트 도해"
    output_path: img/
    output_format: svg               # ⚠️ m2slide 소비 산출물은 pptx 가 아니라 SVG 다
    output_name: "{ppt명}-{장표번호}.svg"
    source_attribution: none         # 자체 저작 산출물 → 슬라이드 출처 표시 불요
    input_bridge: lib/ig/capture-for-ig.sh   # md 덱 → PNG (ig-maker 입력 계약이 이미지 1장이므로)
    cost: "1장 = 약 33만 토큰 · 25~30분 (글로벌 실측)"
    gate: |
      ⚠️ 자동 팬아웃 금지. 선별·승인·팬아웃·조합·발행은 전부 ig-selector 소유이며
      `igselect.py cost` 가 hard_pages 이상에서 exit 4 로 끊는다. media-creater 는
      후보와 예상 비용을 제시하고 사용자 승인을 받은 뒤에만 진입한다.
    constraints:
      - "외부 참조(href·image·@import·웹폰트) 금지 — file:// 단일 파일 배포 규약"
      - "viewBox 필수 (반응형 스케일)"
      - "슬라이드 크롬(head-bar·페이지 번호·H2 제목) 복제 금지 — m2slide 가 렌더한다"
      - "원문 문구 보존 — 구조·묶음·관계만 재편"
    note: "그림에 갇힌 구조를 꺼내거나, 구조가 있는데 글로만 있는 장을 도해로 만든다."

  # 이미지 출처(::: source) 표시 정책 — 각 백엔드 source_attribution 필드로 판정:
  #   * none     = 자체 산출물(AI 생성·SVG 저작·placeholder) → 슬라이드 ::: source 표시 불요
  #   * required = 외부 수집물(CC 스톡 등) → 출처·credits 의무 (라이선스 준수)
  # 즉 생성/저작한 이미지는 출처 불요, 남의 것을 가져온 이미지만 출처 필수.
  # Issue287 — 이미지 생성 백엔드 (설계 SSOT: _doc_arch/media-creater-image-backend.md)
  - id: svg_direct
    type: vector_illustration
    handler: claude_svg_authoring    # agent(Claude)가 SVG 마크업 직접 저작 → img/ 저장
    triggers:
      - "일러스트"
      - "아이콘"
      - "개념 그림"
      - "배경 장식"
      - "벡터"
      - "illustration"
      - "icon"
    output_path: img/
    output_format: svg
    style_source: info_field_map     # image_style → design_mood → default 재사용 (§4)
    source_attribution: none         # 자체 저작(SVG) 산출물 → 슬라이드 출처(::: source) 표시 불요
    constraints:
      - "viewBox 필수 (반응형 스케일)"
      - "외부 참조(href·image·@import) 금지 — file:// 단일 파일 배포 규약 (file-deployment-rules)"
      - "텍스트는 시스템 폰트 계열 지정 (웹폰트 참조 금지)"
    note: "사진 리얼리즘 불필요한 벡터 표현 전담. 사진류는 free_image가 1차."

  - id: free_image
    type: photo
    handler: free-image              # .claude/skills/free-image (Openverse CC 검색·다운로드)
    triggers:
      - "사진"
      - "실사"
      - "인물"
      - "풍경"
      - "실물"
      - "photo"
    invocation: 'python3 .claude/skills/free-image/fetch.py --query "<영어 검색어>" --out Projects/<Name>/img --license cc0,by --prefix <slide_id>'
    output_path: img/
    output_format: jpg
    source_attribution: required     # 외부 CC 수집물 → 출처 표시 의무 (아래 credits)
    credits: "CREDITS.md 자동 기록 — CC-BY 포함 시 덱 마지막 credits 슬라이드 의무 (SKILL.md 절차)"
    retry: "rc 3 시 검색어 변경 1회 재시도 → 재실패 시 image_fallback_chain 강등"

  - id: local_image_gen
    type: photo_illustration
    handler: img-add                 # 글로벌 라우팅 스킬 (~/.claude/skills/img-add) — fg1 주력·jm4 폴백 자동 판정
    triggers:
      - "커스텀 일러스트"
      - "AI 이미지"
      - "생성 이미지"
      - "리얼리즘"
      - "컨셉 아트"
    # Issue293 — img-add 경유로 전환 (구 mflux-enqueue 직접 호출 = jm4 고정 경로 폐지)
    invocation: |
      # img-add 글로벌 스킬 호출 (Skill tool). 백엔드 선택·enqueue·폴링·회수·반응형 강등은 스킬이 수행
      #   --prompt   "<영어 프롬프트>"
      #   --output   <repo절대경로>/Projects/<Name>/img/<slide_id>.png   # 로컬 목적지(라우팅에 따라 스킬이 재구성)
      #   --project  <Name>
      #   [--width 1024] [--height 1024] [--steps 4] [--seed N]
      # 스킬이 최종 실패(fg1→jm4 편도 강등까지 소진)를 보고하면 image_fallback_chain 강등
    input_spec: _doc_work/media/{slide_id}.md   # 기존 생성 명세(spec_template §4) 소비 — 양식 무변경
    output_path: img/
    output_format: png
    source_attribution: none         # AI 자체 생성 산출물 → 슬라이드 출처(::: source) 표시 불요
    perf: "라우팅 백엔드에 따라 상이 — jm4(M4 Pro) 1024² 4-step ≈ 76초/장 실측(2026-07-13). fg1(NVIDIA)은 lms 대화중이면 중재 대기 발생. 대기열 있으면 + 선행 잡 시간"
    guard:
      - "⚠️ `mflux-generate`/`mflux-run`/`mflux-enqueue` 직접 실행 절대 금지, `flux-fg1`·`flux-jm4` 직접 호출도 금지 — 반드시 img-add 경유 (백엔드 판정·강등 로직이 img-add 에만 있음)"
      - "img-add 최종 실패(양쪽 백엔드 소진) 시 즉시 image_fallback_chain 강등 — fail-loud, 조용한 진행 금지"
      - "--output 은 로컬 절대경로 필수 + 디렉토리 사전 존재"
      - "다건 생성: 큐가 직렬화하므로 배치 제한 불요 — 단 5장↑ 요청 시 체크포인트에 예상 소요(장당 ~76초 × N + 대기열) 명시"
    note: "prompt는 명세의 스타일·색상 톤·핵심 요소를 영어 한 문장으로 합성. 재현성 필요 시 --seed 고정. 라우팅 SSOT: ~/.claude/skills/img-add/SKILL.md"

  - id: image_restyle
    type: photo_restyle
    handler: img-add                 # 동일 라우팅 스킬 — img2img 모드 (--image-path·--image-strength)
    # Issue293 — 공개 이미지(free_image 산출물)를 덱 스타일로 재해석. 후처리 도구이며 단독 선택되지 않음
    triggers:
      - "스타일 통일"
      - "톤 맞추기"
      - "일러스트풍 변환"
      - "restyle"
    invocation: |
      # img-add 글로벌 스킬 호출 (Skill tool) — img2img
      #   --image-path     <repo절대경로>/Projects/<Name>/img/<slide_id>.jpg   # free_image 원본(실존 필수)
      #   --image-strength 0.6        # 0.5~0.7 권장 — 낮을수록 원본 유지, 높을수록 재해석
      #   --prompt         "<영어 프롬프트: 원본 피사체 서술 + Info.md image_style 톤>"
      #   --output         <repo절대경로>/Projects/<Name>/img/<slide_id>_styled.png
      #   --project        <Name>
    output_path: img/
    output_format: png
    style_source: info_field_map     # image_style → design_mood → default (§4) — 프롬프트 톤 문구로 합성
    source_attribution: inherit_from_source
    attribution_note: |
      원본이 free_image(CC 스톡) 산출물이면 변형본은 2차적저작물 — 원본의 출처·라이선스 표기 의무를
      그대로 승계한다(CREDITS.md 항목 유지 + `::: source` 표시). "변형함(adapted)" 사실을 함께 기재.
      원본이 svg_direct·local_image_gen 등 자체 산출물이면 표시 불요(none).
    limits:
      - "⚠️ 정밀 편집 불가 — 색만·글자만 교체 같은 국소 편집은 schnell(distilled) 구조상 실패. strength 0.3↑ 는 원본 근사 복제, 0.1 은 스타일 드리프트(피사체 재생성) 실측(2026-07-13). 본 도구의 용도는 **덱 전체 톤 통일**에 한정"
      - "인물 사진 재해석은 얼굴 왜곡 위험 — 인물이 주 피사체면 restyle 생략하고 원본 유지 권장"
    guard:
      - "--image-path 는 실존 파일 절대경로. 미존재 시 restyle 생략(원본 그대로 사용) + 사유 1줄 보고"
      - "실패 시 image_fallback_chain 진입 금지 — 원본 free_image 산출물을 그대로 유지하고 사유만 보고 (사진이 이미 확보된 상태이므로 강등 불요)"
    note: "단독 라우팅 대상 아님 — processing_policy.style_unification 조건 충족 시 free_image 산출물에 대해서만 후처리로 실행"

  - id: image_edit
    type: photo_precise_edit
    handler: img-add                 # 동일 라우팅 스킬 — edit 모드 (--edit, fg1 FLUX Kontext 고정)
    # Issue305 — 기존 슬라이드 이미지의 국소 정밀 편집(색만·글자만 교체). 구도 보존이 목적.
    #   image_restyle(img2img)과 배타: restyle=덱 전체 톤 통일 / edit=한 이미지의 부분 교체
    triggers:
      - "색만 바꿔"
      - "글자만 교체"
      - "이 부분만 수정"
      - "구도 유지하고"
      - "정밀 편집"
    when_to_use: |
      기존 이미지를 **재생성하지 않고** 국소 수정할 때. 판정 기준은 "원본 구도·비편집 영역 보존이 필수인가"
      — 필수면 image_edit, 새로 만들어도 되면 local_image_gen, 덱 톤만 맞추면 image_restyle.
      대상 이미지는 이미 Projects/<Name>/img/ 에 실존해야 한다(생성 도구 아님).
    invocation: |
      # img-add 글로벌 스킬 호출 (Skill tool) — edit 모드. fg1 고정 라우팅(0절), jm4 강등 없음
      #   --edit
      #   --image-path       <repo절대경로>/Projects/<Name>/img/<slide_id>.png   # 편집 원본(실존 필수)
      #   --edit-instruction "<영어 지시 + 보존 절>"   # ex: "change the chart bars to blue, keep everything else unchanged"
      #   --edit-type        color|text|region        # 편집 종류 힌트
      #   [--steps 28] [--guidance-scale 2.5]         # Kontext 기본값. 낮은 steps=지시 반영 저하, 높은 guidance=원본 보존 저하
      #   --output           <repo절대경로>/Projects/<Name>/img/<slide_id>_edit.png
      #   --project          <Name>
      # --prompt 는 불필요(있어도 무시) — 편집 지시는 --edit-instruction 에만 넣는다
    input_spec: _doc_work/media/{slide_id}.md   # 기존 생성 명세 재사용 — 편집 지시는 명세 "편집 지시" 절에 기재
    output_path: img/
    output_format: png
    source_attribution: inherit_from_source
    attribution_note: |
      원본이 free_image(CC 스톡) 산출물이면 편집본은 2차적저작물 — 출처·라이선스 표기를 승계한다
      (CREDITS.md 항목 유지 + `::: source` 표시, "변형함(adapted)" 명시). 자체 산출물이면 표시 불요.
    perf: "steps 28 기준 ≈ 7분/건 실측(prj3 Issue277 스모크, 2026-07-29). 폴링 타임아웃 12분"
    limits:
      - "생성 도구 아님 — 편집 원본이 없으면 선택 불가. 원본 확보는 image_fallback_chain 이 선행"
      - "jm4 백엔드에 edit 파이프라인 없음 → fg1 전용. fg1 불가 시 대체 백엔드 없음"
      - "지시문은 영어 + 보존 절 명시가 원칙 — 보존 절 누락 시 비편집 영역까지 재해석될 수 있음"
      # 2026-07-29 실측 (Issue305 검증) — 편집 종류별 신뢰도가 다르다
      - "✅ color 편집은 신뢰 가능 — 일러스트 그릇 색 교체 1건에서 면·젓가락·배경·구도 전부 보존(1024², ~7분)"
      - "⚠️ text 편집은 **짧은 라벨·제목에 한정**. 텍스트가 밀집한 이미지(코드블록·표·다중 카드)는 지시한 문자열은 바뀌어도 **비편집 영역의 다른 텍스트가 gibberish 로 재생성**된다 — 슬라이드 캡처(1793×843, 카드 4개) 실측에서 지시 대상 헤딩은 교체됐으나 하단 카드 2개의 코드·한글이 붕괴(증거: _doc_work/capture/issue305-text-edit-evidence.png)"
      - "⚠️ 한글 텍스트는 재생성 품질이 낮다 — 한글이 포함된 영역은 text 편집 대상으로 삼지 말 것. 라틴 문자 짧은 라벨만 권장"
      - "⚠️ 문장부호 유실 가능 — 위 실측에서 `(File Ops)` → `(File Work` 로 닫는 괄호가 사라짐. 편집 후 육안 확인 필수"
    guard:
      - "⚠️ `flux-fg1`·`flux-enqueue` 직접 호출 금지 — 반드시 img-add `--edit` 경유 (img-add 필수 원칙 계승)"
      - "⚠️ 강등 금지 (fail-loud) — edit 실패 시 image_restyle(img2img)·local_image_gen 으로 조용히 대체하지 말 것. img2img 는 정밀 편집을 못 하므로(strength 0.3↑ 원본 복제 / 0.1 드리프트, 2026-07-13 실측) 사용자가 못 알아채는 품질 회귀가 된다. \"edit 백엔드 불가(사유)\" 명시 후 원본 유지·중단"
      - "--image-path 는 실존 파일 절대경로. 미존재 시 편집 생략 + 사유 1줄 보고"
      - "image_fallback_chain 진입 금지 — 원본이 이미 확보된 상태이므로 강등 불요(image_restyle 과 동일 정책)"
      - "원본 파일 덮어쓰기 금지 — `_edit` 접미 산출물로 저장하고 원본 보존(라이선스 추적·재편집 가능성)"
    note: "단독 라우팅 대상 아님 — processing_policy.precise_edit 조건 충족 시에만 후처리로 실행. 백엔드 SSOT: ~/.claude/skills/img-add/SKILL.md 0절 (edit 모드 분기)"

  - id: image_placeholder
    type: photo
    handler: placeholder_png
    triggers:
      - "photo"
      - "ui_screenshot"
      - "real_image"
    output_path: img/
    output_format: png
    delegate_skill: gemini-image-describer
    spec_dir: _doc_work/media/      # 외부 생성 위임 명세 위치
    note: "Issue287 이후 최종 fallback으로 강등 — 사진류 1차는 free_image (image_fallback_chain 참조)"

  - id: gemini_describe
    type: image_caption
    handler: gemini-image-describer
    triggers: ["existing_image_needs_caption"]

  - id: chart_inline
    type: chart
    handler: inline_codeblock
    library: chartjs                 # ⇐ component-libraries.yml id 참조 (Issue181)
    triggers:
      - "bar_chart"
      - "line_chart"
      - "pie_chart"
      - "비교 수치"
      - "추세"
    output: fenced                   # ```chart 블록 그대로 유지 — 코어 디스패처가 Chart.js 렌더
    fenced_lang: chart

  - id: map_inline
    type: map
    handler: inline_codeblock
    library: leaflet                 # ⇐ component-libraries.yml id 참조 (Issue182)
    triggers:
      - "지도"
      - "위치"
      - "지리"
      - "경로"
    output: fenced                   # ```map 블록 — 코어 디스패처가 Leaflet 렌더
    fenced_lang: map

  - id: d3_inline
    type: infographic
    handler: inline_codeblock
    library: d3                      # ⇐ component-libraries.yml id 참조 (Issue182)
    triggers:
      - "인포그래픽"
      - "커스텀 시각화"
      - "관계도"
      - "그래프"
      - "네트워크"
    output: fenced                   # ```d3 블록 — 코어 디스패처가 d3 렌더
    fenced_lang: d3

  # Issue184 — 시각화 4도구 통합 (사용자 지정 선택 기준)
  - id: react_artifact
    type: interactive
    handler: inline_codeblock
    library: react                   # ⇐ component-libraries.yml id 참조 (Issue184)
    triggers:
      - "인터랙티브"
      - "동적 UI"
      - "상태 변화"
      - "기본"
    output: fenced                   # ```react 블록 — 코어 디스패처가 Babel+React 렌더
    fenced_lang: react
    note: "기본(fallback) 도구 — 다른 content_pattern_rules 미매칭 시 선택"

  - id: html_artifact
    type: decorative
    handler: inline_codeblock        # ```wordart 블록 — raw HTML passthrough (CDN·hook 없음)
    triggers:
      - "장식 텍스트"
      - "타이틀 강조"
      - "WordArt"
      - "Cards 초과"
    output: fenced
    fenced_lang: wordart
    note: "WordArt 장식 텍스트 — Cards 로 표현하기 복잡한 경우. 순수 CSS(theme .wordart-*)"

# ============================================================================
# 2. 본문 패턴 → 도구 매핑 (Selection Rules)
# ============================================================================
# Issue184 4도구 선택 기준 (사용자 지정):
#   - react_artifact : 기본(fallback) — selection_policy.default_tool
#   - html_artifact  : Cards 로 구현하기 복잡한 경우
#   - excalidraw     : mermaid diagram 으로 구현하기 너무 복잡한 경우
#   - d3_inline      : 그래프·시각화에 가까운 경우
# mermaid·chart·map 은 명시적 다이어그램/데이터 신호에 한해 기존 룰 유지.
content_pattern_rules:
  - id: sequential_steps
    label: 순차 단계·프로세스
    body_patterns: ["단계", "절차", "프로세스", "step", "process", "flow", "흐름"]
    recommended_tool: mermaid_inline
    mermaid_type: "flowchart LR"

  - id: time_sequence
    label: 시간 순서·이벤트
    body_patterns: ["시간", "이벤트", "통신", "interaction", "sequence"]
    recommended_tool: mermaid_inline
    mermaid_type: "sequenceDiagram"

  - id: hierarchy_tree
    label: 계층·트리
    body_patterns: ["계층", "트리", "구조", "hierarchy", "tree", "분류"]
    recommended_tool: mermaid_inline
    mermaid_type: "graph TD"

  - id: class_relation
    label: 클래스·관계
    body_patterns: ["클래스", "관계", "class", "relation", "schema"]
    recommended_tool: mermaid_inline
    mermaid_type: "classDiagram"

  - id: state_transition
    label: 상태 전이
    body_patterns: ["상태", "전이", "state", "transition"]
    recommended_tool: mermaid_inline
    mermaid_type: "stateDiagram-v2"

  - id: ratio_distribution
    label: 비율·분포 (수치 있음)
    body_patterns: ["비율", "분포", "percent", "ratio", "%"]
    recommended_tool: mermaid_inline
    mermaid_type: "pie"

  - id: freeform_architecture
    label: 자유형 다이어그램·복잡 구조 (mermaid 초과)
    body_patterns: ["아키텍처", "architecture", "system", "전체 구조", "손그림", "스케치"]
    recommended_tool: excalidraw
    note: "mermaid diagram 으로 구현하기 너무 복잡한 경우 (Issue184 기준)"

  - id: photo_screenshot
    label: 사진·실사·UI 스크린샷
    body_patterns: ["사진", "스크린샷", "이미지", "photo", "screenshot"]
    recommended_tool: free_image
    note: "Issue287 — 1차 free_image (CC 스톡 검색, 생성보다 검색 우선). 실패 시 image_fallback_chain 강등, image_placeholder는 최종 fallback. Issue293 — 산출물은 processing_policy.style_unification 조건 충족 시 image_restyle 후처리 대상"

  - id: vector_illustration
    label: 벡터 일러스트·아이콘·개념 그림 (사진 리얼리즘 불필요)
    body_patterns: ["일러스트", "아이콘", "개념 그림", "배경 장식", "벡터", "illustration", "icon"]
    recommended_tool: svg_direct
    note: "Issue287 — photo 신호가 먼저 흡수한 뒤 평가. 미매칭 시 react_artifact fallback 유지"

  - id: custom_illustration
    label: 커스텀 일러스트·AI 생성 이미지 (사진 리얼리즘 필요)
    body_patterns: ["커스텀 일러스트", "AI 이미지", "생성 이미지", "리얼리즘", "컨셉 아트"]
    recommended_tool: local_image_gen
    note: "Issue287 P3 — AI 생성. Issue293 이후 img-add 글로벌 스킬 경유(fg1 주력·jm4 폴백). 양쪽 백엔드 소진 시 image_fallback_chain 강등"

  - id: decorative_text
    label: 장식 텍스트·타이틀 강조 (Cards 초과)
    body_patterns: ["장식 텍스트", "타이틀 강조", "WordArt", "강조 문구", "꾸민 제목"]
    recommended_tool: html_artifact
    note: "Cards 로 구현하기 복잡한 장식 HTML — WordArt 효과 (Issue184 기준)"

  - id: infographic_layout
    label: 인포그래픽 (ig-maker SVG)
    body_patterns: ["infographic", "complex_layout", "인포그래픽"]
    recommended_tool: ig_maker
    note: |
      Issue312 — 구 design_html(실체 없는 handler) 대체. 비용이 크므로 승인 게이트 뒤에서만
      진입한다(tools.ig_maker.gate). 단순 관계도는 mermaid_inline, 데이터 그래프는 d3_inline,
      균질 항목 나열은 htmlart/cards 가 여전히 더 싸고 적절하다.

  - id: numeric_chart
    label: 수치 데이터 차트 (막대·꺾은선·원형)
    body_patterns: ["막대 그래프", "꺾은선", "차트", "chart", "데이터 비교", "추세 그래프"]
    recommended_tool: chart_inline

  - id: geo_map
    label: 지리·위치 지도
    body_patterns: ["지도", "위치", "지리", "경로", "map"]
    recommended_tool: map_inline

  - id: custom_infographic
    label: 커스텀 데이터 시각화·그래프 (d3)
    body_patterns: ["커스텀 시각화", "관계도", "네트워크 그래프", "그래프", "d3"]
    recommended_tool: d3_inline
    note: "그래프·시각화에 가까운 경우 (Issue184 기준)"

# ============================================================================
# 2.5. 선택 정책 (Selection Policy) — Issue184
# ============================================================================
# media-creater agent 는 content_pattern_rules 를 순서대로 평가하여 첫 매칭 룰의
# recommended_tool 을 채택한다. 어느 룰도 매칭되지 않으면 default_tool 을 사용한다.
selection_policy:
  evaluation: first_match            # content_pattern_rules 위→아래 첫 매칭 채택
  default_tool: react_artifact       # 미매칭 시 기본 — 인터랙티브 React artifact
  priority_note: |
    mermaid·chart·map 룰이 명시적 다이어그램/데이터 신호를 먼저 흡수하고,
    excalidraw(mermaid 초과)·html_artifact(Cards 초과)·d3(그래프) 가 그다음,
    어느 것도 아니면 react_artifact 가 기본값으로 적용된다.

# 이미지 계열 실패 강등 체인 (Issue287 — fail-loud. 설계 SSOT: _doc_arch/media-creater-image-backend.md)
image_fallback_chain:
  order: [free_image, local_image_gen, svg_direct, image_placeholder]
  note: |
    free_image 실패(재시도 1회 포함) → local_image_gen (img-add 경유 — fg1→jm4 강등까지
    소진 시 skip) → svg_direct (개념 도해로 대체) → image_placeholder (명세만).
    각 강등은 checkpoint 보고에 사유 1줄 명시 — 조용한 placeholder 방치 금지.
    image_restyle 은 본 체인에 포함되지 않음 (후처리 도구 — 실패 시 원본 유지, keep_original).

# ============================================================================
# 3. 처리 정책
# ============================================================================
processing_policy:
  body_preservation: true     # 본문 텍스트 변경 금지. mermaid 코드블록·이미지 placeholder만 추가
  mermaid_placement: "after_last_bullet"  # 본문 마지막 또는 의미상 적절한 위치
  image_reference_format: "![{alt_text}](./img/{slide_id}.{ext})"
  syntax_validation:
    mermaid:
      check_start_keyword: true
      check_closing_backticks: true
      external_validation_command: "mmdc --version"  # mmdc 가용 시
      auto_fix_attempts: 1
  placeholder_generation:
    method: "1x1 transparent PNG"
    command: "convert -size 1x1 xc:transparent {path}"
    fallback: "cp lib/m2slide/data/placeholder.png {path}"

  # Issue293 — 공개 이미지(free_image 산출물) 스타일 통일. opt-in 후처리이며 기본은 비적용
  style_unification:
    enabled_when:
      - "Info.md `image_style` 이 명시되어 있을 것 (design_mood fallback 은 조건 미충족 — 사진 재해석은 명시 의도가 있을 때만)"
      - "대상 이미지가 free_image 산출물일 것 (자체 생성물은 이미 스타일 프롬프트로 만들어졌으므로 재처리 불요)"
      - "해당 슬라이드 이미지의 주 피사체가 인물이 아닐 것 (얼굴 왜곡 위험)"
    tool: image_restyle
    strength_default: 0.6       # 0.5~0.7 권장 구간의 중앙값
    on_failure: keep_original   # 실패 시 원본 사진 유지 + 사유 1줄 보고 (fallback_chain 강등 금지)
    attribution: |
      원본이 CC 스톡이면 변형본도 출처 표기 승계 — CREDITS.md 항목 유지 + "변형함(adapted)" 명시.
      원본 파일은 삭제하지 않고 img/ 에 함께 보존 (라이선스 추적·재처리 가능성).
    checkpoint: "restyle 적용 시 체크포인트에 원본↔변형본 파일명 쌍 + strength 값 보고"
    note: "정밀 편집(색만·글자만 교체)은 불가 — image_restyle.limits 참조. 덱 톤 통일 용도로만 사용. 국소 편집은 processing_policy.precise_edit 참조"

  # Issue305 — 기존 이미지의 국소 정밀 편집(색만·글자만). opt-in 후처리이며 기본은 비적용
  precise_edit:
    enabled_when:
      - "편집 대상 이미지가 Projects/<Name>/img/ 에 이미 실존할 것 (생성 경로가 아니라 수정 경로)"
      - "요청이 국소 변경일 것 — 색 교체·글자 교체·특정 요소만 수정. 전면 재해석 요청은 local_image_gen 이 담당"
      - "원본 구도·비편집 영역 보존이 요구될 것 (보존이 불필요하면 재생성이 더 싸고 빠름)"
    tool: image_edit
    edit_type_map:
      color: "색상 교체 — 특정 요소의 색만 변경 (ex: 막대그래프 색, 로고 색). 신뢰도 높음(2026-07-29 실측)"
      text: "문자 교체 — 이미지 내 글자·라벨 변경 (ex: 간판 문구, 캡션). ⚠️ 조건부 — 텍스트 밀집 이미지·한글은 비편집 영역 붕괴 위험(image_edit.limits 참조). 라틴 문자 짧은 라벨만"
      region: "영역 교체 — 특정 구역의 객체·배경 변경"
    text_edit_gate:               # text 편집 진입 추가 조건 (Issue305 실측 반영)
      - "대상 문자열이 라틴 문자일 것 — 한글 텍스트는 재생성 품질 미달"
      - "이미지 내 텍스트 밀도가 낮을 것 — 코드블록·표·다중 카드 캡처는 비편집 영역까지 붕괴"
      - "편집 후 육안 확인 필수 — 문장부호 유실 사례 있음. 붕괴 발견 시 on_failure 대로 원본 유지"
    instruction_format: |
      영어 + 보존 절 필수. 형식: "<change clause>, keep everything else unchanged"
      ex) "change the bar chart colors to blue, keep everything else unchanged"
      ex) "replace the sign text with 'm2slide', keep everything else unchanged"
    output_naming: "{slide_id}_edit.png"   # 원본 덮어쓰기 금지 — img/ 에 원본과 함께 보존
    on_failure: keep_original   # 실패 시 원본 유지 + 사유 1줄 보고 (fallback_chain 강등·img2img 대체 금지)
    attribution: |
      원본이 CC 스톡이면 편집본도 출처 표기 승계 — CREDITS.md 항목 유지 + "변형함(adapted)" 명시.
      원본 파일은 삭제하지 않고 img/ 에 함께 보존.
    checkpoint: "edit 적용 시 체크포인트에 원본↔편집본 파일명 쌍 + edit_type + 지시문 보고. 실패 시 사유 명시(조용한 img2img 대체 금지)"
    note: "image_restyle 과 배타 — restyle 은 덱 전체 톤 통일, precise_edit 은 한 이미지의 부분 교체. 두 조건이 동시에 걸리면 precise_edit 우선(더 구체적 의도)"

# ============================================================================
# 4. 생성 명세 frontmatter 양식 (외부 도구 위임용)
# ============================================================================
# Issue175: body_format placeholder는 아래 info_field_map 규칙으로 Info.md에서 치환.
# image_style 빈 값이면 design_mood로 fallback (전반 톤을 image 세부 톤 baseline으로 사용).
info_field_map:
  style:
    primary: image_style       # Info.md "미디어 계획" → image_style (AI 이미지 세부 톤)
    fallback: design_mood      # image_style 빈 값 시 design_mood (전반 시각 톤)
    default: "minimal flat illustration"
  color_tone:
    primary: design_mood       # Info.md "미디어 계획" → design_mood (전반 시각 톤)
    default: "neutral"

spec_template:
  frontmatter:
    name: "{slide_id}"
    description: "이미지 생성 명세"
    date: "{today}"
    target: "img/{slide_id}.png"
  body_format: |
    # 슬라이드

    {slide_title}

    {body_excerpt}

    # 이미지 명세

    * 스타일: {style}        # info_field_map.style 규칙으로 치환 (image_style → design_mood → default)
    * 색상 톤: {color_tone}  # info_field_map.color_tone 규칙으로 치환 (design_mood → default)
    * 핵심 요소: {key_elements}
    * 크기: 1920×1080

    # 생성 도구 위임

    * {delegate_skill} 또는 사용자 수동 작업

# ============================================================================
# 5. 검증 규칙
# ============================================================================
validation_rules:
  - id: mermaid_syntax
    desc: "mermaid 코드블록 시작 키워드 + 종결 백틱 매칭"
    on_failure:
      retry_count: 1
      escalate_to_user_after: 2
  - id: image_placeholder_exists
    desc: "img/{slide_id}.png 파일 실존"
  - id: spec_frontmatter_complete
    desc: "_doc_work/media/{slide_id}.md frontmatter 4개 필드 모두 존재"
    fields: [name, description, date, target]
  - id: alt_text_required
    desc: "모든 이미지 참조에 alt 텍스트 존재"
  - id: external_cc_source_attribution
    # goal-oriented 룰 (Issue304) — 스키마 정의 SSOT: _doc_arch/policy-goal-schema.md
    goal_type: attribution
    goal: "외부 수집 이미지(CC 스톡 등, source_attribution: required 백엔드 산출물)는 출처·라이선스 표기를 갖춘다 (덱 ::: source + CREDITS.md 항목). 자체 저작·AI 생성물(source_attribution: none)은 대상 아님"
    goal_check:
      require_source_url: true            # 외부 CC 이미지에 대응하는 출처 URL/credits 항목 존재
    desc: "source_attribution: required 백엔드(free_image 등) 산출 이미지는 ::: source 표시 + CREDITS.md 기록 의무"
    detect_hints:                         # 후보 축소용 — 단독 판정 금지
      - reason: "source_attribution: required 백엔드(free_image·image_restyle inherit) 산출 이미지"
        backend_field: "source_attribution == required|inherit_from_source"
    confidence: low                       # goal 스키마 전환 완료 · enforce 스캐너(require_source_url)는 후속

# ============================================================================
# 6. 외부 이미지 출처 (수동 다운로드 시 참고)
# ============================================================================
stock_sources:
  - id: unsplash
    url: https://unsplash.com
    license: Unsplash License
  - id: openverse
    url: https://openverse.org
    license: CC
    skill: .claude/skills/free-image   # Issue287 — 수동 참고에서 자동 라우팅 승격 (free_image 도구)

# ============================================================================
# 7. 사용자 검토 체크포인트
# ============================================================================
checkpoint:
  template: |
    media-creater 산출 검토:
    - mermaid 인라인 삽입: {mermaid_count}건
    - excalidraw 생성 대기: {excalidraw_count}건
    - SVG 직접 저작: {svg_count}건
    - free-image 사진: {photo_count}건 (CREDITS.md 갱신 {credits_status})
    - 이미지 강등 발생: {fallback_count}건 — 사유: {fallback_reasons}
    - 이미지 생성 명세: {image_spec_count}건 (생성 도구 위임 대기)
    - 산출 위치: {paths}

    다음 단계 진행 가능? 또는 mermaid 코드 수정 필요?
  skip_flag: "--no-checkpoint"
  on_reject:
    action: ask_user_modifications
    max_iterations: 3

# ============================================================================
# 8. 종료 보고 양식
# ============================================================================
report_template: |
  ## media-creater 완료
  * 처리 슬라이드: {total_slides}
  * 시각화 후보 식별: {candidate_count}
      - mermaid 인라인: {mermaid_count}
      - excalidraw: {excalidraw_count}
      - svg 직접 저작: {svg_count}
      - free-image 사진: {photo_count}
      - 이미지 placeholder(최종 fallback): {image_count}
      - ig-maker 인포그래픽 SVG: {ig_count}   # 승인 게이트 통과분만
  * 외부 위임 명세 생성: {spec_count}건 ({spec_dir})
  * 검증: mermaid syntax {mermaid_status} / placeholder {placeholder_status}
  * 다음 단계: 단계 6 layout-selector

# ============================================================================
# 9. 비디오 정책
# ============================================================================
video_policy:
  v1: manual_recording        # 사용자 수동 녹화
  v2_candidate: screencast-cli

# ============================================================================
# 9.5. PPT 변환 미디어 보존 정책 (Issue233 — ppt2m2slide 학습)
# ============================================================================
# ppt2m2slide 변환 시 PPT 원본 이미지 자산을 그대로 보존하기 위한 규칙.
# media-creater 가 생성하는 새 미디어가 아니라 *추출된* 자산을 다루므로
# 일반 tools 카탈로그와 별도 섹션으로 정리.
ppt_extracted_media:
  # PPT 슬라이드별 이미지 추출 정책
  image_extraction:
    handler: pptx2md                # ~/.claude/skills/pptx2md
    output_dir: Projects/<Name>/markdown/img/
    naming: "<project_slug>_<index>.png"      # pptx2md 기본
    preserve_aspect_ratio: true
    deduplicate: true                          # 동일 이미지 중복 추출 방지
    forbidden_extensions: [.wmf, .emf]         # Windows Metafile — Chrome 미지원
  # PPT 텍스트박스가 이미지 위에 오버레이된 경우 (callout)
  image_overlay_callouts:
    detection_signal: "텍스트박스의 z-order > 이미지 z-order + 좌표 겹침 ≥ 50%"
    current_fallback: "콜아웃 텍스트를 슬라이드 본문 bullet 으로 분리"
    v2_options:
      - composite_capture: "PPT 슬라이드 전체를 PNG로 캡처 + 본문 텍스트 제거 (visual-first)"
      - svg_overlay: "추출 이미지에 SVG 텍스트 오버레이 합성 (semantic-preserving)"
      - manual_review: "_proposals/에 슬라이드 번호 + 콜아웃 텍스트 목록 기록 + 사용자 수동 배치"
  # PPT 슬라이드 background 이미지·도형
  background_shapes:
    rectangle_fill: ignored          # 단색 사각형 배경은 무시 (CSS 색상으로 대체)
    image_background: extract        # 배경 이미지는 별도 추출 → #background-image-* 디렉티브 사용 후보
    gradient: ignored                # 그라데이션 미지원 (v2)

  # ── 두 이미지 side-by-side 비교 레이아웃 ──────────────────────────
  # "source → arrow → rendered" 학습 패턴 또는 "before / after" 비교 슬라이드.
  # `::: columns` 는 width 강제로 빈 공간 발생 가능 → flex container 권장.
  pair_comparison_layout:
    trigger: |
      한 슬라이드에 두 이미지 (source/before + rendered/after) + 동일 height 비교 필요.
      ppt2m2slide heuristics composite_shape_images 도 이 패턴을 emit.
    emit_pattern: |
      <div style="display:flex; align-items:center; justify-content:center; gap:30px; margin:30px 0;">
        <img src="./img/{left}.png" alt="..." style="height:520px;">
        <img src="./img/{right}.png" alt="..." style="height:520px;">
      </div>
    rationale: |
      `::: columns` width 60/40 등 비율 강제 시 우측 column 폭 > 이미지 폭으로
      빈 공간 발생. flex + 동일 height 통일 시 자연스러운 시각 균형 + 화살표 연결.
      학습 사례: BasicKnowledgeForAI_small 표 슬라이드 — columns 60/40 → 빈 공간
      → flex + height:520px 로 전환.
    height_recommendation:
      default: 520px                  # 1080p 슬라이드 viewport 의 약 48%
      compact: 380px                  # 캡션·추가 텍스트 많을 때
      max: 600px                      # cf) 캡션 + bullet 있는 경우 상한
    when_not_to_use:
      - text_heavy_pair: "양쪽 모두 텍스트 위주면 ::: columns + .column width 권장"
      - asymmetric_size: "두 요소 size 차이 4배 이상이면 columns 명시 width 권장"

# ============================================================================
# 10. htmlArt 구조 도해 카탈로그 (active — core parser 구현 완료, Issue188)
# ============================================================================
# 들여쓰기 아웃라인 → 구조 도해(process/cycle/hierarchy/pyramid). PowerPoint SmartArt 대응 개념.
# ⚠ 산출물에 "SmartArt" 표기 금지 — htmlArt 사용.
#
# core 구현 완료 (markdown.js preprocessPandocDiv + theme/default·default_lec slide.css).
# 구조 도해 신호는 htmlArt 가 mermaid_inline 보다 우선 — content_pattern_rules 의
# sequential_steps·hierarchy_tree 보다 먼저 평가할 것.
htmlart:
  status: active
  handler: inline_fenced_div                 # `::: htmlart <type>` — markdown.js 가 처리
  design_doc: _doc_arch/htmlArt.md
  types_ref: data/htmlart/types.yml          # 에이전트 fast-path — 타입 + 결정표
  smartart_ref: data/htmlart/smartart-catalog.yml  # SmartArt 전체 참조 카탈로그
  fenced_div: "::: htmlart <type>"
  v1_types: [process, cycle, hierarchy, pyramid]
  triggers:
    - "순차 단계"
    - "프로세스"
    - "순환"
    - "라이프사이클"
    - "계층"
    - "트리"
    - "조직도"
    - "피라미드"
    - "비례 층"
  selection_hint: |
    구조 도해 신호(단계/순환/계층/비례)는 htmlArt 1차 후보.
    types.yml decision_table 을 위→아래 first-match 로 평가하여 타입 결정.

    ── vs 인포그래픽(d3_inline) 경계 ──────────────────────────────────
    · 텍스트 아웃라인 → 19개 타입 중 하나로 표현 가능  →  htmlArt
    · 커스텀 SVG·자유 시각화·데이터 주도·타입 미매칭   →  d3_inline
    · 핵심 차이: htmlArt = m2slide가 SVG 생성, d3 = 작성자 코드가 SVG 생성
    ────────────────────────────────────────────────────────────────────

    어느 신호도 미매칭 시 mermaid_inline 등 기존 룰로 위임.
