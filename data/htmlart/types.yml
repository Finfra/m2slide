# data/htmlart/types.yml
# htmlArt 타입 정의 + 콘텐츠 신호 → 타입 결정표 (에이전트 fast-path SSOT).
#
# media-creater·md-builder 등 에이전트는 구조 도해 선택 시 본 파일을 1차 참조한다.
# 전체 SmartArt 참조 카탈로그는 data/htmlart/smartart-catalog.yml.
# 전체 layout 별 구현 현황은 _doc_arch/htmlArt_list.md.
# 설계 SSOT: _doc_arch/htmlArt.md
#
# ⚠ "SmartArt" 는 Microsoft 상표 — 산출물에는 htmlArt 사용.
---
meta:
  design_doc: _doc_arch/htmlArt.md
  catalog: data/htmlart/smartart-catalog.yml
  layout_status: _doc_arch/htmlArt_list.md
  status: active          # core 구현 완료 (v1 4종 + v2 10종 + v3 list 5종 + v4 비율·균형 2종 + v5 비교·풀이 2종 + v6 워크플로 1종 + ext annotate + v7 callout)
  syntax: "::: htmlart <type>"
  input_model: "들여쓰기 아웃라인 (2칸 = 1레벨, ::: cards 본문과 동일)"
  type_count: 27

# ── htmlArt 타입 (27종 = v1 4 + v2 확장 10 + v3 list 5 + v4 비율·균형 2 + v5 비교·풀이 2 + v6 워크플로·serpentine 2 + ext annotate 1 + v7 callout 1) ─────
# v1 (Issue188): process · cycle · hierarchy · pyramid
# v2 확장 (Issue202): timeline · venn · matrix · target · funnel · gear · radial · chevron · step · arrow
# v3 list (Issue204): numbered · hexagon · bracket · block · tab
# v4 비율·균형: pie · balance (Basic Pie · Pie Process · Balance 흡수)
# v5 비교 (Issue208): compare (Opposing Ideas · Counterbalance Arrows · Opposing Arrows 흡수)
# v5 풀이 (Issue211): explain (중앙 명제 + 사방 풀이 phrase, radial 변형)
# v6 워크플로 (Issue209): workflow (사람 endcap + 단계 박스 체인, process 변형)
# v6 serpentine (Issue218): bend_process (N단계 줄바꿈 흐름, Bending Process 흡수)
types:
  process:
    tier: v1
    intent: "순차 단계·진행·워크플로"
    smartart_category: process
    input: "평면 리스트 — 최상위 항목 = 단계, 작성 순서 = 진행 순서"
    sublevel: "하위 들여쓰기 = 단계 내부 보조 설명 (선택)"
    visual: "가로 박스 체인 + 진행 방향 삼각 화살표"
    recommend_count: "3-6 단계"

  cycle:
    tier: v1
    intent: "순환·반복·라이프사이클·중심 아이디어 순환"
    smartart_category: cycle
    input: "평면 리스트 — 최상위 항목 = 순환 노드"
    sublevel: "하위 들여쓰기 = 노드 보조 설명 (선택)"
    visual: "노드 원형 등간격 배치 + 순환 곡선 화살표"
    recommend_count: "3-6 노드"
    impl_note: "d3.pointRadial 원형 좌표 + d3.path().arc() 곡선 화살표. 노드 수 무제한"

  hierarchy:
    tier: v1
    intent: "계층·트리·조직도·상하 보고 관계"
    smartart_category: hierarchy
    input: "중첩 리스트 — 들여쓰기 깊이 = 트리 깊이, 최상위 1개 = 루트(권장)"
    sublevel: "중첩 = 자식 노드 (다단계)"
    visual: "세로 조직도 + 부모-자식 연결선"
    recommend_count: "깊이 3 이내·노드 12 이내"

  pyramid:
    tier: v1
    intent: "비례·적층·토대→정점·우선순위 층"
    smartart_category: pyramid
    input: "평면 리스트 — 최상위 항목 = 층, 1번째 = 꼭대기"
    sublevel: "하위 들여쓰기 = 층 보조 설명 (선택)"
    visual: "적층 사다리꼴 (위 좁고 아래 넓음) + 우측 상세 패널"
    recommend_count: "3-5 층"

  timeline:
    tier: v2
    intent: "시간순 이벤트·연표·일정·마일스톤"
    smartart_category: process
    input: "평면 리스트 — 최상위 항목 = 시점, 작성 순서 = 시간 순서"
    sublevel: "하위 들여쓰기 = 시점 보조 설명 (선택)"
    visual: "가로 축선 + 마일스톤 마커 + 상하 교대 라벨 박스"
    recommend_count: "3-7 시점"

  venn:
    tier: v2
    intent: "중첩·교집합·공통점과 차이점"
    smartart_category: relationship
    input: "평면 리스트 — 최상위 항목 = 집합(원)"
    sublevel: "하위 들여쓰기 = 집합 보조 설명 (선택)"
    visual: "겹친 원 — 2·3개는 정형 배치, 4개+ 는 선형 벤"
    recommend_count: "2-3 집합 (4+ 선형 벤)"

  matrix:
    tier: v2
    intent: "2차원 분류·사분면·부분과 전체 관계"
    smartart_category: matrix
    input: "평면 리스트 — 최상위 항목 = 사분면 (4개 권장)"
    sublevel: "하위 들여쓰기 = 사분면 보조 설명 (선택)"
    visual: "2×2 격자 + 중심 축선. 4개 미만은 빈칸, 초과는 절단"
    recommend_count: "정확히 4 항목"

  target:
    tier: v2
    intent: "포함·점층·동심·핵심 강조 관계"
    smartart_category: relationship
    input: "평면 리스트 — 최상위 항목 = 링 (작성 순서 = 바깥→안)"
    sublevel: "(미사용 — 링 라벨만 표시)"
    visual: "동심원 — 바깥 링이 1번째, 안쪽으로 점층"
    recommend_count: "3-5 링"

  funnel:
    tier: v2
    intent: "필터링·수렴·단계적 감소·세일즈 퍼널"
    smartart_category: process
    input: "평면 리스트 — 최상위 항목 = 단계 (작성 순서 = 위→아래)"
    sublevel: "하위 들여쓰기 = 단계 보조 설명 (선택)"
    visual: "깔때기 — 위 넓고 아래 좁아짐 + 우측 상세 패널"
    recommend_count: "3-5 단계"

  gear:
    tier: v2
    intent: "맞물림·상호의존·연동 시스템"
    smartart_category: process
    input: "평면 리스트 — 최상위 항목 = 톱니바퀴"
    sublevel: "하위 들여쓰기 = 톱니바퀴 보조 설명 (선택)"
    visual: "맞물린 톱니바퀴 체인 (상하 교대 배치)"
    recommend_count: "2-4 톱니바퀴"

  radial:
    tier: v2
    intent: "중심 개념 + 관련 요소 (방사 관계)"
    smartart_category: cycle
    input: "평면 리스트 — 최상위 1번째 항목 = 중심, 나머지 = 스포크"
    sublevel: "하위 들여쓰기 = 노드 보조 설명 (선택)"
    visual: "중심 허브 박스 + 방사형 스포크 노드 + 연결선"
    recommend_count: "중심 1 + 스포크 3-8"

  chevron:
    tier: v2
    intent: "순차 단계 (강한 진행감 강조)"
    smartart_category: process
    input: "평면 리스트 — 최상위 항목 = 단계, 작성 순서 = 진행 순서"
    sublevel: "하위 들여쓰기 = 단계 보조 설명 (선택)"
    visual: "맞물린 갈매기형(>) 화살표 체인"
    recommend_count: "3-6 단계"

  step:
    tier: v2
    intent: "점진적 상승·성장·레벨업·누적 단계"
    smartart_category: process
    input: "평면 리스트 — 최상위 항목 = 단계, 1번째가 맨 아래"
    sublevel: "하위 들여쓰기 = 단계 보조 설명 (선택)"
    visual: "계단형 박스 (좌하→우상 상승) + 라이저 연결선"
    recommend_count: "3-5 단계"

  arrow:
    tier: v2
    intent: "수렴·집약·여러 입력 → 하나의 결과"
    smartart_category: relationship
    input: "평면 리스트 — 최상위 1번째 항목 = 중심(결과), 나머지 = 수렴 입력"
    sublevel: "하위 들여쓰기 = 노드 보조 설명 (선택)"
    visual: "방사형 소스 노드 → 중심 허브로 굵은 화살표 수렴"
    recommend_count: "중심 1 + 입력 2-6"

  numbered:
    tier: v3
    intent: "번호 있는 목록·순서 목록·체크리스트·랭킹"
    smartart_category: list
    input: "평면 리스트 — 최상위 항목 = 카드, 작성 순서 = 번호"
    sublevel: "하위 들여쓰기 = 카드 보조 설명 (선택)"
    visual: "카드 세로 적층 + 좌측 원형 번호 배지"
    recommend_count: "3-7 항목"

  hexagon:
    tier: v3
    intent: "상호 연결된 아이디어 시리즈 (비순차 장식)"
    smartart_category: list
    input: "평면 리스트 — 최상위 항목 = 육각 노드"
    sublevel: "하위 들여쓰기 = 노드 보조 설명 (선택)"
    visual: "육각형 노드 상하 교대(zigzag) 가로 배치 + 커넥터"
    recommend_count: "3-6 노드"

  bracket:
    tier: v3
    intent: "그룹·하위 그룹 묶음 (괄호로 그룹 경계 강조)"
    smartart_category: list
    input: "2단 리스트 — 최상위 항목 = 그룹, 하위 들여쓰기 = 그룹 멤버"
    sublevel: "하위 들여쓰기 = 그룹 멤버 (필수 — 없으면 라벨만 렌더)"
    visual: "좌측 그룹 라벨 + 큰 중괄호 + 우측 멤버 박스 세로열"
    recommend_count: "2-5 그룹, 그룹당 2-6 멤버"

  block:
    tier: v3
    intent: "정보 그룹·항목 나열 (단일 컬럼 세로 목록)"
    smartart_category: list
    input: "평면 리스트 — 최상위 항목 = 블록"
    sublevel: "하위 들여쓰기 = 블록 보조 설명 (선택)"
    visual: "좌측 색 악센트 바 + 제목/설명, 단일 컬럼 세로 적층"
    recommend_count: "3-7 블록"

  tab:
    tier: v3
    intent: "탭으로 분류된 그룹 목록 (2단 카테고리별)"
    smartart_category: list
    input: "2단 리스트 — 최상위 항목 = 탭 그룹, 하위 들여쓰기 = 탭 내 항목"
    sublevel: "하위 들여쓰기 = 탭 내 항목"
    visual: "폴더 탭 헤더 + 탭별 항목 패널 (정적 — 전 탭 펼침 세로 나열)"
    recommend_count: "2-5 탭, 탭당 2-6 항목"

  pie:
    tier: v4
    intent: "부분-전체 비율·구성비 (부채꼴 분할)"
    smartart_category: cycle    # SmartArt 분류상 Cycle/Relationship 의 Basic Pie + List 의 Pie Process
    input: "평면 리스트 — 최상위 항목 = 조각. 라벨 끝 `N%` 또는 ` N` 토큰을 비율로 파싱"
    sublevel: "하위 들여쓰기 = 조각 보조 설명 (선택, 범례에 표시)"
    visual: "원형 부채꼴 분할 + 조각 내부 N% 라벨 + 우측 색 범례"
    recommend_count: "2-7 조각 (합 100% 권장, 미지정 시 균등 분할)"

  balance:
    tier: v4
    intent: "장단점·찬반·양팔 비교 (시소형 균형)"
    smartart_category: relationship
    input: "정확히 2개 그룹 — 최상위 1번째 = 좌, 2번째 = 우"
    sublevel: "하위 들여쓰기 = 그룹 항목 (수가 가중치). 라벨 끝 ` N` 명시 시 그 값 우선"
    visual: "삼각 받침대 + 가로 팔 + 좌·우 접시. 무거운 쪽이 아래로 기울어짐"
    recommend_count: "2 그룹 고정. 그룹당 1-6 항목"

  compare:
    tier: v5
    intent: "양쪽 대비·좌우 비교·대립하는 두 영역 (동등 병렬 — balance와 달리 무게 무관)"
    smartart_category: relationship    # SmartArt Opposing Ideas / Counterbalance Arrows / Opposing Arrows 흡수
    input: "정확히 2개 그룹 — 최상위 1번째 = 좌, 2번째 = 우. 라벨 형식 `**헤드라인** / 부제` (`/`로 헤드라인·부제 분리, 부제 생략 가능)"
    sublevel: "하위 들여쓰기 = 그룹 bullet 본문 (필수, 2-7 항목 권장)"
    visual: "중앙 세로 구분선 + 좌·우 동등 컬럼 + 상단 작은 부제(악센트) + 큰 컬러 헤드라인 + bullet 리스트"
    recommend_count: "2 그룹 고정. 그룹당 2-7 항목"

  workflow:
    tier: v6
    intent: "사람 endcap + 단계 박스 체인 (역할 강조 워크플로 — process 변형)"
    smartart_category: process
    input: "평면 리스트 — 최상위 항목 = 단계. 첫·마지막 항목 라벨에 사람 endcap 자동 부여 (시작 인물 → 단계들 → 결과 인물)"
    sublevel: "하위 들여쓰기 = 단계 보조 설명 (도구·역할 라벨)"
    visual: "사람 실루엣 endcap(좌·우) + 라운드 박스 체인(중앙) + 진행 화살표"
    recommend_count: "3-10 단계 (endcap 2 + 중간 1-8)"
    impl_note: "process 박스 체인 + 첫·마지막 박스를 사람 SVG(머리 원 + 몸 라운드 사각)로 치환. 사람 색은 --htmlart-accent 상속"

  bend_process:
    tier: v6
    intent: "N단계 줄바꿈 serpentine 흐름 (단계 수가 많아 한 줄에 다 못 담길 때 휘어지는 프로세스)"
    smartart_category: process
    input: "평면 리스트 — 최상위 항목 = 단계, 작성 순서 = 진행 순서. 단계 라벨 끝 `~~` 또는 `[off]` prefix 시 비활성(회색) 처리"
    sublevel: "하위 들여쓰기 = 단계 간 transition 라벨 (선택 — 다음 화살표 위에 표시)"
    visual: "번호 원형 노드 + 라벨, 행 끝에서 곡선으로 다음 행 꺾임 후 역방향 진행 (serpentine). 노드 사이 직선 연결, 행 끝 ¼원 곡선"
    recommend_count: "4-12 단계 (3 이하 → process, 13+ → timeline 권장)"
    impl_note: "행당 노드 수(per_row)는 컨테이너 폭 ÷ 단일 노드폭으로 자동 산출. 행별 좌→우, 우→좌 교대. 행 전환 곡선 = d3.path().arcTo() 또는 cubic bezier. 비활성 노드는 fill=gray + opacity=0.55. 사이 라벨은 노드 중간 위쪽 또는 아래쪽 텍스트."

  explain:
    tier: v5
    intent: "중앙 명제를 여러 짧은 풀이 phrase로 풀어 설명 (정의 확장·다관점 해석)"
    smartart_category: relationship
    input: "평면 리스트 — 최상위 1번째 항목 = 중앙 명제, 나머지 = 풀이 phrase"
    sublevel: "(미사용 — 풀이는 짧은 phrase로 한정. 긴 설명은 radial 권장)"
    visual: "중앙 큰 강조 텍스트 (박스 X, accent 색) + 사방 풀이 phrase (박스 X, 본문 색) + 중앙 ↔ phrase elbow line (accent 색)"
    recommend_count: "중앙 1 + 풀이 4-8"
    impl_note: "d3.pointRadial 원형 좌표 + elbow line (짧은 horizontal stub + 대각 line). 박스 없이 텍스트만 — radial 변형"

  annotate:
    tier: v6
    intent: "원문 안의 단어/문구를 색 윗줄·밑줄로 강조 + 좌·우 라벨로 설명 (주해·용어 풀이)"
    smartart_category: relationship
    input: |
      평면 리스트 — syntax B (over/under + 색 + span + label):
        * target: <원문 전체>
        * over <color>: <span> → <label>
        * under <color>: <span> → <label>
      color = red|blue|green|yellow|orange|purple|pink|cyan|#hex
      span = target 안의 substring (첫 매칭)
    sublevel: "(미사용)"
    visual: "중앙 큰 원문 + 각 span 위/아래 색 줄 + 좌·우 라벨 박스 (색 border, dashed elbow)"
    recommend_count: "원문 1 + 주석 2-6"
    impl_note: "foreignObject 안에 span 마커 → getBoundingClientRect 측정 → SVG viewBox 좌표 변환 → 색 줄 + elbow line + 좌·우 라벨 배치 (span x-위치로 좌/우 분기)"

  callout:
    tier: v7
    intent: "중앙 hub(아이콘 + 큰 타이틀) + 다방향 callout arrow + 박스 없는 라벨 (강조 카피 / 태그 그룹)"
    smartart_category: relationship
    input: |
      평면 리스트:
        * [:fa-name: 또는 이모지] <중앙 hub 타이틀>
        * **<강조 카피>**            ← bold → accent-1 (primary)
        * <라벨 또는 태그|태그|태그>  ← 일반 → accent-2 (secondary)
        * ...
      옵션 (Pandoc attribute): {.h}/{.horizontal}(기본) · {.v}/{.vertical} · {.fan}
    sublevel: "(미사용 — 평면 리스트만)"
    visual: "중앙 hub(아이콘 슬롯 + 큰 타이틀) + branch arrow N개 + 끝 라벨. 태그 sep `|` 또는 ` / ` → 토큰 사이 옅은 vertical bar"
    recommend_count: "중앙 1 + branch 2-6"
    impl_note: "첫 항목 머리에서 :fa-([\\w-]+): 또는 emoji 1자 분리 → 아이콘 슬롯. **bold** 감지 → accent-1, 아니면 accent-2. orientation 클래스(horizontal/vertical/fan)에 따라 branch 좌표 분산. branch path: hub edge → 짧은 stub → arrow head + 끝에 박스 없는 텍스트."

# ── 콘텐츠 신호 → htmlArt 타입 결정표 (fast-path, 위→아래 first-match) ──────
# 에이전트는 슬라이드 본문 키워드를 위에서부터 대조하여 첫 매칭 타입을 채택한다.
# 구체적(specific) 타입을 위에, 일반(generic) 4종을 아래에 배치 — first-match 가
# 구체 타입을 우선 채택하도록.
decision_table:
  - htmlart: venn
    signal_ko: ["벤다이어그램", "교집합", "중첩", "공통점", "공통 영역", "겹치는"]
    signal_en: ["venn", "overlap", "intersection", "common"]

  - htmlart: matrix
    signal_ko: ["사분면", "행렬", "매트릭스", "2x2", "2×2", "4분면"]
    signal_en: ["matrix", "quadrant", "2x2", "grid"]

  - htmlart: target
    signal_ko: ["동심원", "표적", "과녁", "핵심으로", "점층", "포함 관계"]
    signal_en: ["target", "concentric", "nested", "bullseye"]

  - htmlart: funnel
    signal_ko: ["퍼널", "깔때기", "필터링", "전환율", "세일즈 퍼널", "좁혀지는"]
    signal_en: ["funnel", "filter", "conversion", "narrowing"]

  - htmlart: gear
    signal_ko: ["톱니바퀴", "기어", "맞물", "연동", "상호의존", "맞물린"]
    signal_en: ["gear", "interlocking", "mesh", "cog"]

  - htmlart: callout
    signal_ko: ["콜아웃", "중앙 주제", "방사 라벨", "주제 + 태그", "주제+태그", "주제와 부연", "주제와 태그", "포스터형 주제"]
    signal_en: ["callout", "annotation hub", "topic with tags", "fan out tags"]

  - htmlart: explain
    signal_ko: ["풀어 설명", "정의 확장", "여러 관점", "다관점", "여러 의미", "풀이", "이해하기"]
    signal_en: ["explain", "elaborate", "expand definition", "interpret", "define"]

  - htmlart: radial
    signal_ko: ["방사형", "중심 개념", "허브", "중심과 주변", "중심 아이디어"]
    signal_en: ["radial", "hub", "central concept", "spoke"]

  - htmlart: timeline
    signal_ko: ["타임라인", "연표", "일정", "시간순", "마일스톤", "날짜별", "연혁"]
    signal_en: ["timeline", "milestone", "chronological", "schedule"]

  - htmlart: step
    signal_ko: ["계단", "단계적 상승", "성장 단계", "레벨업", "누적", "점진적"]
    signal_en: ["staircase", "step up", "ascending", "level"]

  - htmlart: chevron
    signal_ko: ["갈매기", "체브론", "강한 진행"]
    signal_en: ["chevron"]

  - htmlart: arrow
    signal_ko: ["수렴", "집약", "통합", "여러 입력", "하나로 모", "결집"]
    signal_en: ["converging", "convergence", "consolidate"]

  - htmlart: numbered
    signal_ko: ["번호 목록", "순서 목록", "번호 매기기", "체크리스트", "랭킹", "순위 목록"]
    signal_en: ["numbered", "ranking", "checklist", "ordered list"]

  - htmlart: hexagon
    signal_ko: ["육각형", "헥사곤", "벌집", "육각 노드"]
    signal_en: ["hexagon", "honeycomb"]

  - htmlart: bracket
    signal_ko: ["괄호 묶음", "그룹 묶음", "분류 묶음", "괄호로 묶"]
    signal_en: ["bracket", "grouping", "grouped list"]

  - htmlart: tab
    signal_ko: ["탭", "탭 그룹", "분류 탭", "카테고리별", "탭으로 구분"]
    signal_en: ["tab", "tabbed", "tab list"]

  - htmlart: block
    signal_ko: ["블록 목록", "항목 나열", "세로 목록", "정보 블록"]
    signal_en: ["block list", "vertical list"]

  - htmlart: pie
    signal_ko: ["비율", "구성비", "퍼센트", "%", "부분-전체", "점유율", "파이", "원형 차트", "조각"]
    signal_en: ["pie", "percent", "share", "proportion", "composition"]

  - htmlart: compare
    # compare 는 balance 보다 위에 배치 — "동등 병렬 좌우 비교" 가 "무게·시소" 보다
    # 일반적이라 signal 충돌 시 compare 우선. balance 는 "시소·기울기" 명시어가 있을 때만.
    signal_ko: ["좌우 비교", "두 영역 비교", "대립", "대비", "vs", "반대 개념", "양분", "이분법", "두 영역"]
    signal_en: ["compare", "versus", "vs", "opposing", "contrast", "dichotomy", "two sides"]

  - htmlart: balance
    signal_ko: ["균형", "시소", "장단점", "찬반", "양팔", "트레이드오프", "비교 무게"]
    signal_en: ["balance", "seesaw", "tradeoff", "pros and cons", "weigh"]

  - htmlart: workflow
    # workflow 는 process 보다 위 — "사람·역할·페르소나 흐름" 명시 시 우선.
    # 일반 "프로세스·단계" 만 있으면 process 로 fall-through.
    signal_ko: ["워크플로우", "워크 플로우", "업무 흐름", "역할별 흐름", "사람 흐름", "여정맵", "여정 맵", "페르소나 프로세스", "유저 저니"]
    signal_en: ["user journey", "persona process", "journey map", "role flow"]

  - htmlart: bend_process
    # bend_process 는 process 보다 위 — "휘어지는·serpentine·줄바꿈 흐름" 명시 시 우선.
    # 일반 "프로세스·단계" 만 있으면 process 로 fall-through.
    signal_ko: ["휘어지는 프로세스", "휘어지는 단계", "꺾이는 흐름", "여러 줄 단계", "줄바꿈 흐름", "serpentine", "구불구불"]
    signal_en: ["bending process", "serpentine", "wrap process", "multi-row steps", "snaking"]

  - htmlart: process
    signal_ko: ["순차", "단계", "절차", "프로세스", "워크플로", "진행", "흐름"]
    signal_en: ["step", "process", "flow", "sequential", "workflow"]

  - htmlart: cycle
    signal_ko: ["순환", "반복", "주기", "라이프사이클", "되풀이", "다시 처음"]
    signal_en: ["cycle", "loop", "recurring", "lifecycle", "iterative"]

  - htmlart: hierarchy
    signal_ko: ["계층", "트리", "조직도", "상하 관계", "부모-자식", "분류 구조"]
    signal_en: ["hierarchy", "tree", "org chart", "parent-child"]

  - htmlart: pyramid
    signal_ko: ["비례", "적층", "토대", "정점", "우선순위 층", "피라미드", "단계별 비중"]
    signal_en: ["pyramid", "proportional", "layered", "foundation"]

# ── 경계 — htmlArt 아님 (다른 구성요소로 처리) ─────────────────────────────
not_htmlart:
  - signal: "비순차 박스 묶음·균질 항목 그리드"
    use: "::: cards"
  - signal: "임의 노드 네트워크·자유 연결 그래프"
    use: "d3_inline 또는 mermaid"
  - signal: "커스텀 SVG·자유 시각화·19개 타입 미매칭·데이터 주도 도해"
    use: "d3_inline (인포그래픽) — 작성자가 d3 코드로 직접 SVG 제어"
  - signal: "사진·이미지 강조"
    use: "image_placeholder (Media 계열)"

# ── 검증 ──────────────────────────────────────────────────────────────────
validation:
  type_whitelist:
    [process, cycle, hierarchy, pyramid,
     timeline, venn, matrix, target, funnel,
     gear, radial, chevron, step, arrow,
     numbered, hexagon, bracket, block, tab,
     pie, balance, compare, explain, workflow, annotate, callout]
  on_unsupported_type: "슬라이드에 .component-error 표시, 빌드 중단 안 함"
  on_empty_body: "에러 메시지 표시"
  min_nodes:
    process: 1
    cycle: 2
    hierarchy: 1
    pyramid: 2
    timeline: 2
    venn: 2
    matrix: 1
    target: 1
    funnel: 2
    gear: 1
    radial: 2
    chevron: 1
    step: 1
    arrow: 2
    numbered: 1
    hexagon: 1
    bracket: 1
    block: 1
    tab: 1
    pie: 2
    balance: 2
    compare: 2
    explain: 2
    workflow: 1
    annotate: 2
    callout: 2

# ── 에이전트 사용 안내 ─────────────────────────────────────────────────────
agent_usage:
  fast_path: "decision_table 위→아래 first-match → htmlart 타입 결정"
  fallback: "어느 신호도 미매칭 시 htmlArt 미적용 — 기존 도구(mermaid 등) 룰로 위임"
  status_gate: "meta.status == active — core parser 구현 완료, htmlArt 출력 가능"
