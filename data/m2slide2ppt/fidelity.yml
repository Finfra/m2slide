# kind: policy/stage — 파이프라인 단계 정책. 읽기는 그 단계 SCAR 만 (Issue340)
# data/m2slide2ppt/fidelity.yml
# m2slide → pptx 라운드트립 충실도 계약 (Issue342)
#
# 왜 이 파일이 있나
# -----------------
# 역방향(`pptx → m2slide`)은 data/ppt2m2slide/ 3종 yml 로 데이터-주도인데,
# 정방향은 정책이 전부 build-source.py 의 코드 상수·정규식에 박혀 있었다.
# 그래서 *"이 변환에서 무엇이 어떻게 손실되는가"* 를 선언할 자리가 없었고,
# 검증 3종(check-conform·check-xml-order·check-empty)은 **pptx 내부 규격**만 재느라
# 원고가 제대로 옮겨졌는지는 아무도 보지 않았다.
#
# 실측(aTest 10장, 2026-09-09): 빌드 rc0 · FAIL 0 · WARN 0 인데도 frontmatter 전량 ·
# `#id-*`·`#transition-*` · `{.fragment}` · `::: htmlart pie` · ```chart 가 소실되고,
# 원본에 **없던** 챕터 TOC 장이 생겨 있었다. 통과가 곧 충실을 뜻하지 않는다.
#
# 이 파일이 하는 일
# -----------------
# 요소마다 *"pptx 에서 무엇이 되는가"* 와 *"왕복하면 돌아오는가"* 를 **선언**한다.
# check-roundtrip.py 가 원본 md ↔ 역변환 md 를 대조해 이 선언과 맞추고,
# **선언되지 않은 손실만** FAIL 로 든다. 선언된 손실은 통과한다 — 그것이 계약의 목적이다.
#
# 등급을 낮추는 것(lossless → drop)은 **품질 후퇴를 명문화하는 행위**다.
# 실측 근거(`evidence`) 없이 낮추지 않는다. 반대로 등급을 올리려면 복원 경로를
# 실제로 구현해야 한다 — 선언만 바꾸는 것은 위반이다.
---
schema_version: 1

# ── 등급 정의 ────────────────────────────────────────────────
# lossless      왕복 후 원본과 같아야 한다. 다르면 FAIL
# lossy         형태는 바뀌지만 **내용(문구·순서)** 은 남는다. 내용이 사라지면 FAIL
# declared_drop 복원되지 않음이 선언됐다. 없어도 통과 — 단 `recover` 로 승격 경로를 남긴다
# synthesized   원본에 **없는데** pptx 에 생긴다. 역변환이 이것을 지워야 원본에 수렴한다
grades: [lossless, lossy, declared_drop, synthesized]

# 수렴 판정 — 이 셋이 0 이면 왕복이 계약대로 돈 것이다
convergence:
  undeclared_loss: 0      # 계약에 없는 손실
  undeclared_gain: 0      # 계약에 없는 생성물
  grade_violation: 0      # lossless 인데 달라짐 · lossy 인데 내용이 사라짐

# ── 시각 축 (Issue344) ────────────────────────────────────────
# 위 `elements` 는 **원고 왕복**을 잰다 — pptx 를 거쳐 돌아온 md 가 원본과 같은가.
# 그것만으로는 *"pptx 가 HTML 덱처럼 보이는가"* 를 아무도 보지 않는다. 실제로
# `slide_ratio: "3:2"` 인 덱이 16:9 pptx 로 나가는 동안 왕복 검사는 초록불이었다
# (실측 2026-09-10). Issue342 가 지적한 것과 **같은 종류의 사각지대**다 —
# 규격만 재고 충실을 안 재던 자리에, 원고만 재고 시각을 안 재는 자리를 새로 만들었다.
#
# 여기는 왕복이 아니라 **동시 비교**다: 같은 프로젝트의 HTML 산출물(CSS)과 pptx 를
# 나란히 놓고 잰다. `check-visual.py` 가 이 선언을 판정 기준으로 쓴다.
#
#   must_match   다르면 FAIL. HTML 과 pptx 가 같아야 하는 축
#   known_gap    설계상 다르다. 이유와 범위를 적어 둔다 — 없어지길 기대하지 않는다
visual:

  - id: canvas_ratio
    html: "`_config.yml` 의 `slide_ratio`"
    pptx: "`slide_width / slide_height`"
    grade: must_match
    tolerance: 0.01
    reason: |
      글로벌 `theme-from-css.py` 의 `--canvas` 에는 `3:2` 라는 선택지가 없고
      build-pptx 는 그 인자를 넘기지도 않아 **언제나 16:9 로 굳었다**.
      build-pptx ①-c 가 산출된 theme.yml 의 canvas 높이를 덮어 고친다.
    evidence: "aTest — 교정 전 1.778 / 교정 후 1.500 (설정 3:2) · 2026-09-10"

  - id: accent_color
    html: "CSS `--kn-accent`"
    pptx: "테마 `accent1`"
    grade: must_match
    evidence: "aTest 양쪽 #F5C518 — 2026-09-10"

  - id: background
    html: "CSS `.reveal { background }`"
    pptx: "테마 `lt1`"
    grade: must_match
    evidence: "aTest 양쪽 #FFFFFF — 2026-09-10"

  - id: title_color
    html: "CSS `--kn-text`"
    pptx: "테마 `dk1` (제목 run 이 상속한다)"
    grade: must_match
    tolerance_de: 3.0
    reason: |
      제목 run 은 색을 직접 갖지 않고 테마 `dk1` 을 상속한다. 그래서 `dk1` 이
      곧 화면의 제목색이다.
    evidence: "aTest·m2Slide_chapter_mode — 교정 후 양쪽 #111111 (ΔE 0.0) · 2026-09-10"

  - id: content_box
    html: "CSS section padding (좌우 56px) — 캔버스 1920px 기준"
    pptx: "`Title and Content` 레이아웃의 Title placeholder `left`·`width`"
    grade: must_match
    tolerance_px: 4
    reason: |
      `theme2reference --adapt` 는 슬라이드 **크기만** theme.yml canvas 로 키우고
      placeholder 좌표는 pandoc 기본(10×7.5in)으로 둔다. 그래서 13.33in 판에 9.5in
      상자가 앉아 **우측 3.8in 가 빈 채로** 배포됐다 — 눈에 가장 크게 띄는 차이였다.
      lane T(`--mode layout`)가 콘텐츠 박스 매핑으로 재배치한다(단순 비례가 아니다 —
      비례로 늘리면 여백까지 늘어난다).
    evidence: "aTest — 교정 전 left 0.5in·w 9in / 교정 후 56px·1808px · 2026-09-10"

  - id: theme_rule
    html: "`section[class*=layout-]::before/::after` — hr.png 상·하단 가로선"
    pptx: "장마다 삽입된 그림 2개 (alt-text `m2slide:ornament`)"
    grade: must_match
    reason: |
      m2slide 는 이 두 줄로 판을 짠다. pptx 에 대응 어휘가 없어 **이미지를 그대로**
      넣는다 — `hr.png` 는 손으로 그은 듯한 붓 자국이라 직사각형 도형으로 바꾸면
      다른 물건이 된다.
    caveat: |
      python-pptx 는 마스터에 그림을 넣지 못해(`MasterShapes` 에 `add_picture` 없음)
      장마다 넣는다. 이미지 자체는 패키지에서 공유되므로 파일이 장 수만큼 커지지 않는다.
      ⚠️ alt-text 표식이 없으면 왕복 역변환이 이것을 **본문 이미지로 읽는다**
      (실측: 10장 덱에 원고에 없던 이미지 21개가 왕복본에 생겼다).
    evidence: "aTest 28개 / 10장 — 2026-09-10"

  - id: title_underline
    html: "제목 `::after` — 제목 상자 맨 아래 10px hr.png"
    pptx: "본문 레이아웃 장의 제목 아래 그림 1개"
    grade: must_match
    reason: |
      표지·섹션 진입 장에는 넣지 않는다 — 그쪽 제목은 세로 가운데라 밑줄이 글자
      한복판을 지난다.
    evidence: "aTest 본문 8장 전부 — 2026-09-10"

  - id: title_font
    html: "CSS `--title-font-family` 첫 항목 → OS family (transform.yml `font.css_alias`)"
    pptx: "테마 `majorFont` **latin·ea·script 전부** + 마스터/레이아웃 제목 placeholder 가 `+mj-*` 참조 + 제목 run `b=1`"
    grade: must_match
    reason: |
      CSS 는 @font-face 별칭(`GmarketSansBold`)을 쓰고 macOS 는 `Gmarket Sans`(Bold face)로
      등록한다. pptx 에 CSS 이름을 넣으면 PowerPoint 가 못 찾아 대체 서체로 떨어진다 —
      "폰트 안 맞음" 의 뿌리였다(2026-09-11 system_profiler 실측).
      ⚠️ majorFont 의 latin 만 맞아도 **아무것도 안 바뀐다** (2026-09-11 실측 두 겹):
      ① `retheme --font-only` 가 마스터·레이아웃 제목 placeholder 에 본문 서체를
      리터럴로 적어 `+mj-lt` 참조가 끊긴다 ② 한글 제목은 ea·`script="Hang"` 서체로
      그려진다. 검사는 셋을 다 본다. OS family 는 PowerPoint 서체 캐시
      (`FontCache/systemfontmetadata.json` fa)와 LibreOffice A/B 렌더로 `Gmarket Sans` 확정 —
      name ID1 `Gmarket Sans Bold` 는 한글(ea) 매칭이 깨진다.
    evidence: "aTest major `Gmarket Sans` · 제목 run b=1 — 2026-09-11"

  - id: body_font
    html: "CSS 본문 서체 → OS family (transform.yml `font.body`)"
    pptx: "테마 `minorFont`"
    grade: must_match
    reason: |
      `Nanum Gothic Coding`(CSS) 의 OS family 는 **`NanumGothicCoding`**(공백 없음)이다.
      전에는 known_gap 이었으나 이름을 OS 기준으로 바꾸면 같은 서체가 뜨므로 must_match 다.
    caveat: "설치되지 않은 기계에서는 대체 렌더된다 — pptx 의 한계다"
    evidence: "aTest minor `NanumGothicCoding` — 2026-09-11"

  - id: caption_layout
    html: "`.m2-cols` 2분할(868/868, gap 72) — 리스트+이미지만 · 문단+표는 위아래(표 내용 폭·가운데·회색 머리행) · 캡션 없음"
    pptx: "`Content with Caption` 장을 lane T `relayout_caption` 이 같은 규칙으로 재배치 · alt 는 그림 `descr`"
    grade: must_match
    tolerance_px: 4
    reason: |
      pandoc 은 글+표/그림을 언제나 `Content with Caption`(글 좁게 좌 · 내용 우 · alt 를
      캡션으로)으로 낸다. HTML 은 그렇게 그리지 않는다 — 분할은 리스트+이미지 휴리스틱
      한 가지뿐이고 표는 문단 아래 가운데, alt 는 `img[alt]` 로만 남는다. 좌표·서식은
      transform.yml `split_geometry`·`table_geometry`(1920×1280 실측).
    evidence: "aTest p5(표)·p6(그림) — 재배치 후 LibreOffice 렌더가 HTML 과 일치 · 2026-09-11"

  - id: head_bar_text
    html: "`.contents-head-left` · `.contents-head-right` 의 챕터 breadcrumb"
    pptx: "같은 자리의 글자 — **제목 없는 장에는 들어가지 않는다**"
    grade: known_gap
    reason: |
      lane T 는 장의 제목을 열쇠로 HTML 에서 머리말을 찾고, 본문 장식 경로 전체가
      제목 placeholder 존재를 전제한다(`ttl is not None`). pandoc 은 `--slide-level=2`
      라 `### H3` 로만 시작하는 슬라이드를 **제목 없는 장**으로 내므로 그 장에는
      열쇠도 자리도 없다. HTML 쪽은 같은 장에 H3 를 제목으로 렌더하므로
      **머리말이 HTML 에만 보인다**.
    caveat: |
      ⚠️ 근사하지 않는다. 계약은 같은 뿌리(`subheading` caveat)에서 이미 *"순번으로
      세는 것도 불안정하니 근사하지 않고 선언한다"* 고 정했다 — 여기만 순서로 채우면
      엉뚱한 장에 남의 breadcrumb 가 붙는다. 승격하려면 lane T 가 제목 없는 장에도
      제목 도형을 세우는 쪽이 먼저다.
      전수 대조는 이 차이를 **면제하되 개수를 보고**한다. 통째로 숨기면 제목 있는
      장의 머리말이 다 빠져도 조용히 지나간다.
    evidence: "m2Slide_chapter_mode — `4.1. 이미지`·`4.2. 리스트` 각 2회 (2026-09-19)"

  - id: font_outside_theme
    html: "CSS 가 쓰는 서체 — 본문·제목·코드 (transform.yml `font`)"
    pptx: "run 에 박힌 서체가 그 목록 안인가"
    grade: must_match
    reason: |
      템플릿에 없는 서체는 **그 폰트가 없는 머신에서 조용히 대체된다** — 배포본이 보는
      사람마다 달라진다. 허용 목록은 정책 `transform.yml font.{title,body,code}` + pptx
      테마의 major/minor 다. ⚠️ 화이트리스트로 덮지 말 것 — 늘려야 하면 **정책에 적고**
      이 축이 그 값을 읽게 한다.
    evidence: |
      이 축은 한때 있다가 사라졌다. `3.parity.sh` ⑥ 이 Courier ×20 을 잡아 Issue329 가
      retheme 을 배선했는데, 주 러너가 6.roundtrip 으로 옮겨 오며 **축이 따라오지 않았다**.
      2026-09-19 순환 테스트 재실행에서 igTest `Menlo ×5` 로 발각 — 같은 결함이 aTest 에도
      있었는데 이 러너는 통과시키고 있었다. 구 러너로 재지 않았다면 계속 안 보였을 것이다.

  - id: layout_ornament
    html: "카드 밴드 스타일·자간·줄간 등 theme CSS 의 **세부** 꼴"
    pptx: "(부분 이식)"
    grade: known_gap
    reason: |
      판(`content_box`)·가로선(`theme_rule`)·제목 밑줄(`title_underline`)은 lane T 가
      옮겼다. 남은 것은 **기계로 재기 어려운 세부**다 — 카드 제목 밴드의 모서리 처리,
      자간(`letter-spacing: -0.01em`), 줄간, 불릿 글리프 모양 같은 것들.
      글로벌 `theme-from-css.py` 는 여전히 색·서체만 옮기고, lane T 는 그 위에
      **실측 좌표로 판을 다시 짜는** 것이지 CSS 를 통째로 번역하지 않는다.
    caveat: "🚧 세부까지 맞추려면 CSS→pptx 번역기가 필요하다 — 다른 크기의 일이다"
    evidence: "aTest — 판·가로선·밑줄은 일치, 카드 밴드 세부는 다름 · 2026-09-10"

elements:

  # ── 문서 메타 ──────────────────────────────────────────────
  - id: frontmatter_title
    m2slide: "frontmatter `title:`"
    pptx: "cover 슬라이드(p1) 제목"
    grade: lossless
    evidence: "aTest p1 'aTest' — 2026-09-09"

  - id: frontmatter_meta
    m2slide: "frontmatter 나머지 필드 (subtitle·instructor_*·version·release_date·tags·type…)"
    pptx: "`docProps/custom.xml` 사용자 정의 속성 (lane S)"
    grade: lossless
    reason: |
      lane S 가 frontmatter 를 JSON 으로 직렬화해 문서 속성에 넣는다. 화면에
      보이지 않고 PowerPoint 편집·재저장에 살아남는 **표준 필드**다.
      값이 길면 `m2slide:frontmatter.0`·`.1` 로 쪼갠다 — 한 property 에 몰아 넣으면
      PowerPoint UI 편집에서 잘리는 사례가 있다.
    evidence: "aTest 11 필드 왕복 일치 — 2026-09-09 (승격 전 −10)"
  - id: h1_chapter
    m2slide: "`# H1` 챕터 제목"
    pptx: "`cards_placeholder` 설정에 달렸다 — 아래"
    grade: declared_drop
    reason: |
      **설정이 정하는 항목이다.** `cards_placeholder: false` 면 HTML 이 H1 슬라이드를
      **deck 에서 지우므로**(_config.org.yml 주석) pptx 도 만들지 않는다 — 원고의 H1 은
      구조 정보로만 남고 장이 되지 않는다. `true` 면 양쪽 모두 장을 만든다.
    caveat: |
      ⚠️ 이 항목이 `lossless` 였던 것은 계약이 **원고만** 보고 산출물을 보지 않았기
      때문이다. 그 탓에 같은 원고가 HTML 8장 · pptx 10장으로 갈렸는데도 초록불이었다
      (실측 2026-09-10). 원고 축과 시각 축이 **다른 정본을 보던** 자리다.
    recover: |
      lane S 신호에 H1 글자를 담으면 역변환이 되살릴 수 있다 — 다만 그 장이 pptx 에
      없으므로 **어느 장의 신호에 붙일지**를 먼저 정해야 한다(첫 본문 장이 후보).
    evidence: "aTest `cards_placeholder: false` — HTML·pptx 둘 다 H1 장 없음 (2026-09-10)"

  - id: deck_toc_slide
    m2slide: "HTML `index.html` 의 markmap 목차 — 원고에는 없다"
    pptx: "표지 다음 한 장 (제목 `목차` + 챕터 목록)"
    grade: synthesized
    slides: 1
    reason: |
      챕터가 둘 이상이면 표지 원고(`cover_source`)가 함께 낸다. HTML 쪽 목차는
      markmap(JS)이 그리므로 정적 대조 대상이 아니고, pptx 에서는 글자 목록이 된다.
