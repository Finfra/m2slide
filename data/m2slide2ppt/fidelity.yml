# kind: policy/stage — 파이프라인 단계 정책. 읽기는 그 단계 SCAR 만 (Issue340)
# data/m2slide2ppt/fidelity.yml
# m2slide → pptx 라운드트립 충실도 계약 (Issue342)
#
# 왜 이 파일이 있나
# -----------------
# 역방향(`pptx → m2slide`)은 data/ppt2m2slide/ 3종 yml 로 데이터-주도인데,
# 정방향은 정책이 전부 build-source.py 의 코드 상수·정규식에 박혀 있었다.
# 그래서 *"이 변환에서 무엇이 어떻게 손실되는가"* 를 선언할 자리가 없었고,
# 검증 3종(check-conform·check-xml-order·check-empty)은 **pptx 내부 규격**만 재느라
# 원고가 제대로 옮겨졌는지는 아무도 보지 않았다.
#
# 실측(aTest 10장, 2026-09-09): 빌드 rc0 · FAIL 0 · WARN 0 인데도 frontmatter 전량 ·
# `#id-*`·`#transition-*` · `{.fragment}` · `::: htmlart pie` · ```chart 가 소실되고,
# 원본에 **없던** 챕터 TOC 장이 생겨 있었다. 통과가 곧 충실을 뜻하지 않는다.
#
# 이 파일이 하는 일
# -----------------
# 요소마다 *"pptx 에서 무엇이 되는가"* 와 *"왕복하면 돌아오는가"* 를 **선언**한다.
# check-roundtrip.py 가 원본 md ↔ 역변환 md 를 대조해 이 선언과 맞추고,
# **선언되지 않은 손실만** FAIL 로 든다. 선언된 손실은 통과한다 — 그것이 계약의 목적이다.
#
# 등급을 낮추는 것(lossless → drop)은 **품질 후퇴를 명문화하는 행위**다.
# 실측 근거(`evidence`) 없이 낮추지 않는다. 반대로 등급을 올리려면 복원 경로를
# 실제로 구현해야 한다 — 선언만 바꾸는 것은 위반이다.
---
schema_version: 1

# ── 등급 정의 ────────────────────────────────────────────────
# lossless      왕복 후 원본과 같아야 한다. 다르면 FAIL
# lossy         형태는 바뀌지만 **내용(문구·순서)** 은 남는다. 내용이 사라지면 FAIL
# declared_drop 복원되지 않음이 선언됐다. 없어도 통과 — 단 `recover` 로 승격 경로를 남긴다
# synthesized   원본에 **없는데** pptx 에 생긴다. 역변환이 이것을 지워야 원본에 수렴한다
grades: [lossless, lossy, declared_drop, synthesized]

# 수렴 판정 — 이 셋이 0 이면 왕복이 계약대로 돈 것이다
convergence:
  undeclared_loss: 0      # 계약에 없는 손실
  undeclared_gain: 0      # 계약에 없는 생성물
  grade_violation: 0      # lossless 인데 달라짐 · lossy 인데 내용이 사라짐

elements:

  # ── 문서 메타 ──────────────────────────────────────────────
  - id: frontmatter_title
    m2slide: "frontmatter `title:`"
    pptx: "cover 슬라이드(p1) 제목"
    grade: lossless
    evidence: "aTest p1 'aTest' — 2026-09-09"

  - id: frontmatter_meta
    m2slide: "frontmatter 나머지 필드 (subtitle·instructor_*·version·release_date·tags·type…)"
    pptx: "`docProps/custom.xml` 사용자 정의 속성 (lane S)"
    grade: lossless
    reason: |
      lane S 가 frontmatter 를 JSON 으로 직렬화해 문서 속성에 넣는다. 화면에
      보이지 않고 PowerPoint 편집·재저장에 살아남는 **표준 필드**다.
      값이 길면 `m2slide:frontmatter.0`·`.1` 로 쪼갠다 — 한 property 에 몰아 넣으면
      PowerPoint UI 편집에서 잘리는 사례가 있다.
    evidence: "aTest 11 필드 왕복 일치 — 2026-09-09 (승격 전 −10)"
  - id: h1_chapter
    m2slide: "`# H1` 챕터 제목"
    pptx: "Section Header 레이아웃 한 장"
    grade: lossless
    evidence: "aTest p2 '1. 변환 경로 커버리지' — 2026-09-09"

  - id: chapter_toc_slide
    m2slide: "(없음)"
    pptx: "H1 다음에 자동 삽입되는 챕터 목차 장 (부제 + 그 챕터 H2 목록)"
    grade: synthesized
    reason: |
      build-source.py `normalize_chapter` ⑧ 이 만든다. HTML 덱의 챕터 TOC 장에
      대응시키려는 의도이고 원고를 바꾸지는 않지만, **pptx 에는 원본에 없는 장이
      한 개 더 있게 된다**.
    reverse_action: drop
    detect: |
      Section Header 바로 다음 장이면서, 본문 불릿이 이후 장들의 제목 목록과 일치한다.
    evidence: "aTest p3 — 본문 7항목이 p4~p10 제목과 정확히 일치 (2026-09-09)"

  - id: h2_slide_title
    m2slide: "`## H2` 슬라이드 제목"
    pptx: "각 장의 Title placeholder"
    grade: lossless
    evidence: "aTest p4~p10 전부 일치 — 2026-09-09"

  - id: slide_order
    m2slide: "`---` 로 나뉜 슬라이드 순서"
    pptx: "장 순서"
    grade: lossless

  # ── 본문 요소 ──────────────────────────────────────────────
  - id: bullets
    m2slide: "불릿 리스트 (중첩 포함)"
    pptx: "Content placeholder 문단 (들여쓰기 레벨 보존)"
    grade: lossless

  - id: paragraph
    m2slide: "일반 문단 (불릿이 아닌 산문 줄)"
    pptx: "Content placeholder 문단"
    grade: lossy
    reason: |
      ⚠️ **m2slide 파서와 pandoc 이 같은 줄을 다르게 읽는 경우가 있다.** 실측
      (m2Slide_chapter_mode): `  -HTML DIV 태그를 사용하여` 처럼 **하이픈 뒤 공백이
      없는** 줄을 m2slide 는 산문으로, pandoc 은 리스트 항목으로 읽는다. raw HTML 줄도
      마찬가지로 갈린다. 왕복 문제이기 전에 **HTML 덱과 pptx 가 서로 다르게 렌더되는**
      산출물 불일치이고, 고칠 곳은 변환기가 아니라 원고의 표기다.
    caveat: "🚧 비표준 표기를 쓰는 원고에서만 갈린다. 표준 표기 원고는 무손실이다"

  - id: table
    m2slide: "마크다운 표"
    pptx: "네이티브 표"
    grade: lossy
    reason: "정렬 지시자(`:---`)는 pptx 표에 대응 어휘가 없어 소실된다. 셀 내용·행열은 보존."
    evidence: "aTest p6 표 3행 보존 · 정렬 소실 — 2026-09-09"

  - id: subheading
    m2slide: "`### H3` 이하 소제목"
    pptx: "평범한 문단 (`buNone`) + 제목 도형 alt-text 의 깊이·글자 표식 (lane S)"
    grade: declared_drop
    reason: |
      pptx 의 제목은 장마다 하나뿐이라 H3 이하를 담을 자리가 없다. 신호가 없으면
      산문에 섞여 **손실이 보이지도 않는다**.
    recover: |
      **H2 제목이 있는 슬라이드에서는 실제로 복원된다** — 등급이 drop 인 것은
      보장할 수 없기 때문이지 늘 잃기 때문이 아니다. 장 매칭 키를 순번 기반으로
      바꾸면 승격 가능하나, 그 순번이 불안정하다는 것이 아래 근거다.
    caveat: |
      ⚠️ **H2 제목이 없는 슬라이드는 매칭 키가 없다.** lane S 는 제목 + 동명 순번으로
      장을 찾는데(lane B 병합과 같은 규칙), `## H2` 없이 `### H3` 로만 시작하는
      슬라이드는 **매칭 키가 없다**. pandoc 도 그런 장을 제목 없는 장으로 내거나 앞
      장에 붙이므로 순번으로 세는 것도 불안정하다 — 근사하지 않고 선언한다.
    evidence: "m2Slide_chapter_mode 4건 전부 H2 없는 장이라 미복원 — 2026-09-09"

  - id: bullet_nesting
    m2slide: "불릿 중첩 깊이 (2칸 = 1레벨)"
    pptx: "문단 `lvl` 속성"
    grade: lossy
    reason: |
      ⚠️ **m2slide 파서와 pandoc 의 해석이 실제로 갈린다.** m2slide 는 2칸을 1레벨로
      읽고 pandoc 은 CommonMark(부모 마커 + 공백) 기준이라, `    - 레벨 2`(4칸)를
      m2slide 는 레벨 2 로 pandoc 은 레벨 1 로 읽는다. 즉 **같은 원고가 HTML 덱과
      pptx 에서 다른 깊이로 렌더된다** — 왕복 문제이기 전에 산출물 불일치다.
    caveat: "🚧 깊이 3 이상을 쓰는 덱에서 육안 차이가 난다. 별도 이슈로 다룰 값어치가 있다"
    evidence: "m2Slide_chapter_mode '레벨 2'(4칸) → pptx lvl 1 — 2026-09-09"

  - id: ordered_list
    m2slide: "번호 있는 리스트 (`1.` `2.` …). 중첩 깊이는 `bullet_nesting` 이 따로 잰다"
    pptx: "`buAutoNum` 자동 번호 문단"
    grade: lossless
    reason: |
      pptx 가 자동 번호를 **자기 어휘로** 갖고 있어 신호가 필요 없다.
      다만 원본의 시작 번호·구분자(`1)` 대 `1.`)는 보존되지 않는다.
    evidence: "m2Slide_chapter_mode p6 5항목(중첩 2) — 2026-09-09"

  - id: blockquote
    m2slide: "`> 인용문`"
    pptx: "평범한 문단 + 제목 도형 alt-text 의 글자 표식 (lane S)"
    grade: lossless
    reason: |
      pptx 에 인용 어휘가 없어 pandoc 이 평문단으로 낸다. 위치가 아니라 **글자**로
      표시한다 — 원고가 조금 바뀌어도 엉뚱한 줄이 인용문이 되지 않는다.
    caveat: "pptx 화면에서는 인용 서식이 보이지 않는다"
    evidence: "m2Slide_chapter_mode p4 '인용문(Blockquote) 스타일입니다.' — 2026-09-09"

  - id: inline_emphasis
    m2slide: "`**굵게**` · `*이탤릭*` · `` `인라인 코드` ``"
    pptx: "run 의 `b`/`i` 속성"
    grade: lossy
    reason: |
      굵게·이탤릭은 run 속성으로 살아 돌아온다. **인라인 코드는 구분되지 않는다** —
      pptx 에서는 서체만 다를 뿐 별도 표시가 없어 평문으로 되돌아온다.
      ⚠️ 코드블록 안에서는 복원하지 않는다 — 문법 하이라이트가 키워드를 bold 로
      칠하므로 그대로 옮기면 코드에 `**def**` 가 박힌다(실측).
    evidence: "m2Slide_chapter_mode p4 marks=['b','i'] — 2026-09-09"

  - id: mermaid_fence
    m2slide: "` ```mermaid ` 다이어그램"
    pptx: "렌더된 그림 (본문 이미지)"
    grade: declared_drop
    reason: |
      빌드가 mermaid 를 SVG·PNG 로 렌더해 그림으로 넣는다. pptx 에서 **보이는 것은
      정상**이지만 원문 코드는 남지 않아 왕복하면 그림이 된다.
    recover: "lane S 에 원문을 담으면 승격 가능하나, 원고를 통째로 심는 쪽에 가까워 보류"
    evidence: "m2Slide_chapter_mode — 왕복에서 image +3 (2026-09-09)"

  - id: div_other
    m2slide: "`::: columns` · `::: {.column width=\"48%\"}` 등 멀티컬럼 구조"
    pptx: "좌우로 갈린 placeholder (pandoc 이 고른 레이아웃의 부산물)"
    grade: declared_drop
    reason: |
      pandoc 은 컬럼을 레이아웃 선택으로 소화할 뿐 *"이것이 2분할이었다"* 를 적어
      두지 않는다. 폭 비율(`width="48%"`)·중첩 구조는 되살릴 근거가 없다.
    recover: "lane S 에 컬럼 구조(개수·폭)를 적으면 승격 가능 — 별도 이슈"
    evidence: "m2Slide_chapter_mode 원본 7건 → 왕복 0건 (2026-09-09)"

  - id: code_block
    m2slide: "` ``` ` 코드 펜스"
    pptx: "고정폭 서체 문단"
    grade: lossy
    reason: |
      pptx 는 하이라이트 **결과 색**만 갖고 언어명은 어디에도 없다. lane S 가
      제목 도형 alt-text 에 언어를 적어 되돌린다. 등급을 lossy 로 두는 것은
      **탭·후행 공백 같은 미세 서식**이 pptx 문단을 거치며 정규화되기 때문이다.
    evidence: "aTest ```python 언어 왕복 일치 — 2026-09-09"

  - id: image
    m2slide: "`![alt](경로)`"
    pptx: "Picture + 캡션 텍스트박스"
    grade: lossy
    reason: |
      원고 위치가 바뀌므로 build-source.py ⑦ 이 절대경로로 바꾼다. 역변환은 파일을
      다시 꺼내 `img/` 에 두므로 **파일명이 원본과 달라질 수 있다**. alt 는 캡션으로 보존.
    evidence: "aTest p7 Picture + 'Chart' 캡션 — 2026-09-09"

  - id: math_display
    m2slide: "`$$…$$` · `\\[…\\]` 블록 수식"
    pptx: "네이티브 OMML (lane M)"
    grade: lossless
    evidence: "aTest p5 E = mc^2 OMML — lane M 사이드카 2건 (2026-09-09)"

  - id: math_inline
    m2slide: "`\\(…\\)` 인라인 수식"
    pptx: "문장 안 네이티브 OMML"
    grade: lossless
    evidence: "aTest p6 '에너지 등가식은 … 이다' — 2026-09-09"

  # ── 정형 블록 (lane B/C) ───────────────────────────────────
  - id: cards
    m2slide: "`::: cards`"
    pptx: "네이티브 도형 (좌측 액센트 바 + 제목 밴드 + 본문)"
    grade: lossy
    reason: |
      도형에는 *"이것이 cards 였다"* 를 적어 둔 자리가 없다. 역변환은 도형 배치로
      추정해야 하고, process 와 모양이 겹치면 갈린다(구분 신호는 커넥터 유무뿐).
    recover: "도형 `name` 또는 alt-text 에 출처 표식을 심으면 lossless 로 승격 가능"
    evidence: "aTest p4 Rounded Rectangle ×3 + Rectangle ×3 · 커넥터 없음 — 2026-09-09"

  - id: htmlart_lane_b
    m2slide: "`::: htmlart process` · `numbered` · `compare` (lane B 카탈로그)"
    pptx: "네이티브 도형 + 커넥터"
    grade: lossy
    reason: "cards 와 같은 이유. process 는 커넥터가 있어 cards 와 구분된다."
    evidence: "aTest p8 Rounded Rectangle ×3 + Connector ×2 · 항목에 '01.' 번호 — 2026-09-09"

  - id: htmlart_lane_c
    m2slide: "`::: htmlart pie` 등 lane B 카탈로그 **밖** 종류"
    pptx: "평문 불릿 + 제목 도형 alt-text 의 종류 표식 (lane S)"
    grade: lossless
    reason: |
      카탈로그 밖 htmlart 는 도형 배치 자체가 판단이라 lane C(ig-maker) 소관이고,
      비슷한 블록으로 **근사하지 않는다**. 그래서 pptx 에서 *보이는 것*은 여전히
      평문 불릿이다 — 그러나 **원고 왕복**은 무손실이다. 종류가 alt-text 에 남아
      역변환이 블록을 그대로 되감는다.
    caveat: "시각 표현은 lossy 다. 도해가 필요하면 lane C 를 실제로 돌려야 한다"
    evidence: "aTest `::: htmlart pie` 4항목+중첩 1 왕복 일치 — 2026-09-09 (승격 전 −1)"
  - id: component_fence
    m2slide: "` ```chart `·`d3`·`p5`·`map`·`model3d`·`react` 컴포넌트 펜스"
    pptx: "구조 표식 한 줄 (`· 차트 — 웹 슬라이드에서 동작하는 요소입니다`)"
    grade: declared_drop
    reason: |
      JSON·JS 설정이라 남기면 원문이 슬라이드에 그대로 찍힌다. 지우는 것은 맞지만
      자리를 비우면 제목만 남은 백지 장이 배포되므로 표식 한 줄을 남긴다(build-source ⑪).
    recover: |
      캡처 이미지·정지 도해로 미리 바꿔 두면 image 요소로 lossless 화된다.
      lane S 가 **종류**(chart·p5…)는 alt-text 에 남기므로 무엇이 있었는지는 알 수
      있으나, config JSON 은 lane A 진입 전에 삭제되어 되살릴 수 없다 —
      원고를 통째로 심는 것은 복원이 아니라 추출이므로 하지 않는다.
    evidence: "aTest ```chart 1건 — 종류는 신호로 남고 config 는 소실 (2026-09-09)"

  - id: component_drop_note
    m2slide: "(없음)"
    pptx: "컴포넌트를 걷어낸 자리에 남기는 구조 표식 한 줄"
