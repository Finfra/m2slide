# kind: policy/stage — 파이프라인 단계 정책. 읽기는 그 단계 SCAR 만 (Issue340)
# data/m2slide2ppt/transform.yml
# m2slide → pptx 변환 카탈로그 (Issue342)
#
# 왜 이 파일이 있나
# -----------------
# 이 카탈로그들은 오래 [build-source.py](../../lib/pptx/build-source.py) 의 **코드 상수**
# 였다. 그래서 *"chart 를 왜 버리는가"*, *"pie 는 왜 도형이 안 되는가"* 를 바꾸려면
# 코드를 고쳐야 했고, 바뀐 이유를 남길 자리도 없었다. 역방향(ppt2m2slide)이 yml 로
# 데이터-주도인 것과 어긋나 있었다.
#
# 이 파일은 **판정의 어휘**를 소유한다. 무엇을 어떻게 옮기는가(구현)는 여전히
# build-source.py 가 하고, 그 결과가 계약대로인지는
# [fidelity.yml](fidelity.yml) 이 잰다. 셋의 역할이 다르다:
#
#     transform.yml   무엇을 어느 갈래로 보낼 것인가   (이 파일)
#     build-source.py 실제로 어떻게 옮기는가           (구현)
#     fidelity.yml    왕복하면 돌아오는가              (계약·검증)
#
# ⚠️ 이 파일을 고치면 **산출 pptx 가 달라진다**. 근거(`evidence`) 없이 바꾸지 않는다.
---
schema_version: 1

# ── 컴포넌트 펜스 처리 ────────────────────────────────────────
# HTML 에서만 살아 있는 것들. 남기면 JSON·JS 원문이 슬라이드에 그대로 찍힌다
# (실측: 45번 장에 `<h1 class=…>` 노출).
fences:
  # 태그만 벗기고 글자는 남긴다 — 글자가 곧 내용인 것들
  unwrap: [wordart]

  # 통째로 걷어낸다. 다만 **자리를 비우지 않는다** — 제목만 남은 백지 장이
  # 배포되는 것을 실측했다(2026-09-09 aTest p18 chart·p19 p5, 검증 FAIL 0 통과).
  # 무엇이 있던 자리인지 한 줄 표식을 남기는 것은 목차 라벨과 같은 **구조 표식**이며
  # 원고의 문장을 짓는 것이 아니다.
  drop:
    chart:    "차트"
    d3:       "인포그래픽(d3)"
    p5:       "시뮬레이션(p5.js)"
    map:      "지도"
    model3d:  "3D 모델"
    react:    "인터랙티브 컴포넌트(React)"
  drop_note: "· %s — 웹 슬라이드에서 동작하는 요소입니다"

# ── lane B — 정형 블록을 네이티브 도형으로 ────────────────────
# pptx 에는 "카드 그리드" 라는 어휘가 없어 그냥 두면 평문 불릿으로 눕는다.
# 그 자리를 글로벌 ppt-info 블록 렌더러로 다시 그린다 — **그림이 아니라 도형**이라
# 문구를 그대로 고칠 수 있다.
#
# ⚠️ **lane B 와 lane C 의 경계는 "여기 있는가" 하나다.** 여기 없는 htmlart
#    (pie·matrix·venn…)는 도형 배치 자체가 판단이고, 그 판단은 장당 33만 토큰짜리
#    ig-maker(lane C) 소관이다. **비슷한 블록으로 근사하지 않는다** —
#    근사하면 원본과 다른 도해가 조용히 나간다.
lane_b:
  cards:              cards      # 카드 그리드    → ppt-info `cards`
  htmlart numbered:   cards      # 번호 카드      → 같은 블록(번호는 우리가 매긴다)
  # htmlart process 는 lane G(SmartArt) 로 옮겼다 — 아래 `smartart` 카탈로그. 자원이 없는
  # 기계에서는 lane G 가 `fallback: process` 로 되돌려 이 `cards`+`flow_arrow` 경로를 탄다
  htmlart compare:    compare    # 좌우 동등 비교 → `compare` (1:1 대응)
  # 순차형 4종 — 진행 순서가 내용의 전부라 `process` 매핑을 그대로 탄다.
  # HTML 의 시각 변주(연대축·갈매기·계단·깔때기)는 pptx 에서 근사하지 않는다 —
  # 살아남는 것은 **순서와 연결**이고 그것이 flow_arrow 가 그리는 것이다.
  htmlart timeline:   process
  htmlart chevron:    process
  htmlart step:       process
  htmlart funnel:     process

# ── 줄 단위로 지우는 디렉티브 ─────────────────────────────────
# pptx 에 대응 어휘가 없는 m2slide 고유 지시자. 각 항목의 손실 등급과 승격 경로는
# fidelity.yml 의 같은 이름 요소가 소유한다 — 여기는 *"지운다"* 는 사실만 적는다.
strip_directives:
  - id: directive_id
    pattern: '^[ \t]*#id-[a-z][a-z0-9-]*[ \t]*$'
    note: "발표자 노트 식별자. 노트로 승격 가능(fidelity.recover)"
  - id: directive_animation
    pattern: '^[ \t]*#(?:transition-[\w-]+|background-[\w.#-]+|background-(?:image|size|transition)-\S+|auto-animate|autoslide-\d+)[ \t]*$'
    note: "reveal.js 애니메이션. pptx 전환과 1:1 이 아니라 근사가 된다"
  - id: slot_right
    pattern: '^[ \t]*::right::[ \t]*$'
    note: "Slidev 호환 2분할. `Two Content` 레이아웃 매핑이 승격 경로"

# ── 테마 꼴 좌표 (Issue345) ───────────────────────────────────
# 글로벌 `theme-from-css.py` 는 **색·서체만** 옮긴다. 그래서 pptx 는 팔레트만 같고
# 생김새는 pandoc 기본이었다 — placeholder 가 4:3 기본 좌표(10×7.5in)로 남아
# 13.33in 판에 9.5in 상자가 앉고(우측 3.8in 공백), 테마 가로선도 없었다.
#
# 아래 값은 **HTML 덱을 실제로 렌더해 잰 것**이다(캔버스 1920×1280 px). CSS 를 읽어
# 계산하지 않은 이유는 flex 최종 위치가 선언만으로 정해지지 않기 때문이다.
# `lane-t.py`(이식)와 `check-visual.py`(검증)가 **같은 이 값을** 읽는다 — 두 곳에
# 따로 적으면 어긋난 채로 서로를 통과시킨다.
#
# ⚠️ theme 을 바꾸면 이 값도 다시 재야 한다. 지금 값은 `default` 기준이다.
theme_geometry:
  canvas_w: 1920            # reveal 캔버스 폭(px). 높이는 slide_ratio 로 정해진다
  margin: 56                # 좌우 여백 — CSS section padding
  rule_h: 10                # 가로선 두께 (hr.png 높이)
  rule_top: 22              # 상단 가로선 top — **표지**(머리말 바가 없는 장)
  # ⚠️ 본문 장은 다르다. CSS `::before` 는 22 라고 말하지만 **렌더된 픽셀은 y≈71** 이다
  #    (2026-09-11 ego 캡처 픽셀 스캔: 노란 띠 71~74 · 22 에는 없음). 머리말 바(28~62) 아래에
  #    선이 앉는다. 사용자가 PowerPoint 에서 손으로 66 으로 옮긴 값과 일치한다.
  #    CSS 선언이 아니라 **픽셀을 정본**으로 삼는다.
  rule_top_content: 66
  rule_bottom: 1248         # 하단 가로선 top (= 캔버스높이 − 22 − 10)
  # 제목 밑줄 — CSS 상자(80+96)로 계산하면 166 인데 픽셀은 180~184(띠 중심 182 → 줄 top 177).
  # 상자 높이를 건드리지 않고 밑줄만 아래로 내린다
  underline_dy: 9
  title_top: 80
  title_h: 96               # 밑줄은 이 상자의 **맨 아래** 10px (CSS `::after{bottom:0}`)
  body_top: 205
  body_h: 1019
  asset: hr.png             # theme-img/ 안의 가로선 이미지. 도형으로 근사하지 않는다

# ── 표지·머리말 좌표 (Issue347) ────────────────────────────────
# 같은 이유로 **HTML 을 실제로 렌더해 잰 값**이다(ego-browser, 캔버스 1920×1280).
# pandoc 의 `Title Slide` 는 title·subtitle·author·date 넷밖에 모르므로 표지는
# lane T 가 직접 짓는다 — 로고는 section 의 background-image 라 `<img>` 로도 안 잡힌다.
cover_geometry:
  logo:        { l: 94,   t: 151,  w: 346, h: 204, asset: finfraPuffer1.png }
  title:       { l: 56,   t: 426,  w: 1808, h: 158, fs: 155, align: center, bold: true }
  subtitle:    { l: 56,   t: 616,  w: 1808, h: 40,  fs: 40,  align: center }
  # 강사 정보는 **테두리 상자 + 이름 + 연락처** 셋이다. 하나로 합치면 HTML 의 두
  # 요소가 pptx 에서 한 글자 덩어리가 되어 대조가 어긋난다(실측 2026-09-10)
  instructor_box:     { l: 1233, t: 798, w: 631, h: 79, outline: true, border_px: 2, color: "FFD700", radius_px: 6 }
  # ⚠️ 폭은 HTML 실측(255·245)보다 **넉넉히** 준다. pptx 서체가 웹 서체보다 넓어
  #    실측 폭 그대로 두면 `남중구 ( 핀프 라 )` 처럼 접힌다(실측 2026-09-10).
  #    `wrap="none"` 을 넣어도 뷰어에 따라 무시되므로 폭으로 막는 편이 안전하다.
  instructor_name:    { l: 1258, t: 820, w: 296, h: 34, fs: 34, align: left }
  instructor_contact: { l: 1556, t: 823, w: 300, h: 30, fs: 31, align: left }
  corner_tl:   { l: 96,   t: 1,    w: 400, h: 16,  fs: 12,  align: left }
  corner_br:   { l: 1424, t: 1263, w: 400, h: 16,  fs: 12,  align: right }
  version:     { l: 1624, t: 0,    w: 200, h: 16,  fs: 14,  align: right }
  license:     { l: 760,  t: 1262, w: 400, h: 16,  fs: 14,  align: center }

# 본문 장 제목 옆 마스코트 — CSS `background-position: right 4% center` ·
# `background-size: auto 119%` 를 제목 상자(56,80,1808,96) 기준으로 환산한 값
contents_mascot:
  l: 1672
  t: 71
  w: 125
  h: 114
  asset: finfraPuffer2s.png

# 본문 장 머리말 바 — 상단 가로선과 제목 사이에 앉는다
head_geometry:
  left:  { l: 84,  t: 34, w: 868, h: 26, fs: 20, align: left }
  right: { l: 968, t: 34, w: 868, h: 26, fs: 20, align: right }

# ── 카드 좌표·색 (Issue349) ───────────────────────────────────
# lane B 는 글로벌 ppt-info 의 `cards`(좌측 액센트 바 + 회색 본문)를 그린다. 그것은
# **m2slide 카드와 다른 디자인**이다 — m2slide 는 **상단 노란 제목 밴드 + 본문**이다.
# 아래는 HTML 을 실제로 렌더해 잰 값(ego-browser, 캔버스 1920×1280 · card_columns: 3).
#
# ⚠️ 세로 위치도 다르다 — lane B 는 본문 영역 **중앙**에, HTML 은 **상단**에 놓는다.
card_geometry:
  top: 253            # 본문 영역(205) 아래 48px
  gap: 14             # 카드 사이 간격
  band_h: 130         # 제목 밴드 높이
  body_line_h: 69     # 본문 한 줄 높이
  pad_bottom: 38      # 본문 아래 여백
  body_pad_x: 23      # 본문 좌우 안쪽 여백
  radius_pct: 8       # 모서리 둥글기 (카드 높이 대비 %) — HTML 20.24px ≈ 237×8.5%
  card_bg: "F5F5F5"   # rgba(0,0,0,0.04) 를 흰 바탕 위에서 환산
  band_bg: "F5C518"   # --kn-accent
  fg: "111111"        # --kn-text
  border: "E0E0E0"    # rgba(0,0,0,0.12) 환산
  band_fs: 40
  body_fs: 40

# ── 서체 (Issue350) ──────────────────────────────────────────
# 글로벌 `theme-from-css.py` 는 CSS 체인에서 **Windows 폰트**(`Malgun Gothic`)를
# 골랐다. macOS 에서 열면 그 서체가 없어 대체 렌더되므로 같은 파일이 기계마다 다르게
# 보인다. 아래는 HTML 을 실제로 렌더해 잰 **computed 서체**다(ego-browser).
#
#   제목  `--title-font-family` 첫 항목                → GmarketSansBold
#   본문  `.contents-body` computed 첫 항목            → Nanum Gothic Coding
#
# ⚠️ 둘 다 **설치돼 있어야** pptx 가 HTML 과 같아 보인다(실측 2026-09-11, jm4: 둘 다 있음).
#    없는 기계에서는 pptx 가 대체 서체로 렌더된다 — 그것은 pptx 의 한계이고
#    웹폰트처럼 내려받게 할 방법이 없다.
# ⚠️ **CSS 이름 ≠ OS family 이름** (2026-09-11 system_profiler 실측). CSS 는 @font-face 별칭
#    (`GmarketSansBold`·`Nanum Gothic Coding`)을 쓰지만 macOS 가 등록한 family 는
#    `Gmarket Sans`(Style Bold) · `NanumGothicCoding`(공백 없음)이다. pptx 에 CSS 이름을
#    넣으면 PowerPoint 가 못 찾아 **대체 서체로 떨어진다** — "폰트 안 맞음" 의 뿌리였다.
#    pptx 는 family + bold 속성으로 face 를 고르므로 제목은 `Gmarket Sans` + b=1 이다.
font:
  title: "Gmarket Sans"          # CSS `GmarketSansBold` — OS family(PowerPoint 서체 캐시 fa·LibreOffice 매칭 모두 "Gmarket Sans"). "Gmarket Sans Bold"(name ID1) 는 한글(ea) 매칭이 깨진다 (실측 2026-09-11 A/B)
  title_bold: true               # family + b=1 로 Bold face 를 고른다 (face 는 Light/Medium/Bold 뿐)
  body: "NanumGothicCoding"      # CSS `Nanum Gothic Coding` — OS family 는 공백 없음
  # 코드 서체 — **템플릿이 들고 있는 서체**여야 한다 (Issue358, 사용자 결정 2026-09-19).
  # 구 값 "Menlo" 는 CSS 체인("SF Mono", Monaco, Menlo, Consolas, "Courier New")에 실제로
  # 있는 값이라 근거 없는 선택은 아니었다. 어긋난 것은 축이다 — **HTML 은 폴백 체인이 있고
  # pptx 는 단일 지정**이다. 이 pptx 에는 임베드 폰트가 없으므로 Menlo 가 없는 머신
  # (Windows 등)에서는 조용히 대체되어 배포본이 보는 사람마다 달라진다.
  # NanumGothicCoding 은 테마 minor 서체이자 코딩용 모노스페이스 + 한글 지원이라 어느
  # 머신에서든 같다. 코드·본문 구분은 코드 상자 배경과 키워드 색이 이미 맡는다.
  code: "NanumGothicCoding"
  css_alias:                     # 검증이 CSS 쪽 이름을 보고 헷갈리지 않도록 대응표
    GmarketSansBold: "Gmarket Sans"
    "Nanum Gothic Coding": "NanumGothicCoding"

# ── Agenda 장 꼴 (Issue351) ──────────────────────────────────
# HTML `layout-_agenda` 는 reveal 덱이 아니라 **고정 px 여백을 쓰는 별도 프레임**이라
# 뷰포트에 따라 캔버스 환산값이 달라진다(896 폭 실측과 1920 폭 실측이 ~50px 어긋났다 —
# 2026-09-11). **1920 뷰포트를 정본**으로 삼는다.
#   제목   `.toc-page-title`  (59,66,218×67) fs 51 · GmarketSansBold · 좌측
#   박스   `.toc-markmap`     (27,209,1865×1043) border 2px #F5C518 · radius 8
#   상단선 `::before` hr.png   right 24 · top 12 → (27,14,1866×10)
#   고양이 `::after` finfraCat  contain · 우상단 33.8px 여백 → (1640,38,242×253)
#   하단선 **없음** — 픽셀 1250 의 노랑은 박스의 아래 테두리다
agenda_geometry:
  title:  { l: 59,   t: 66,  w: 600,  h: 67,   fs: 51, align: left, bold: true }
  frame:  { l: 27,   t: 209, w: 1865, h: 1043, border_px: 2, radius_px: 8 }
  rule:   { l: 27,   t: 14,  w: 1866, h: 10 }
  mascot: { l: 1640, t: 38,  w: 242,  h: 253,  asset: finfraCat.png, fit: contain, anchor: top-right }
  bottom_rule: false
  body_pad: 40

# ── 코드블록 (Issue352) ─────────────────────────────────────
# HTML `pre`(github.css) 실측 (2026-09-11, 캔버스 1920×1280):
#   상자 (56,245,1808×155) · bg #F6F8FA · radius 6 · padding 27.2px 34px
#   글자 34px · line-height 49.3px(=1.45) · 색 #24292E · 키워드 #D73A49 (굵게 아님)
#   다음 요소(수식)는 상자 아래 60px 에 앉는다
# pandoc 은 코드를 **본문 placeholder 안의 문단**으로 내므로(줄바꿈은 `<a:br>`), 상자는
# placeholder **뒤에** 깐 도형이고 글자 스타일은 그 문단의 run 을 고친다.
# ⚠️ ③-b 강조 색 교정이 키워드(bold run)를 `--kn-strong` 초록으로 칠하던 것을 코드 문단은
#    건너뛰게 했다 — 코드의 bold 는 강조가 아니라 하이라이트다.
code_geometry:
  top_gap: 40            # 본문 영역 상단(205)에서 상자까지
  pad_y: 27
  pad_x: 34
  fs: 38.6
  line_h: 49.3
  gap_after: 60          # 상자 아래 다음 요소까지
  bg: "F6F8FA"
  fg: "24292E"
  keyword: "D73A49"
  radius_px: 6

# ── 네이티브 차트 (Issue353) ─────────────────────────────────
# lane B 카탈로그 밖(pie)은 lane C(ig-maker) 소관이었고 "근사하지 않는다" 가 원칙이다.
# 그러나 **pptx 가 자기 어휘로 가진 것**(차트)은 근사가 아니다 — 편집 가능한 네이티브
# 차트를 그린다. 원칙은 그대로다: 도형 배치가 *판단* 인 것만 lane C 로 보낸다.
native_charts:
  "htmlart pie": pie

# HTML `.htmlart-pie` 실측 (1920×1280): 컨테이너 (56,245,1808×939) ·
#   파이 중심 (675,715) 반지름 407 · 조각 라벨 24px 흰색 ·
#   범례 열 x 1210~1651, 행 pitch 203 (첫 행 top 308) · 스와치 41×41 at x 1151 ·
#   라벨 20px 700 · 서브라벨 15px 400 · 색 = --m2-accent-1..6 순환
pie_geometry:
  container: { l: 56, t: 245, w: 1808, h: 939 }
  plot:      { l: 268, t: 308, w: 814, h: 814 }
  legend:    { l: 1151, t: 308, w: 500, row_h: 203, swatch: 41, swatch_dy: 36, label_dy: 69, label_dy_nosub: 83, label_h: 38, sub_dy: 111, sub_h: 23 }
  label_fs: 31.3         # viewBox 20px × 1.565 (svg 축척, 1920×1280 뷰포트 실측)
  sub_fs: 23.5           # viewBox 15px × 1.565
  pct_fs: 37.6           # viewBox 24px × 1.565 — 조각 안 백분율
  colors: ["F5C518", "4ABDAC", "FC4A1A", "7B68EE", "2B8A9D", "C49D13"]

# ── `Content with Caption` 장 재배치 (Issue355) ─────────────────────────
# pandoc 은 "글 + 표/그림" 을 Content with Caption(글 좌 · 내용 우 · 캡션) 으로 낸다.
# HTML 은 **리스트+이미지만** 좌우로 가르고(`.m2-cols` 868/868, 실측 1920×1280),
# 문단+표는 위아래로 쌓는다(표는 내용 폭·가운데, `implicit_figures` 캡션은 없다 —
# alt 는 화면에 안 보이고 `img[alt]` 로만 남는다 → pptx 도 그림 alt-text 로 옮긴다).
split_geometry:
  top: 245
  h: 939
  col_w: 868
  gap: 72
table_geometry:
  gap_before: 40         # 앞 문단 아래에서 표까지 (HTML p 245+61 → table 346)
  para_line_h: 61        # 본문 문단 한 줄 높이 (45.4px 글자)
  # ── 표 셀 글자·폭 (Issue358 실측 교정, 2026-09-19) ──────────────
  # fs 는 **표 전용**이다(lane-t.py 764 한 곳). 앞 문단의 para_line_h 와는 별개 키라
  # 이 값을 고쳐도 본문 문단은 영향받지 않는다.
  #
  # 구 값 45.4 는 본문 문단 글자(para_line_h 주석)를 표에 그대로 쓴 것이었다. 실측하면
  # HTML 의 `td`·`th` 는 둘 다 **40px** 이다(ego-browser getComputedStyle, aTest p5).
  # 1920px = 13.333in 이라 1px = 정확히 0.5pt → 45.4 는 22.7pt, 40 은 20pt.
  #
  # ⚠️ 이 13.5% 초과가 **셀 줄바꿈의 직접 원인**이었다. 열 폭 계산도 같은 fs 를 쓰므로
  #    글자와 칸이 함께 커져 상쇄될 듯하지만, 어림이 **여유 0** 으로 맞아떨어지는 구조라
  #    경계를 아슬아슬하게 넘었다 — 실측: 'lane A' 68.1pt vs 가용 68.0pt → 0.1pt 초과로
  #    두 줄이 됐다('lane'/'A'). '정형 블록'·'네이티브 도형' 도 같은 이유로 잘렸다.
  fs: 40
  # ── 표 전체 폭 — CSS 의 min/max-width 를 그대로 옮긴다 ──────────
  # HTML 표는 `table-layout: auto` + `min-width: 50%` · `max-width: 90%` 다.
  # 본문 폭(1920 - 2*margin 56 = 1808)의 50% = **904px** 이고, 실측 표 폭이 정확히 904 다.
  # 콘텐츠 합(800)보다 min-width 가 커서 그 값이 이긴 것이다 — 남는 폭은 auto 레이아웃이
  # 열에 비례 배분한다(실측 226·293.5·383.5 = 계산값 200·260·340 × 1.13).
  #
  # 이 두 줄이 **잘림 방지의 본체**다. 임의의 안전 계수를 두지 않는 이유가 그것이다 —
  # 여유는 우리가 지어낸 값이 아니라 HTML 이 이미 갖고 있던 폭이다.
  min_w_ratio: 0.5       # CSS min-width: 50% (부모 = 본문 가용폭)
  max_w_ratio: 0.9       # CSS max-width: 90%
  pad_x: 40
  pad_y: 10              # HTML 16 이나 pptx 줄높이(1.2em)가 커서 행 74 를 맞추려면 10
  row_h: 74
  head_bg: "F0F0F0"      # th rgba(0,0,0,.06) on white
  border: "CCCCCC"       # td border-bottom 1px rgba(0,0,0,.2)
  border_px: 1
  fg: "111111"
  head_bold: true

# ── lane G — htmlArt 를 **SmartArt(다이어그램)** 로 (Issue357) ───────────────
# htmlArt 는 애초에 PowerPoint SmartArt 를 본떠 만든 어휘다(data/htmlart/smartart-catalog.yml).
# 그러므로 정방향의 정본 대응은 도형 근사(lane B)가 아니라 **SmartArt 그 자체**다 —
# 역방향(data/ppt2m2slide/mappings.yml)이 "Basic Process" → process 로 읽는 것과 대칭이고,
# PowerPoint 에서 SmartArt 로 편집된다. 레이아웃·색·스타일 정의는 PowerPoint 앱 자원에서
# 읽는다(SmartArt 를 담은 모든 pptx 에 같은 XML 이 그대로 들어간다). 없으면 lane B 로 되돌린다.
# 캐시 도형(편집 전까지 PowerPoint 가 그대로 보여 주는 것)은 HTML renderProcess 실측 기하다.
smartart:
  resources: "/Applications/Microsoft PowerPoint.app/Contents/Frameworks/SmartArt.framework/Versions/A/Resources"
  catalog:
    htmlart process: { layout: process1, colors: accent1_1, style: simple1, fallback: process }
    htmlart chevron: { layout: chevron1, colors: accent1_1, style: simple1, fallback: process,
                       geometry: chevron_geometry, needs_flat: true }
    #   chevron1 = Basic Chevron Process. ⚠️ `needs_flat` — 하위 항목이 있으면 lane B 로
    #   되돌린다. chevron1 은 자식 유무로 layoutNode 갈래가 갈리는데(`parTxOnly` vs
    #   `composite`+`parTx`+`desTx`) 후자는 캐시 도형과 데이터 모델이 1:1 이 아니게 된다.
    #   실사용 원고는 전부 제목만 쓰므로(m2Slide_visual_component 5.12 · fPmIntro 01)
    #   **검증할 수 있는 갈래만** 넣는다 — 근사하지 않는다
    #   process1 = Basic Process · accent1_1 = Colored Outline - Accent 1 (흰 면 + 강조색 테두리,
    #   HTML 과 같은 꼴) · simple1 = Simple Fill. 나머지 htmlart 종류는 레이아웃별 캐시 기하를
    #   실측해 넣을 때 여기에 추가한다 (역매핑 표: mappings.yml smartart_to_htmlart)
  #   renderChevron 실측 (client.js L737~) — 맞물린 갈매기. tip 만큼 겹쳐 물린다
  chevron_geometry:
    art: { l: 56, t: 245, w: 1808, h: 939 }
    ch_w: 290
    ch_h: 204
    tip_ratio: 0.4             # tip = ch_h × 0.4 — 화살촉 깊이
    pad_x: 20
    pad_y: 30
    title_fs: 29               # centerLabel 인자
    sub_fs: 19
    opacity_base: 0.6          # fill-opacity = base + (1-base)×i/(N-1) — 진행에 따라 진해진다
  process_geometry:            # renderProcess 의 viewBox 단위 (client.js: boxW·boxH·arrowGap·padY)
    art: { l: 56, t: 245, w: 1808, h: 939 }   # .htmlart-process 상자 — svg 가 비율 유지로 가운데
    box_w: 196
    box_h: 230
    gap: 52
    pad_y: 28
    fill: "F4F4F5"             # --htmlart-surface
    border_vb: 2               # 테두리 = 강조색(accent1)
    radius_vb: 14
    title_fs_max: 44           # titleFsFor: min(h×.30, w×.21, 44, 폭 상한) — 체인 전체 최솟값
    sub_ratio: 0.66            # nodeBox: sub = round(title × .66)
    arrow: { dx1: -13, dx2: 15, dy: 16, alpha: 45 }   # 삼각 화살표 (gx 기준 · 검정 45%)
