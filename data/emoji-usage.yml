# 톤별 사용 가이드 — data/md-builder/styles.yml 의 styles[].tone 와 연동
tone_guide:
  formal_lecture: "상태(✅ ⚠️ ❌)·핵심(🎯) 위주, 슬라이드당 1~2개. 표정·감정 이모지 지양"
  casual_tutorial: "감정·리듬 이모지 허용. 그래도 한 슬라이드 과다 금지"
  reference_doc: "이모지 최소화 — 상태 표시 외 지양"
