# note-writer v1 SSOT — slide-id 부여 규칙·톤 프리셋·노트 길이 가이드·검증·체크포인트.
# 사용자가 본 파일을 수정하면 SCAR 본문 변경 없이 즉시 반영됨 (agent가 호출 시점에 매번 Read).
# Issue257 (Issue256의 note.md 빌드 병합 메커니즘 위에 자동 초안 생성 agent를 얹음).
#
# 프로젝트 단위 override (L2 cascade — _doc_arch/pipeline-policy-cascade.md):
#   Projects/<Name>/_pipeline/policy/note-writer.yml 에 본 파일 최상위 키의 부분집합을
#   기록하면 해당 프로젝트에서만 deep-merge(프로젝트 우선)로 적용됨. 본 파일(L1)은
#   전 프로젝트 공통 기본값. L2에만 존재하는 orphan 키는 경고 후 무시됨.
# 본 파일 직접 수정 전 backup 의무: ./lib/tuner/backup-data-yml.sh data/note-writer/patterns.yml
---
version: 1

# ============================================================================
# 1. slide-id(slug) 자동 부여 규칙
# ============================================================================
# `#id-{slug}` 디렉티브가 없는 슬라이드에 제목 기반 slug를 자동 부여한다.
# 문법 SSOT: lib/slide-parser.js extractDirectives() `^#id-([a-z][a-z0-9-]*)\s*$`
slug_generation:
  source: slide_title              # H2/H3 제목에서 slug 생성
  method: kebab_case_ascii          # 소문자 kebab-case, 비ASCII(한글 등)는 로마자 변환 시도 실패 시 순번 fallback
  fallback: "slide-{index}"        # 제목이 비어있거나 변환 실패 시 순번 기반
  duplicate_suffix: "-{n}"          # 동일 파일 내 slug 중복 시 -2, -3, ... 부여
  # ⚠️ 2026-07-05 정책 교정 (m2Slide_single_mode 학습): after_heading(헤더 다음 줄) 배치 금지.
  #   슬라이드가 `#layout-*` 등 선행 디렉티브로 시작하면 파서(lib/slide-parser.js extractDirectives)가
  #   빈 줄에서 디렉티브 블록을 종료하므로 헤더 뒤에 둔 `#id-*`는 전량 유실됨(노트 병합 0건).
  #   반드시 슬라이드 최상단 디렉티브 블록에 기존 디렉티브와 빈 줄 없이 인접 스택할 것.
  directive_insert_position: slide_top_directive_block   # 슬라이드 첫 비공백 라인부터의 연속 디렉티브 블록에 스택
  whitelist: '^[a-z][a-z0-9-]*$'    # #id-{slug} 화이트리스트와 동일

# ============================================================================
# 2. 톤 프리셋 (Info.md "강연 톤"·"청중 수준" 매핑)
# ============================================================================
tone_presets:
  - id: casual_lecture
    trigger: ["구어체", "친근", "편안한 톤"]
    style: "짧은 구어체 문장. 청중에게 말 걸듯이."
  - id: formal_conference
    trigger: ["격식", "학술", "컨퍼런스"]
    style: "완결된 문어체 문장. 근거·출처 우선 언급."
  - id: workshop_handson
    trigger: ["실습", "워크숍", "핸즈온"]
    style: "다음 행동 지시형('~해보세요', '~를 확인하세요')."
  - id: default
    trigger: []
    style: "중립적 설명체. 슬라이드 핵심 메시지 1개 + 청중 반응 유도 질문 선택."

selection_policy:
  evaluation: first_match           # tone_presets 위→아래 첫 매칭 채택 (Info.md 톤 필드 대조)
  default_preset: default

# ============================================================================
# 3. 노트 길이·작성 가이드
# ============================================================================
content_policy:
  length_guide:
    min_sentences: 1
    max_sentences: 4
    unit: "슬라이드당"
  forbidden_patterns:
    - id: verbatim_body_echo
      desc: "슬라이드 본문 bullet을 그대로 옮겨적기 금지 — 노트는 '무엇을 말할지'이지 '무엇이 쓰여있는지'가 아님"
    - id: filler_only
      desc: "\"이 슬라이드는 ~에 대한 내용입니다\" 류 내용 없는 문장 단독 사용 금지"
  recommended_content:
    - "청중에게 던질 질문 또는 아이스브레이킹 문구"
    - "슬라이드에 없는 배경 설명·실제 사례"
    - "다음 슬라이드로 넘어가는 연결 멘트"
  body_preservation: true           # 슬라이드 본문 `.md`는 slide-id 디렉티브 삽입 외 수정 금지

# ============================================================================
# 4. 산출물 양식
# ============================================================================
output_template:
  path: "markdown/{stem}_note.md"   # chapter mode. single mode는 `{ProjectName}_note.md`
  block_format: |
    ## {slide-id}
    {note_body}
  frontmatter: false                 # note.md는 Frontmatter 불필요 (speaker-notes-design.md 예외 사유 참조)

# ============================================================================
# 5. 검증 규칙
# ============================================================================
validation_rules:
  - id: all_notes_have_matching_id
    desc: "note.md의 모든 `## {slide-id}` 항목이 본문 어딘가의 `#id-{slug}`와 매칭됨(orphan 0건)"
    on_failure:
      action: warn_only            # 빌드 중단 아님 — lib/html-builder.js console.warn과 동일 정책
  - id: length_within_guide
    desc: "각 노트 블록이 content_policy.length_guide 범위 내(참고용, 강제 아님)"
  - id: no_verbatim_echo
    desc: "노트 본문이 대응 슬라이드 bullet과 90% 이상 문자열 일치하지 않음"

# ============================================================================
# 6. 사용자 검토 체크포인트
# ============================================================================
checkpoint:
  template: |
    note-writer 산출 검토:
    - 노트 작성 슬라이드: {note_count}건
    - 신규 slide-id 자동 부여: {assigned_id_count}건
    - 산출 위치: {paths}

    톤·정확성 확인 후 다음 단계(10: md2tts-txt) 진행 가능?
  skip_flag: "--no-checkpoint"
  on_reject:
    action: ask_user_modifications
    max_iterations: 3

# ============================================================================
# 7. 종료 보고 양식
# ============================================================================
report_template: |
  ## note-writer 완료
  * 처리 챕터: {chapter_count}
  * 노트 작성 슬라이드: {note_count} / 전체 슬라이드 {total_slides}
  * 신규 slide-id 자동 부여: {assigned_id_count}건
  * 산출: {note_files}
  * 검증: orphan 0건 {orphan_status}
  * 다음 단계: 단계 10 md2tts-txt (재빌드 시 `<aside class="notes">` 자동 병합 — Issue256)
