# component-libraries.yml — 시각화 라이브러리 메타 SSOT (Issue180 Phase 0)
# 스키마·디스패처 contract: _doc_arch/component-libraries.md
# component-slide.md 라이브러리 표는 본 파일 status를 참조 (이중 SSOT 금지).
# 로더: lib/component-registry.js (블록 스타일 전용 파서 — flow map 미사용).
# 사용자가 본 파일을 수정하면 빌드 시 즉시 반영됨 (html-builder.js가 매 빌드 Read).
---
version: 1

libraries:
  # ==========================================================================
  # 기존 적용 라이브러리
  #   injection: unconditional — html-builder.js 정적 <script> 블록이 담당.
  #   generic 디스패처는 이중 주입 방지를 위해 unconditional 항목을 skip.
  # ==========================================================================
  - id: revealjs
    component: 프레젠테이션 프레임워크
    stage: 8
    injection: unconditional
    status: applied
    init_hook: null
    cdn:
      - type: js
        url: https://cdn.jsdelivr.net/npm/reveal.js@5.0.4/dist/reveal.js
    detect_fenced_lang: []
    detect_inline: []

  - id: markmap
    component: TOC 마인드맵
    stage: 8
    injection: unconditional
    status: applied
    init_hook: null
    cdn:
      - type: js
        url: https://cdn.jsdelivr.net/npm/markmap-view@0.18.12/dist/browser/index.js
    detect_fenced_lang: []
    detect_inline: []

  - id: mermaid
    component: 도형
    stage: 5
    injection: unconditional
    status: applied
    init_hook: null
    cdn:
      - type: js
        url: https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js
    detect_fenced_lang: []
    detect_inline: []

  - id: d3
    component: 인포그래픽
    stage: 5
    injection: unconditional
    status: applied
    init_hook: d3_dispatch
    cdn:
      - type: js
        url: https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js
    detect_fenced_lang:
      - "d3"
    detect_inline: []

  # ==========================================================================
  # 신규 코어 라이브러리 (Issue181 수식·차트·심벌 / Issue182 지도·인포그래픽)
  #   injection: conditional — generic 디스패처가 detect 신호 매칭 시 주입.
  #   코어 5종 전부 status: applied (Phase 1~2 완료).
  # ==========================================================================
  - id: katex
    component: 수식
    stage: 4
    injection: conditional
    status: applied
    init_hook: katex_autorender
    cdn:
      - type: css
        url: https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css
      - type: js
        url: https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js
      - type: js
        url: https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js
    detect_fenced_lang: []
    detect_inline:
      - "$$"
      - "\\("

  - id: chartjs
    component: 차트
    stage: 5
    injection: conditional
    status: applied
    init_hook: chart_dispatch
    cdn:
      - type: js
        url: https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js
    detect_fenced_lang:
      - "chart"
    detect_inline: []

  - id: fontawesome
    component: 심벌
    stage: 4
    injection: conditional
    status: applied
    init_hook: null
    cdn:
      - type: css
        url: https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.6.0/css/all.min.css
    detect_fenced_lang: []
    detect_inline:
      - "fa-solid"

  - id: leaflet
    component: 지도
    stage: 5
    injection: conditional
    status: applied
    init_hook: map_dispatch
    cdn:
      - type: css
        url: https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css
      - type: js
        url: https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js
    detect_fenced_lang:
      - "map"
    detect_inline: []

  # ==========================================================================
  # React artifact (Issue184) — 인터랙티브 컴포넌트.
  #   ```react fenced block 본문 = JSX. Babel-standalone in-browser 변환.
  #   CDN 3종 conditional 주입 — react 블록 없는 데크는 영향 0.
  #   React 18.3.1 UMD (마지막 UMD 빌드 — global window.React/ReactDOM 노출).
  # ==========================================================================
  - id: react
    component: React artifact
    stage: 5
    injection: conditional
    status: applied
    init_hook: react_dispatch
    cdn:
      - type: js
        url: https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js
      - type: js
        url: https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js
      - type: js
        url: https://cdn.jsdelivr.net/npm/@babel/standalone@7.26.4/babel.min.js
    detect_fenced_lang:
      - "react"
    detect_inline: []

  # ==========================================================================
  # htmlArt 구조 도해 렌더 백엔드 (Issue193) — CSS → SVG 전환.
  #   `::: htmlart <type>` fenced div(data-htmlart)를 htmlart_dispatch 훅이 SVG로 렌더.
  #   CDN 없음 — d3@7.9.0(markmap 의존성, 이미 로드)을 재사용. detect_inline 신호로
  #   훅만 조건 주입. cycle 우선 구현, 잔여 타입(process/hierarchy/pyramid)은 점진 전환.
  # ==========================================================================
  - id: htmlart
    component: 구조 도해
    stage: 5
    injection: conditional
    status: applied
    init_hook: htmlart_dispatch
    cdn: []
    detect_fenced_lang: []
    detect_inline:
      - "data-htmlart="

  # ==========================================================================
  # 3D 모델 뷰어 (Issue206) — model-viewer 웹컴포넌트
  #   ```model3d fenced block 본문 = JSON config (src, poster, ar 등).
  #   model-viewer는 ES Module 웹컴포넌트 — module_js CDN 타입 필요 (component-registry.js).
  #   GLB/GLTF 파일을 선언적 JSON으로 표시. 인터랙티브(회전/확대) 기본 내장.
  # ==========================================================================
  - id: model3d
    component: 3D 모델 뷰어
    stage: 5
    injection: conditional
    status: applied
    init_hook: model3d_dispatch
    cdn:
      - type: module_js
        url: https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js
    detect_fenced_lang:
      - "model3d"
    detect_inline: []

  # ==========================================================================
  # Simulation View (Issue207) — p5.js 인터랙티브 시뮬레이션
  #   ```p5 fenced block 본문 = p5 instance(p) + 컨테이너(el) 인자를 받는 JS 코드.
  #   p5.js는 instance mode (new p5(sketchFn, container))로 호출 — 슬라이드별 다중 인스턴스 격리.
  #   p5_dispatch.js가 slidechanged 이벤트에서 비활성 슬라이드 인스턴스를 noLoop()으로 일시정지.
  # ==========================================================================
  - id: p5
    component: Simulation View
    stage: 5
    injection: conditional
    status: applied
    init_hook: p5_dispatch
    cdn:
      - type: js
        url: https://cdn.jsdelivr.net/npm/p5@1.11.2/lib/p5.min.js
    detect_fenced_lang:
      - "p5"
    detect_inline: []
