<!-- @meta
description: 강의용 일반 본문 슬라이드. H2 제목 + 리스트·단락. head-bar(좌/우) + divider.
recommended_for:
  - 일반 본문 슬라이드
  - 리스트·텍스트 단락 슬라이드
  - 챕터 outline 표시 슬라이드
not_recommended_for:
  - 표지·섹션 표지 (cover 사용)
  - 풀스크린 이미지 (blank 사용)
slots:
  - title
  - content
  - head_left
  - head_right
example: |
  ## 학습 목표

  * 핵심 개념 이해
  * 실습 환경 구성
-->
<section class="layout-contents">
  <div class="contents-head-bar">
    <div class="contents-head-left">{{head_left}}</div>
    <div class="contents-head-right">{{head_right}}</div>
  </div>
  <div class="contents-header">
    <h1 class="contents-title">{{title}}</h1>
    <div class="contents-divider"></div>
  </div>
  <div class="contents-body">{{content}}</div>
</section>
