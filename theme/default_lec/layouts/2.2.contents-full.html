<!-- @meta
description: 강의용 head-bar 없는 풀와이드 본문 슬라이드. _contents에서 head 영역 제거한 변형.
recommended_for:
  - 본문 콘텐츠를 더 넓게 표시할 때
  - head-bar outline 불필요한 슬라이드
not_recommended_for:
  - 챕터 outline 표시가 필요한 슬라이드 (_contents 사용)
slots:
  - title
  - content
example: |
  ## 핵심 메시지

  단일 결론 슬라이드 — outline 없이 본문 강조.
-->
<section class="layout-contents-full">
  <div class="contents-header">
    <h1 class="contents-title">{{title}}</h1>
    <div class="contents-divider"></div>
  </div>
  <div class="contents-body">{{content}}</div>
</section>
