  - 챕터 모드 첫 슬라이드 자동 적용 (시스템)

<!--
  Issue138: Map Slide 전용 layout — markmap svg 영역만 보유.
  Cards Page는 `_cards.html`로 분리(Issue138 신규). _toc.html은 markmap 시각화 전담.
-->
<section class="layout-_toc title-slide">
  <header class="toc-page-header">
    <h1 class="toc-page-title">{{title}}</h1>
  </header>
  <div class="toc-markmap">
    <svg class="toc-mindmap-svg"></svg>
  </div>
  <div class="m2-nav-arrows">
    <button class="m2-nav-prev" aria-label="Previous slide"><i class="fa-solid fa-chevron-left"></i></button>
    <button class="m2-nav-next" aria-label="Next slide"><i class="fa-solid fa-chevron-right"></i></button>
  </div>
</section>
