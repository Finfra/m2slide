<!-- @meta
description: 일반 본문 슬라이드. H2 제목 + 리스트·단락 본문. head-bar(좌/우)와 divider를 포함한 기본 layout.
recommended_for:
  - 일반 본문 슬라이드
  - 리스트가 있는 슬라이드
  - 텍스트 단락 슬라이드
  - 챕터 outline 표시가 필요한 슬라이드
not_recommended_for:
  - 표지·섹션 표지 (cover 사용)
  - 제목 없는 풀스크린 이미지 (blank 사용)
slots:
  - title
  - content
  - head_left
  - head_right
example: |
  ## 모듈 분리 전략

  * 진입점 분리
  * 책임별 파일 그룹화
  * 공통 유틸 추출
-->
<section class="layout-_contents">
  <div class="contents-head-bar">
    <div class="contents-head-left">{{head_left}}</div>
    <div class="contents-head-right">{{head_right}}</div>
  </div>
  <div class="contents-header">
    <h1 class="contents-title">{{title}}</h1>
    <div class="contents-divider"></div>
  </div>
  <div class="contents-body">{{content}}</div>
  <div class="m2-nav-arrows">
    <button class="m2-nav-prev" aria-label="Previous slide"><i class="fa-solid fa-chevron-left"></i></button>
    <button class="m2-nav-next" aria-label="Next slide"><i class="fa-solid fa-chevron-right"></i></button>
  </div>
</section>
