<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1275 600" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <!-- 5단계: 내용 재구성 — layout=content 유지 (4.layout.yml).
       변경: ① 나열 카드 4개 → "정의→원리→규칙→공개" 연결 스트립(화살표 라벨)
             ② 비교 레인에 타수 배지(1타/4타) + ✓ 아이콘 병기  ③ 결과 카드 강조 신설
       문구는 원본 재배치. 색은 theme.yml palette (band/green/purple/gold). -->
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#8a8a8a" flood-opacity="0.35"/>
    </filter>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444444"/>
    </marker>
    <marker id="arwG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2ECC71"/>
    </marker>
  </defs>

  <!-- ── 상단: n3sh 스토리 스트립 (정의 → 원리 → 규칙 → 공개) ── -->
  <!-- ① 정의 (band) -->
  <g filter="url(#sh)">
    <rect x="20" y="20" width="284" height="200" rx="10" fill="#ffffff" stroke="#e3e3e3"/>
    <rect x="20" y="20" width="8" height="200" rx="4" fill="#F5C518"/>
  </g>
  <circle cx="58" cy="52" r="16" fill="#F5C518"/>
  <text x="58" y="58" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="84" y="58" font-size="20" font-weight="bold" fill="#222222">n3sh 란</text>
  <text x="48" y="98" font-size="16" fill="#444444">Nowage Shorthand</text>
  <text x="48" y="124" font-size="16" fill="#444444">for 3set 390</text>
  <rect x="44" y="152" width="236" height="50" rx="6" fill="#fdf3cc"/>
  <text x="58" y="173" font-size="14" font-weight="bold" fill="#8a6d00">세벌식 390 자판 위의</text>
  <text x="58" y="193" font-size="14" font-weight="bold" fill="#8a6d00">속기 확장</text>

  <!-- 화살표 ①→② -->
  <line x1="304" y1="120" x2="336" y2="120" stroke="#444444" stroke-width="2.5" marker-end="url(#arw)"/>

  <!-- ② 원리 (green) -->
  <g filter="url(#sh)">
    <rect x="340" y="20" width="284" height="200" rx="10" fill="#ffffff" stroke="#e3e3e3"/>
    <rect x="340" y="20" width="8" height="200" rx="4" fill="#2ECC71"/>
  </g>
  <circle cx="378" cy="52" r="16" fill="#2ECC71"/>
  <text x="378" y="58" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="404" y="58" font-size="20" font-weight="bold" fill="#222222">동시타 원리</text>
  <text x="368" y="98" font-size="16" fill="#444444">자모 2개를 동시에 누르면</text>
  <text x="368" y="124" font-size="16" fill="#444444">완성형 한 글자가 한 번에</text>
  <rect x="364" y="152" width="236" height="50" rx="6" fill="#d9f6e5"/>
  <text x="378" y="173" font-size="14" font-weight="bold" fill="#127a41">자모 2개 → 완성형</text>
  <text x="378" y="193" font-size="14" font-weight="bold" fill="#127a41">한 글자</text>

  <!-- 화살표 ②→③ -->
  <line x1="624" y1="120" x2="656" y2="120" stroke="#444444" stroke-width="2.5" marker-end="url(#arw)"/>

  <!-- ③ 규칙 (purple) -->
  <g filter="url(#sh)">
    <rect x="660" y="20" width="284" height="200" rx="10" fill="#ffffff" stroke="#e3e3e3"/>
    <rect x="660" y="20" width="8" height="200" rx="4" fill="#B9A3E9"/>
  </g>
  <circle cx="698" cy="52" r="16" fill="#B9A3E9"/>
  <text x="698" y="58" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="724" y="58" font-size="20" font-weight="bold" fill="#222222">254개 규칙</text>
  <text x="688" y="98" font-size="16" fill="#444444">자주 나오는 글자를</text>
  <text x="688" y="124" font-size="16" fill="#444444">2타로 줄인다</text>
  <rect x="684" y="152" width="236" height="50" rx="6" fill="#ede7fa"/>
  <text x="698" y="173" font-size="14" font-weight="bold" fill="#5b3fa8">고빈도 글자</text>
  <text x="698" y="193" font-size="14" font-weight="bold" fill="#5b3fa8">2타 단축</text>

  <!-- 화살표 ③→④ -->
  <line x1="944" y1="120" x2="976" y2="120" stroke="#444444" stroke-width="2.5" marker-end="url(#arw)"/>

  <!-- ④ 공개 (gold) -->
  <g filter="url(#sh)">
    <rect x="980" y="20" width="275" height="200" rx="10" fill="#ffffff" stroke="#e3e3e3"/>
    <rect x="980" y="20" width="8" height="200" rx="4" fill="#F6D32D"/>
  </g>
  <circle cx="1018" cy="52" r="16" fill="#F6D32D"/>
  <text x="1018" y="58" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="1044" y="58" font-size="20" font-weight="bold" fill="#222222">macOS 확장</text>
  <text x="1008" y="98" font-size="16" fill="#444444">Karabiner-Elements</text>
  <text x="1008" y="124" font-size="16" fill="#444444">위에서 돈다</text>
  <rect x="1004" y="152" width="232" height="50" rx="6" fill="#fdf3cc"/>
  <text x="1018" y="173" font-size="14" font-weight="bold" fill="#8a6d00">2026-08-30 pqrs</text>
  <text x="1018" y="193" font-size="14" font-weight="bold" fill="#8a6d00">커뮤니티 카탈로그 공개</text>

  <!-- ── 하단: 변환 흐름 비교 ── -->
  <!-- n3sh 레인 (이득=green) -->
  <rect x="20" y="250" width="900" height="150" rx="10" fill="#f2fcf6" stroke="#2ECC71" stroke-width="1.5"/>
  <text x="40" y="282" font-size="17" font-weight="bold" fill="#127a41">n3sh</text>
  <rect x="98" y="266" width="52" height="24" rx="12" fill="#2ECC71"/>
  <text x="124" y="283" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1타</text>
  <g filter="url(#sh)"><rect x="120" y="300" width="200" height="84" rx="8" fill="#ffffff" stroke="#2ECC71"/></g>
  <path d="M 150 318 h 24 v 16 h -24 z M 182 318 h 24 v 16 h -24 z" fill="none" stroke="#2ECC71" stroke-width="2"/>
  <text x="220" y="362" font-size="18" font-weight="bold" fill="#222222" text-anchor="middle">j + h 동시에 누름</text>
  <line x1="320" y1="342" x2="382" y2="342" stroke="#2ECC71" stroke-width="2.5" marker-end="url(#arwG)"/>
  <text x="351" y="330" font-size="13" fill="#127a41" text-anchor="middle">동시타</text>
  <path d="M 440 304 L 486 342 L 440 380 L 394 342 Z" fill="#ffffff" stroke="#2ECC71" stroke-width="2" filter="url(#sh)"/>
  <text x="440" y="348" font-size="16" font-weight="bold" fill="#127a41" text-anchor="middle">n3sh</text>
  <line x1="486" y1="342" x2="548" y2="342" stroke="#2ECC71" stroke-width="2.5" marker-end="url(#arwG)"/>
  <text x="517" y="330" font-size="13" fill="#127a41" text-anchor="middle">변환</text>
  <g filter="url(#sh)"><rect x="556" y="300" width="240" height="84" rx="8" fill="#d9f6e5" stroke="#2ECC71"/></g>
  <text x="676" y="334" font-size="19" font-weight="bold" fill="#127a41" text-anchor="middle">✓ '을 ' 완성</text>
  <text x="676" y="362" font-size="15" fill="#127a41" text-anchor="middle">공백 포함 · 1타</text>

  <!-- 일반 타건 레인 -->
  <rect x="20" y="420" width="900" height="150" rx="10" fill="#f7f7f7" stroke="#bbbbbb" stroke-width="1.5"/>
  <text x="40" y="452" font-size="17" font-weight="bold" fill="#666666">일반 타건</text>
  <rect x="128" y="436" width="52" height="24" rx="12" fill="#888888"/>
  <text x="154" y="453" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">4타</text>
  <g filter="url(#sh)"><rect x="120" y="470" width="200" height="84" rx="8" fill="#ffffff" stroke="#bbbbbb"/></g>
  <path d="M 150 488 h 24 v 16 h -24 z" fill="none" stroke="#888888" stroke-width="2"/>
  <text x="220" y="532" font-size="18" font-weight="bold" fill="#222222" text-anchor="middle">한 타씩 순차 입력</text>
  <line x1="320" y1="512" x2="548" y2="512" stroke="#888888" stroke-width="2.5" marker-end="url(#arw)"/>
  <text x="434" y="500" font-size="13" fill="#666666" text-anchor="middle">순차 입력</text>
  <g filter="url(#sh)"><rect x="556" y="470" width="240" height="84" rx="8" fill="#ffffff" stroke="#bbbbbb"/></g>
  <text x="676" y="504" font-size="19" font-weight="bold" fill="#444444" text-anchor="middle">ㅇ → ㅡ → ㄹ → ␣</text>
  <text x="676" y="532" font-size="15" fill="#666666" text-anchor="middle">4타</text>

  <!-- 결과 카드 (신설·강조) -->
  <line x1="796" y1="342" x2="960" y2="392" stroke="#2ECC71" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="796" y1="512" x2="960" y2="462" stroke="#888888" stroke-width="2" stroke-dasharray="5,5"/>
  <g filter="url(#sh)"><rect x="950" y="377" width="305" height="100" rx="10" fill="#d9f6e5" stroke="#2ECC71" stroke-width="2"/></g>
  <text x="1102" y="419" font-size="21" font-weight="bold" fill="#127a41" text-anchor="middle">같은 결과</text>
  <text x="1102" y="451" font-size="19" font-weight="bold" fill="#127a41" text-anchor="middle">절반 이하 타수</text>
</svg>
