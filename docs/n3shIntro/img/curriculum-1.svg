<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 650" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <!-- 7단계 발행본 — 7.pptx 와 같은 말을 하는 벡터본 (5.svg 기반 + 7단계 신규 문구 반영) -->
  <defs>
    <linearGradient id="titleBand7" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F5C518"/>
      <stop offset="1" stop-color="#E8A000"/>
    </linearGradient>
    <filter id="shadow7" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1e3a5f" flood-opacity="0.18"/>
    </filter>
    <marker id="arr7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555555"/>
    </marker>
    <marker id="arr7g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B8860B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1300" height="650" fill="#f6f8fb"/>

  <!-- 제목 밴드 -->
  <rect x="0" y="0" width="1300" height="80" fill="url(#titleBand7)"/>
  <text x="70" y="32" font-size="14" fill="#5c4a00">학습 커리큘럼</text>
  <text x="70" y="62" font-size="32" font-weight="700" fill="#111111">예비 + 6단계 드릴</text>

  <!-- 불릿 카드 4장 -->
  <g filter="url(#shadow7)">
    <rect x="90" y="100" width="1120" height="48" rx="8" fill="#ffffff"/>
    <rect x="90" y="160" width="1120" height="48" rx="8" fill="#ffffff"/>
    <rect x="90" y="220" width="1120" height="48" rx="8" fill="#ffffff"/>
    <rect x="90" y="280" width="1120" height="48" rx="8" fill="#ffffff"/>
  </g>
  <rect x="90" y="100" width="6" height="48" rx="3" fill="#E8A000"/>
  <rect x="90" y="160" width="6" height="48" rx="3" fill="#4CAF50"/>
  <rect x="90" y="220" width="6" height="48" rx="3" fill="#4CAF50"/>
  <rect x="90" y="280" width="6" height="48" rx="3" fill="#8a8a8a"/>

  <text x="120" y="131" font-size="20" fill="#222222">254개 규칙을 <tspan fill="#E8A000" font-weight="700">가성비 순서</tspan>로 재배열 — 몰라도 손해가 없고, 아는 만큼 이득</text>
  <text x="120" y="191" font-size="20" fill="#222222">판정 4축: <tspan fill="#3d8b40" font-weight="700">모디파이어 없음 · 니모닉 강함 · 규칙 재사용성 · 문법적 필수성</tspan></text>
  <text x="120" y="251" font-size="20" fill="#222222"><tspan fill="#3d8b40" font-weight="700">2단계(조사·어미)까지만 익혀도</tspan> 일상 타이핑에서 이득이 난다</text>
  <text x="120" y="311" font-size="20" fill="#222222">문서 사이트가 설치 → 치트시트 → 6단계 드릴 → 전체 규칙표 순으로 안내</text>

  <!-- 섹션 밴드 -->
  <rect x="90" y="352" width="1120" height="30" rx="4" fill="#ececec"/>
  <text x="106" y="373" font-size="16" font-weight="700" fill="#555555">6단계 학습 플로우</text>

  <!-- 6단계 플로우 카드 (pptx 카드와 동일 문구·순서: 배지 → 제목 → 부제) -->
  <g filter="url(#shadow7)">
    <rect x="90"  y="410" width="170" height="66" rx="10" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5"/>
    <rect x="310" y="410" width="200" height="66" rx="10" fill="#ffffff" stroke="#4CAF50" stroke-width="1.5"/>
    <rect x="560" y="410" width="200" height="66" rx="10" fill="#fffbea" stroke="#E8A000" stroke-width="2.5"/>
    <rect x="810" y="410" width="190" height="66" rx="10" fill="#ffffff" stroke="#9370DB" stroke-width="1.5"/>
    <rect x="1050" y="410" width="170" height="66" rx="10" fill="#ffffff" stroke="#5E48B0" stroke-width="1.5"/>
    <rect x="900" y="556" width="240" height="60" rx="10" fill="#E8A000"/>
  </g>

  <circle cx="110" cy="420" r="15" fill="#8a8a8a"/>
  <text x="110" y="425" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">예</text>
  <text x="175" y="440" font-size="17" font-weight="700" fill="#333333" text-anchor="middle">예비</text>
  <text x="175" y="462" font-size="14" fill="#666666" text-anchor="middle">자모 대응</text>

  <circle cx="330" cy="420" r="15" fill="#4CAF50"/>
  <text x="330" y="425" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="410" y="440" font-size="17" font-weight="700" fill="#333333" text-anchor="middle">1단계</text>
  <text x="410" y="462" font-size="14" fill="#666666" text-anchor="middle">쌍자음·이중모음</text>

  <circle cx="580" cy="420" r="15" fill="#E8A000"/>
  <text x="580" y="425" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="660" y="440" font-size="17" font-weight="700" fill="#8a6d00" text-anchor="middle">2단계 ★</text>
  <text x="660" y="462" font-size="14" fill="#666666" text-anchor="middle">조사·어미</text>

  <circle cx="830" cy="420" r="15" fill="#9370DB"/>
  <text x="830" y="426" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">3·4</text>
  <text x="905" y="440" font-size="17" font-weight="700" fill="#333333" text-anchor="middle">3~4단계</text>
  <text x="905" y="462" font-size="14" fill="#666666" text-anchor="middle">고빈도 글자</text>

  <circle cx="1070" cy="420" r="15" fill="#5E48B0"/>
  <text x="1070" y="426" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">5·6</text>
  <text x="1135" y="440" font-size="17" font-weight="700" fill="#333333" text-anchor="middle">5~6단계</text>
  <text x="1135" y="462" font-size="14" fill="#666666" text-anchor="middle">받침 계열</text>

  <!-- 결과 카드 -->
  <text x="1020" y="583" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">✓ 실전 투입</text>
  <text x="1020" y="605" font-size="13" fill="#fff4d1" text-anchor="middle">일상 타이핑에서 이득</text>

  <!-- 연결 화살표 -->
  <line x1="260" y1="443" x2="303" y2="443" stroke="#555555" stroke-width="2" marker-end="url(#arr7)"/>
  <line x1="510" y1="443" x2="553" y2="443" stroke="#555555" stroke-width="2" marker-end="url(#arr7)"/>
  <line x1="760" y1="443" x2="803" y2="443" stroke="#555555" stroke-width="2" marker-end="url(#arr7)"/>
  <text x="781" y="402" font-size="12" fill="#777777" text-anchor="middle">계속 학습</text>
  <line x1="1000" y1="443" x2="1043" y2="443" stroke="#555555" stroke-width="2" marker-end="url(#arr7)"/>
  <path d="M660,476 C660,520 750,564 893,584" fill="none" stroke="#B8860B" stroke-width="2.2" stroke-dasharray="6,4" marker-end="url(#arr7g)"/>
  <text x="700" y="552" font-size="13" font-weight="700" fill="#8a6d00">여기까지만 해도 이득 발생</text>

  <!-- footer -->
  <text x="90" y="642" font-size="13" fill="#777777">2단계까지만 익혀도 이득 — 문서 사이트: 설치 → 치트시트 → 6단계 드릴 → 전체 규칙표</text>
</svg>
