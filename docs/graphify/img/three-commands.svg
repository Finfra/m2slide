<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <style>
      text { font-family: 'Apple SD Gothic Neo', 'Pretendard', 'Noto Sans KR', sans-serif; }
    </style>
  </defs>

  <!-- 배경 -->
  <rect width="800" height="500" fill="#f8fafc" rx="12"/>

  <!-- 제목 -->
  <text x="400" y="46" font-size="18" fill="#1e293b" text-anchor="middle" font-weight="bold">graphify 핵심 CLI 3종</text>
  <line x1="100" y1="58" x2="700" y2="58" stroke="#cbd5e1" stroke-width="1"/>

  <!-- ── 카드 1: query ── -->
  <rect x="30" y="76" width="228" height="390" fill="#eff6ff" rx="12" stroke="#3b82f6" stroke-width="2"/>
  <!-- 헤더 색상 띠 -->
  <rect x="30" y="76" width="228" height="6" fill="#3b82f6" rx="12"/>
  <rect x="30" y="82" width="228" height="6" fill="#3b82f6"/>

  <!-- 아이콘 원 -->
  <circle cx="144" cy="138" r="32" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="144" y="147" font-size="26" text-anchor="middle">🔍</text>

  <!-- 명령어 -->
  <rect x="48" y="185" width="192" height="32" fill="#1e293b" rx="6" stroke="#3b82f6" stroke-width="1"/>
  <text x="144" y="206" font-size="12" fill="#93c5fd" text-anchor="middle" font-family="monospace" font-weight="bold">graphify query</text>

  <text x="144" y="244" font-size="16" fill="#1d4ed8" text-anchor="middle" font-weight="bold">BFS 그래프 탐색</text>

  <line x1="60" y1="256" x2="228" y2="256" stroke="#bfdbfe" stroke-width="1"/>

  <text x="144" y="282" font-size="12" fill="#475569" text-anchor="middle">자연어 질문 →</text>
  <text x="144" y="300" font-size="12" fill="#475569" text-anchor="middle">관련 노드 + 관계 반환</text>

  <!-- 예시 -->
  <rect x="46" y="320" width="196" height="72" fill="#1e293b" rx="6"/>
  <text x="58" y="340" font-size="10" fill="#64748b" font-family="monospace"># 예시</text>
  <text x="58" y="358" font-size="10" fill="#93c5fd" font-family="monospace">graphify query \</text>
  <text x="58" y="374" font-size="10" fill="#93c5fd" font-family="monospace">  "A와 B 관계?"</text>
  <text x="58" y="390" font-size="10" fill="#86efac" font-family="monospace">→ A imports B (0.92)</text>

  <text x="144" y="444" font-size="11" fill="#64748b" text-anchor="middle">관계 질문에 최적</text>

  <!-- ── 카드 2: path ── -->
  <rect x="286" y="76" width="228" height="390" fill="#f0fdf4" rx="12" stroke="#22c55e" stroke-width="2"/>
  <rect x="286" y="76" width="228" height="6" fill="#22c55e" rx="12"/>
  <rect x="286" y="82" width="228" height="6" fill="#22c55e"/>

  <circle cx="400" cy="138" r="32" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="400" y="147" font-size="26" text-anchor="middle">🗺️</text>

  <rect x="304" y="185" width="192" height="32" fill="#1e293b" rx="6" stroke="#22c55e" stroke-width="1"/>
  <text x="400" y="206" font-size="12" fill="#86efac" text-anchor="middle" font-family="monospace" font-weight="bold">graphify path</text>

  <text x="400" y="244" font-size="16" fill="#15803d" text-anchor="middle" font-weight="bold">두 개념 최단 경로</text>

  <line x1="316" y1="256" x2="484" y2="256" stroke="#bbf7d0" stroke-width="1"/>

  <text x="400" y="282" font-size="12" fill="#475569" text-anchor="middle">개념 A → 개념 B</text>
  <text x="400" y="300" font-size="12" fill="#475569" text-anchor="middle">연결 경로 추적</text>

  <rect x="302" y="320" width="196" height="72" fill="#1e293b" rx="6"/>
  <text x="314" y="340" font-size="10" fill="#64748b" font-family="monospace"># 예시</text>
  <text x="314" y="358" font-size="10" fill="#86efac" font-family="monospace">graphify path \</text>
  <text x="314" y="374" font-size="10" fill="#86efac" font-family="monospace">  "Info.md" "slide"</text>
  <text x="314" y="390" font-size="10" fill="#bbf7d0" font-family="monospace">→ 4홉 경로 발견</text>

  <text x="400" y="444" font-size="11" fill="#64748b" text-anchor="middle">A↔B 연결 추적에 최적</text>

  <!-- ── 카드 3: explain ── -->
  <rect x="542" y="76" width="228" height="390" fill="#faf5ff" rx="12" stroke="#a855f7" stroke-width="2"/>
  <rect x="542" y="76" width="228" height="6" fill="#a855f7" rx="12"/>
  <rect x="542" y="82" width="228" height="6" fill="#a855f7"/>

  <circle cx="656" cy="138" r="32" fill="#f3e8ff" stroke="#a855f7" stroke-width="2"/>
  <text x="656" y="147" font-size="26" text-anchor="middle">📖</text>

  <rect x="560" y="185" width="192" height="32" fill="#1e293b" rx="6" stroke="#a855f7" stroke-width="1"/>
  <text x="656" y="206" font-size="12" fill="#d8b4fe" text-anchor="middle" font-family="monospace" font-weight="bold">graphify explain</text>

  <text x="656" y="244" font-size="16" fill="#7e22ce" text-anchor="middle" font-weight="bold">노드 자연어 설명</text>

  <line x1="572" y1="256" x2="740" y2="256" stroke="#e9d5ff" stroke-width="1"/>

  <text x="656" y="282" font-size="12" fill="#475569" text-anchor="middle">개념명 입력 →</text>
  <text x="656" y="300" font-size="12" fill="#475569" text-anchor="middle">역할·의존성 설명 반환</text>

  <rect x="558" y="320" width="196" height="72" fill="#1e293b" rx="6"/>
  <text x="570" y="340" font-size="10" fill="#64748b" font-family="monospace"># 예시</text>
  <text x="570" y="358" font-size="10" fill="#d8b4fe" font-family="monospace">graphify explain \</text>
  <text x="570" y="374" font-size="10" fill="#d8b4fe" font-family="monospace">  "layout-selector"</text>
  <text x="570" y="390" font-size="10" fill="#e9d5ff" font-family="monospace">→ 역할 + 관련 파일</text>

  <text x="656" y="444" font-size="11" fill="#64748b" text-anchor="middle">개념 이해에 최적</text>

  <!-- 하단 공통 설명 -->
  <text x="400" y="486" font-size="11" fill="#475569" text-anchor="middle">세 명령 모두 graphify-out/ 직접 Read 없이 필요 정보만 반환 — 토큰 절약</text>
</svg>
