<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <style>
      text { font-family: 'Apple SD Gothic Neo', 'Pretendard', 'Noto Sans KR', sans-serif; }
    </style>
  </defs>

  <!-- 배경 -->
  <rect width="800" height="500" fill="#f8fafc" rx="12"/>

  <!-- 좌측 패널 (Before) 배경 -->
  <rect x="20" y="20" width="360" height="460" fill="#fff1f2" rx="10" stroke="#fca5a5" stroke-width="1.5"/>
  <!-- 우측 패널 (After) 배경 -->
  <rect x="420" y="20" width="360" height="460" fill="#f0fdf4" rx="10" stroke="#86efac" stroke-width="1.5"/>

  <!-- 중앙 화살표 -->
  <polygon points="395,230 380,215 380,225 370,225 370,235 380,235 380,245" fill="#f59e0b"/>
  <rect x="395" y="225" width="15" height="10" fill="#f59e0b"/>
  <polygon points="410,220 425,230 410,240" fill="#f59e0b"/>
  <text x="397" y="270" font-size="11" fill="#b45309" text-anchor="middle" font-weight="bold">/graphify .</text>

  <!-- ── Before 패널 ── -->
  <text x="200" y="56" font-size="16" fill="#dc2626" text-anchor="middle" font-weight="bold">BEFORE</text>
  <text x="200" y="76" font-size="12" fill="#b91c1c" text-anchor="middle">파일 전체를 LLM에 올림</text>

  <!-- 파일 아이콘 군집 (혼돈) -->
  <!-- 파일 아이콘 1 -->
  <rect x="55"  y="100" width="32" height="40" fill="#fecaca" stroke="#ef4444" stroke-width="1" rx="3"/>
  <text x="71"  y="125" font-size="9" fill="#991b1b" text-anchor="middle">lib.js</text>
  <!-- 파일 아이콘 2 -->
  <rect x="100" y="88"  width="32" height="40" fill="#fecaca" stroke="#ef4444" stroke-width="1" rx="3"/>
  <text x="116" y="113" font-size="9" fill="#991b1b" text-anchor="middle">auth.py</text>
  <!-- 파일 아이콘 3 -->
  <rect x="148" y="104" width="32" height="40" fill="#fecaca" stroke="#ef4444" stroke-width="1" rx="3"/>
  <text x="164" y="129" font-size="9" fill="#991b1b" text-anchor="middle">db.ts</text>
  <!-- 파일 아이콘 4 -->
  <rect x="195" y="92"  width="32" height="40" fill="#fecaca" stroke="#ef4444" stroke-width="1" rx="3"/>
  <text x="211" y="117" font-size="9" fill="#991b1b" text-anchor="middle">api.rs</text>
  <!-- 파일 아이콘 5 -->
  <rect x="240" y="106" width="32" height="40" fill="#fecaca" stroke="#ef4444" stroke-width="1" rx="3"/>
  <text x="256" y="131" font-size="9" fill="#991b1b" text-anchor="middle">utils.go</text>
  <!-- 파일 아이콘 6 -->
  <rect x="286" y="90"  width="32" height="40" fill="#fecaca" stroke="#ef4444" stroke-width="1" rx="3"/>
  <text x="302" y="115" font-size="9" fill="#991b1b" text-anchor="middle">main.rb</text>
  <!-- 2행 -->
  <rect x="65"  y="155" width="32" height="40" fill="#fecaca" stroke="#ef4444" stroke-width="1" rx="3"/>
  <text x="81"  y="180" font-size="9" fill="#991b1b" text-anchor="middle">svc.kt</text>
  <rect x="115" y="162" width="32" height="40" fill="#fecaca" stroke="#ef4444" stroke-width="1" rx="3"/>
  <text x="131" y="187" font-size="9" fill="#991b1b" text-anchor="middle">dto.cs</text>
  <rect x="165" y="150" width="32" height="40" fill="#fecaca" stroke="#ef4444" stroke-width="1" rx="3"/>
  <text x="181" y="175" font-size="9" fill="#991b1b" text-anchor="middle">cfg.yml</text>
  <rect x="215" y="160" width="32" height="40" fill="#fecaca" stroke="#ef4444" stroke-width="1" rx="3"/>
  <text x="231" y="185" font-size="9" fill="#991b1b" text-anchor="middle">test.py</text>
  <rect x="265" y="152" width="32" height="40" fill="#fecaca" stroke="#ef4444" stroke-width="1" rx="3"/>
  <text x="281" y="177" font-size="9" fill="#991b1b" text-anchor="middle">pkg.json</text>
  <!-- 혼돈 연결선 -->
  <line x1="87"  y1="120" x2="164" y2="129" stroke="#ef4444" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  <line x1="164" y1="110" x2="256" y2="131" stroke="#ef4444" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  <line x1="116" y1="128" x2="211" y2="117" stroke="#ef4444" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  <line x1="211" y1="132" x2="302" y2="115" stroke="#ef4444" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  <line x1="131" y1="202" x2="231" y2="200" stroke="#ef4444" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>

  <!-- 토큰 미터 -->
  <rect x="40" y="220" width="300" height="28" fill="#fef2f2" rx="4" stroke="#ef4444" stroke-width="1"/>
  <rect x="42" y="222" width="270" height="24" fill="#fca5a5" rx="3"/>
  <text x="190" y="239" font-size="12" fill="#7f1d1d" text-anchor="middle" font-weight="bold">토큰 폭탄 💥  수백 KB</text>

  <!-- 문제 bullet -->
  <text x="50" y="275" font-size="13" fill="#dc2626">❌  grep — 파일 위치만, 관계 모름</text>
  <text x="50" y="300" font-size="13" fill="#dc2626">❌  전체 Read — 컨텍스트 한계</text>
  <text x="50" y="325" font-size="13" fill="#dc2626">❌  의존성 파악 불가</text>

  <!-- 결과 박스 -->
  <rect x="40" y="350" width="300" height="50" fill="#fee2e2" rx="6" stroke="#ef4444" stroke-width="1.5"/>
  <text x="190" y="370" font-size="13" fill="#991b1b" text-anchor="middle" font-weight="bold">LLM 정확도 저하</text>
  <text x="190" y="390" font-size="12" fill="#b91c1c" text-anchor="middle">개발자 시간 낭비</text>

  <!-- 파일 수 텍스트 -->
  <text x="190" y="455" font-size="12" fill="#9f1239" text-anchor="middle">수백 ~ 수천 개 파일</text>

  <!-- ── After 패널 ── -->
  <text x="600" y="56" font-size="16" fill="#16a34a" text-anchor="middle" font-weight="bold">AFTER</text>
  <text x="600" y="76" font-size="12" fill="#15803d" text-anchor="middle">graphify → 필요 노드만</text>

  <!-- graphify-out 폴더 아이콘 -->
  <rect x="510" y="95" width="180" height="100" fill="#dcfce7" rx="8" stroke="#22c55e" stroke-width="1.5"/>
  <text x="600" y="120" font-size="12" fill="#15803d" text-anchor="middle" font-weight="bold">graphify-out/</text>
  <text x="600" y="142" font-size="11" fill="#166534" text-anchor="middle">graph.json</text>
  <text x="600" y="158" font-size="11" fill="#166534" text-anchor="middle">GRAPH_REPORT.md</text>
  <text x="600" y="174" font-size="11" fill="#166534" text-anchor="middle">graph.html</text>

  <!-- CLI 터미널 -->
  <rect x="450" y="215" width="300" height="110" fill="#1e293b" rx="6" stroke="#22c55e" stroke-width="1"/>
  <rect x="450" y="215" width="300" height="22" fill="#334155" rx="6"/>
  <circle cx="466" cy="226" r="5" fill="#ff5f57"/>
  <circle cx="482" cy="226" r="5" fill="#ffbd2e"/>
  <circle cx="498" cy="226" r="5" fill="#28c840"/>
  <text x="600" y="228" font-size="10" fill="#94a3b8" text-anchor="middle">terminal</text>
  <text x="460" y="252" font-size="11" fill="#67e8f9" font-family="monospace">$ graphify query "A와 B 관계"</text>
  <text x="460" y="270" font-size="11" fill="#86efac" font-family="monospace">→ A imports B via util.js</text>
  <text x="460" y="288" font-size="11" fill="#86efac" font-family="monospace">→ confidence: 0.92</text>
  <text x="460" y="306" font-size="11" fill="#94a3b8" font-family="monospace">3 tokens used</text>

  <!-- After bullet -->
  <text x="450" y="355" font-size="13" fill="#16a34a">✅  사전 분석 → 캐시 1회</text>
  <text x="450" y="378" font-size="13" fill="#16a34a">✅  필요 노드만 → 토큰 최소화</text>
  <text x="450" y="401" font-size="13" fill="#16a34a">✅  숨겨진 관계 자동 발견</text>

  <!-- 결과 박스 -->
  <rect x="440" y="420" width="320" height="40" fill="#dcfce7" rx="6" stroke="#22c55e" stroke-width="1.5"/>
  <text x="600" y="445" font-size="13" fill="#166534" text-anchor="middle" font-weight="bold">정확한 답변 · 토큰 절약 ✨</text>
</svg>
